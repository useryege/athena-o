function render(){
 setContext(title(),view);
 $('#content').innerHTML=`<div class="page-heading"><div><h1>${title()}</h1><p class="description">${view==='proposals'?'Proposed oracle values and their Polygon transaction evidence.':'Disputed oracle requests and the accounts involved.'}</p></div><div class="page-actions"><button class="btn secondary" id="refresh">${icon('refresh')}Refresh</button></div></div><nav class="page-tabs oo-tabs" aria-label="Managed OO pages"><a href="?view=proposals"${view==='proposals'?' aria-current="page"':''}>Proposals</a><a href="?view=disputes"${view==='disputes'?' aria-current="page"':''}>Disputes</a></nav>${writable()?`<section class="panel parse-panel" aria-labelledby="parse-title"><h2 id="parse-title">Parse one Polygon block</h2><form id="parse-form"><div class="parse-line"><div class="field"><label for="scan-block">Block number</label><input id="scan-block" inputmode="numeric" autocomplete="off" placeholder="Enter a Polygon block" value="${esc(block)}" aria-describedby="parse-hint"></div><button class="btn primary" id="parse-block" type="submit"${block?'':' disabled'}>${icon('search')}Parse block</button>${block?'<button class="btn secondary" data-clear-block type="button">Clear block filter</button>':''}</div><p class="field-hint" id="parse-hint">Read events from one block, then show its proposals or disputes.</p><p class="field-error" id="block-error" role="alert" hidden></p></form>${scanMessage?`<p class="parse-result ${scanFailure?'error':''}" role="status">${esc(scanMessage)}</p>`:''}</section>`:block?`<p class="muted-note">Showing Polygon block <span class="num">${esc(block)}</span>.</p>`:''}<section class="panel" aria-label="${view==='proposals'?'Proposal':'Dispute'} records" id="list-panel"></section>${footer()}`;
 renderList();
 $('#refresh').onclick=()=>{scenario='default';scanMessage='';render();notify('Synthetic saved events refreshed in this preview.')};
 if($('#parse-form')){$('#parse-form').onsubmit=scan;$('#scan-block').oninput=()=>{$('#parse-block').disabled=!$('#scan-block').value.trim()};}
}
function renderList(){
 if(scenario==='loading'){$('#list-panel').innerHTML='<div role="status" aria-label="Loading oracle events" aria-busy="true">'+Array.from({length:3},()=>'<div class="loading-record"><div class="skeleton"></div><div class="skeleton" style="width:40%"></div></div>').join('')+'</div>';return}
 if(scenario==='error'){$('#list-panel').innerHTML='<div class="empty"><h2>Could not load oracle events</h2><p>Your current query is preserved. Try loading the records again.</p><button class="btn secondary" data-retry>Try again</button></div>';return}
 const all=allItems(),count=all.length,pages=Math.max(1,Math.ceil(count/pageSize));page=Math.min(page,pages);const shown=all.slice((page-1)*pageSize,page*pageSize);
 $('#list-panel').innerHTML=`<div class="oo-summary"><span>${count} ${view}${block?` · Block ${esc(block)}`:''}</span><span>Times · UTC+8</span></div>${!shown.length?`<div class="empty"><h2>${block?'No saved events for this block':'No oracle events to show'}</h2><p>${block?'Choose another block or clear the filter to return to all saved events.':'Saved '+view+' will appear here when they are available.'}</p>${block&&writable()?'<button class="btn secondary" data-clear-block>Clear block filter</button>':'<button class="btn secondary" data-retry>Refresh records</button>'}</div>`:`<div class="oo-records"><div class="oo-head" aria-hidden="true"><span>Question / Market</span><span>Block</span><span>Proposed price</span><span>Request time</span><span class="actor-head">${view==='proposals'?'Proposer':'Disputer'}</span></div>${shown.map(item=>record(item)).join('')}</div>`}<div class="panel-foot oo-foot"><p class="summary-page">${count?`${(page-1)*pageSize+1}–${Math.min(page*pageSize,count)} of ${count}`:'0 records'}</p><nav class="pagination" aria-label="Pagination"><button class="icon-button previous" aria-label="Previous page" data-page="${page-1}"${page<=1?' disabled':''}>${icon('chevron')}</button><span class="page-number" aria-current="page">${page}</span><button class="icon-button" aria-label="Next page" data-page="${page+1}"${page>=pages?' disabled':''}>${icon('chevron')}</button></nav><label class="page-size">Per page<select id="page-size" aria-label="Records per page">${[10,50,100].map(x=>`<option${x===pageSize?' selected':''}>${x}</option>`).join('')}</select></label></div>`;
}
function record(item){const [date,time]=dateParts(item.requestTimestamp),who=view==='proposals'?item.proposer:item.disputer,key=item.txHash+':'+item.logIndex;return `<article class="oo-row" data-record="${key}"><div class="oo-question"><button class="oo-title" data-open="${key}">${esc(item.question||'Market '+item.marketId)}</button>${!item.question?'<p class="meta unknown">Question not available</p>':''}<div class="market-reference"><span>Market <span class="mono">${esc(item.marketId||'Unknown')}</span></span>${item.polymarketUrl?external(item.polymarketUrl,'Polymarket'):'<span class="meta">Market link unavailable</span>'}</div></div><div class="oo-block"><span class="mobile-label">Block</span><span class="num">${esc(item.blockNumber)}</span><p class="meta">Log ${esc(item.logIndex)}</p></div><div class="oo-price"><span class="mobile-label">Proposed price</span><div class="oracle-value">${esc(item.proposedPrice)}</div><p class="meta">Raw oracle value</p></div><div class="oo-time"><span class="mobile-label">Request time</span><time>${date}</time><span class="meta num">${time}</span></div><div class="oo-actor"><span class="mobile-label">${view==='proposals'?'Proposer':'Disputer'}</span><div class="data-line"><span class="mono">${esc(who||'Unknown')}</span>${who?copy(who,view==='proposals'?'proposer address':'disputer address'):''}</div><div class="tx-reference">${external(polygon(item),'Transaction')}</div><button class="detail-link" data-open="${key}">View evidence${icon('chevron')}</button></div></article>`}
function fact(label,value,asCode=false,wide=false){return `<div${wide?' class="wide"':''}><dt>${esc(label)}</dt><dd>${asCode?`<div class="data-line"><span class="mono">${esc(value||'Unknown')}</span>${value?copy(value,label):''}</div>`:esc(value===0?'0':value||'Unknown')}</dd></div>`}
function detail(key){const item=allItems().find(x=>x.txHash+':'+x.logIndex===key);if(!item)return;openDialog(view==='proposals'?'Proposal details':'Dispute details',`<section class="evidence-section"><h3 class="evidence-heading">${esc(item.question||'Market '+item.marketId)}</h3><div class="evidence-links">${external(polygon(item),'Polygonscan')}${item.polymarketUrl?external(item.polymarketUrl,'Polymarket'):''}</div><dl class="facts">${fact('Block',String(item.blockNumber))}${fact('Log index',String(item.logIndex))}${fact('Transaction',item.txHash,true,true)}${fact('Transaction index',String(item.txIndex))}${fact('Fetched at',new Date(item.fetchedAt).toLocaleString('en-GB',{timeZone:'Asia/Shanghai',hour12:false})+' UTC+8')}${fact('Requester',item.requester,true,true)}${fact('Proposer',item.proposer,true,true)}${'disputer'in item?fact('Disputer',item.disputer,true,true):''}</dl></section><section class="evidence-section"><h3 class="evidence-heading">Oracle request</h3><dl class="facts">${fact('Identifier',item.identifier,true,true)}${fact('Proposed price',item.proposedPrice,false,true)}${fact('Request time',fullTime(item.requestTimestamp))}${fact('Request timestamp',String(item.requestTimestamp))}${'expirationTimestamp'in item?fact('Expiration',fullTime(item.expirationTimestamp))+fact('Expiration timestamp',String(item.expirationTimestamp))+fact('Currency',item.currency,true,true):''}</dl></section><section class="evidence-section"><h3 class="evidence-heading">Market reference</h3><dl class="facts">${fact('Market ID',item.marketId,true)}${fact('Condition ID',item.conditionId,true,true)}${fact('Event slug',item.eventSlug,true,true)}${fact('Market slug',item.marketSlug,true,true)}</dl></section><details class="evidence-section raw-evidence"><summary>${icon('down')}Raw chain data</summary><dl class="facts">${fact('Block hash',item.blockHash,true,true)}${fact('Contract',item.contractAddress,true,true)}${fact('Topic',item.topic,true,true)}${fact('Ancillary data',item.ancillaryDataText,true,true)}${fact('Ancillary data hex',item.ancillaryDataHex,true,true)}${fact('Raw topics',item.rawTopics,true,true)}${fact('Raw data',item.rawData,true,true)}</dl></details>`,'<button class="btn secondary" data-close-dialog>Close</button>',{drawer:true})}
async function scan(e){e.preventDefault();if(!writable())return;const value=$('#scan-block').value.trim(),error=$('#block-error');if(!safeBlock(value)){error.hidden=false;error.textContent='Enter a positive Polygon block number within the safe integer range.';$('#scan-block').setAttribute('aria-invalid','true');$('#scan-block').focus();return}error.hidden=true;$('#scan-block').removeAttribute('aria-invalid');$('#parse-block').disabled=true;$('#scan-block').disabled=true;$('#parse-block').textContent='Parsing preview…';await new Promise(resolve=>setTimeout(resolve,250));if(scenario==='scan-error'){scanMessage='Preview failure: the block could not be parsed. Your block number is preserved; try again.';scanFailure=true;const input=value;render();$('#scan-block').value=input;$('#parse-block').disabled=false;return}block=String(Number(value));page=1;const pc=DEMO.proposals.filter(x=>String(x.blockNumber)===block).length,dc=DEMO.disputes.filter(x=>String(x.blockNumber)===block).length;scanMessage=`Preview result: ${pc} proposals, ${dc} disputes in synthetic block ${block}. No Polygon scan was run.`;scanFailure=false;syncURL();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)detail(b.dataset.open);if(b.dataset.page){page=Number(b.dataset.page);syncURL();renderList()}if(b.hasAttribute('data-clear-block')){block='';page=1;scanMessage='';syncURL();render()}if(b.hasAttribute('data-retry')){scenario='default';render()}if(b.dataset.case){scenario=b.dataset.case;page=1;block='';scanMessage='';const p=new URLSearchParams(location.search);p.set('case',scenario);p.delete('block');p.delete('block_number');history.replaceState(null,'','?'+p);render()}});
document.addEventListener('change',e=>{if(e.target.id==='page-size'){pageSize=Number(e.target.value);page=1;syncURL();renderList()}});
render();if(scenario==='detail')detail(DEMO[view][0].txHash+':'+DEMO[view][0].logIndex);
</script></body></html>
