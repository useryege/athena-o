function filtered(){if(view==='empty')return [];return items.filter(x=>kind==='wallets'?(walletType==='all'||x.walletType===walletType)&&(!query||`${x.remark} ${x.address}`.toLowerCase().includes(query.toLowerCase())):(!query||x.name.toLowerCase().includes(query.toLowerCase())||x.symbol.toLowerCase().includes(query.toLowerCase())||x.mint.includes(query)))}

 const found=filtered(),rows=found.slice((page-1)*pageSize,page*pageSize);if(!found.length){target.innerHTML=`<div class="empty"><h2>${query?'No matching '+(kind==='wallets'?'wallets':'candidates'):kind==='wallets'?'No wallets yet':'No discovered candidates yet'}</h2><p>${query?'Try another search or clear the filters.':kind==='wallets'?'Create or import your first EVM or Solana wallet.':'Refresh to read the saved discovery results. Refresh does not start a scan.'}</p><button class="btn secondary" data-clear>Clear filters</button></div>`;return}
 if(kind==='wallets')target.innerHTML=`<div class="list-summary"><span>${found.length} wallets</span><span>Times · UTC+8</span></div><div class="records"><div class="wallet-head" aria-hidden="true"><span>Wallet / Address</span><span>Type</span><span>Source</span><span class="wallet-created">Created</span><span class="sr-only">Details</span></div>${rows.map(w=>`<article class="wallet-row" aria-label="${esc(w.remark)}"><div class="wallet-identity">${avatar(w)}<div><button class="title-button" data-wallet="${w.id}">${esc(w.remark)}</button><div class="address-line"><span class="mono">${esc(w.address)}</span>${copy(w.address,w.remark+' address')}</div></div></div><div class="wallet-type"><span class="mobile-label">Type</span>${badge(w.walletType)}</div><div class="wallet-source"><span class="mobile-label">Source</span><span class="source">${source(w.source)}</span></div><div class="wallet-created"><span class="mobile-label">Created</span><span class="meta">${date(w.createdAt)}</span></div><button class="icon-button row-next" data-wallet="${w.id}" aria-label="Open ${esc(w.remark)} details">${icon('chevron')}</button></article>`).join('')}</div><div class="panel-foot"><p>${icon('v11-shield')}Wallet keys are encrypted at rest</p><span>Private to your account</span></div>${found.length>pageSize||view==='large'?pagination(found.length):''}`;
 else target.innerHTML=`<div class="list-summary"><span>${found.length} candidates</span><span>Times · UTC+8</span></div><div class="records"><div class="solana-head" aria-hidden="true"><span>Token / Mint</span><span>Issuance source</span><span>Issued / Discovered</span><span>Decimals</span><span>Transaction</span></div>${rows.map(candidate).join('')}</div>${pagination(found.length)}<div class="panel-foot"><p>Names and symbols are issuer-provided snapshots, not project verification.</p></div>`;
}
function pagination(total){const pages=Math.max(1,Math.ceil(total/pageSize));return `<div class="panel-foot"><div class="pagination"><button class="icon-button" data-page="${page-1}" aria-label="Previous page" ${page<=1?'disabled':''}>${icon('chevron','previous')}</button><span class="current-page">${page}</span><button class="icon-button" data-page="${page+1}" aria-label="Next page" ${page>=pages?'disabled':''}>${icon('chevron')}</button><span>of ${pages}</span></div><label class="page-size">Per page <select id="page-size">${(kind==='wallets'?[12,24,48]:[25]).map(v=>`<option ${v===pageSize?'selected':''}>${v}</option>`).join('')}</select></label></div>`}
function issuance(x){if(!x.sourceStatus||x.sourceStatus==='pending')return 'Source pending';if(x.sourceStatus==='error')return 'Source read failed';return x.sourceStatus==='identified'?({pump_fun:'Pump.fun',raydium_launchlab:'Raydium LaunchLab',direct_token:'Direct Token initialization'}[x.issuanceSource]||'Unrecognized platform'):'Unrecognized platform'}
function candidate(x){const name=x.name||(x.metadataStatus==='error'?'Metadata read failed':x.metadataStatus==='pending'||!x.metadataStatus?'Metadata pending':'Name unavailable'),issue=issuance(x);return `<article class="candidate" aria-label="${esc(name)}"><div class="candidate-grid"><div class="candidate-token"><div class="candidate-name ${!x.name?'muted':''}">${esc(name)}</div><div class="candidate-symbol">${esc(x.symbol||'Symbol unavailable')}</div><div class="address-line"><span class="mono">${esc(x.mint)}</span>${copy(x.mint,'mint '+x.mint)}</div></div><div class="source ${x.sourceStatus==='error'?'unknown':''}"><span class="mobile-label">Issuance source</span>${issue}</div><div class="times"><div><span class="muted">Issued</span>${date(x.blockTime)}${x.blockTime?'<br>'+time(x.blockTime):''}</div><div><span class="muted">Discovered</span>${date(x.discoveredAt)}<br>${time(x.discoveredAt)}</div></div><div class="num"><span class="mobile-label">Decimals</span>${x.decimals}</div><div class="candidate-tx"><span class="mobile-label">Transaction</span><span class="tx-brief" title="${esc(x.signature)}">${esc(x.signature.slice(0,7))}…${esc(x.signature.slice(-6))}</span><div class="tx-actions">${copy(x.signature,'issuance transaction')}<a class="icon-button" href="https://solscan.io/tx/${encodeURIComponent(x.signature)}" target="_blank" rel="noreferrer" aria-label="Open issuance transaction in Solscan">${icon('v20-external')}</a></div></div></div><details class="fact-details" ${view==='expanded'?'open':''}><summary>Issuance evidence</summary><dl class="facts">${[['Full transaction',x.signature],['Mint authority at initialization',x.mintAuthority||'Unavailable'],['Freeze authority at initialization',x.freezeAuthority||'Unavailable'],['Fee payer',x.feePayer||'Unavailable'],['Slot',x.slot],['Token standard',x.tokenProgram.startsWith('Tokenz')?'Token-2022':'Token Program'],['Token program',x.tokenProgram],['Issuance program',x.issuanceProgram||'Unavailable'],['Metadata source',x.metadataSource==='metaplex'?'Metaplex metadata':x.metadataSource==='token2022_on_mint'?'Token-2022 on-mint metadata':'Unavailable'],['Metadata account',x.metadataAccount||'Unavailable'],['Metadata observed slot',x.metadataObservedSlot&&x.metadataObservedSlot!=='0'?x.metadataObservedSlot:'Unavailable'],['Metadata observed at',date(x.metadataUpdatedAt)+(x.metadataUpdatedAt?' · '+time(x.metadataUpdatedAt):'')]].map(([k,v])=>`<div><dt>${k}</dt><dd class="${['transaction','authority','payer','Slot','program','account','observed slot'].some(n=>k.includes(n))?'mono':''}">${esc(v)}</dd></div>`).join('')}</dl><p class="muted-note">Authorities describe initialization, not current permissions. The fee payer is not identified as a founder.</p><a href="https://solscan.io/token/${encodeURIComponent(x.mint)}" target="_blank" rel="noreferrer">Open Mint in Solscan ${icon('v20-external')}</a></details></article>`}
function walletDetail(id){selected=items.find(x=>x.id===Number(id));const w=selected,readOnly=view==='readonly';showDialog('Wallet details',`<div class="detail-identity">${avatar(w)}<div><h3>${esc(w.remark)}</h3>${badge(w.walletType)}</div></div><section class="detail-section"><h3>Remark</h3>${readOnly?`<p>${esc(w.remark)}</p>`:`<label class="sr-only" for="remark-edit">Wallet remark</label><input id="remark-edit" value="${esc(w.remark)}"><p class="field-hint">Up to 50 Unicode characters.</p><p id="remark-error" class="field-error" hidden></p><button class="btn secondary" id="save-remark">Save remark</button>`}</section><section class="detail-section"><h3>Wallet identity</h3><dl class="facts">${[['Address',w.address],['Type',w.walletType==='EVM'?'EVM':'Solana'],['Source',source(w.source)],['Created',date(w.createdAt)+' · '+time(w.createdAt)],['Updated',date(w.updatedAt)+' · '+time(w.updatedAt)]].map(([k,v])=>`<div><dt>${k}${k==='Created'||k==='Updated'?' · UTC+8':''}</dt><dd class="${k==='Address'?'mono':''}">${esc(v)}${k==='Address'?copy(v,'wallet address'):''}</dd></div>`).join('')}</dl></section>${!readOnly?`<section class="detail-section"><h3>Avatar</h3>${presetPicker('detail-presets',w.avatarPresetId)}<input id="avatar-upload" type="file" accept="image/jpeg,image/png,image/webp" hidden><button class="btn secondary" id="upload-avatar">${icon('v11-upload')}Upload image</button><p class="field-hint">JPEG, PNG or non-animated WebP · Maximum 2 MiB.<br>Images are private to your account.</p><p class="field-error" id="avatar-error" hidden></p></section>`:''}<section class="detail-section"><h3>Private key</h3><p class="dialog-intro">${readOnly?'Read-only wallet access does not include private keys.':'Viewing or exporting requires a fresh identity check. The five-minute lease can only be reused in your current login session.'}</p>${!readOnly?'<button class="btn danger" id="reveal-key">'+icon('v11-key')+'View / export private key</button>':''}</section>`,'',true);
 if(!readOnly){$('#save-remark').onclick=()=>{const v=$('#remark-edit').value.trim();if(!v||Array.from(v).length>50){$('#remark-error').hidden=false;$('#remark-error').textContent=!v?'A wallet remark is required.':'Use 50 Unicode characters or fewer.';return}w.remark=v;renderList();walletDetail(w.id);notify('Remark updated in this preview.')};$('#upload-avatar').onclick=()=>$('#avatar-upload').click();$('#avatar-upload').onchange=()=>{const f=$('#avatar-upload').files[0];if(!f)return;const e=$('#avatar-error');if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>2*1024*1024){e.textContent='Choose a JPEG, PNG or non-animated WebP no larger than 2 MiB.';e.hidden=false;return}e.hidden=false;e.textContent='Upload selected. Image validation and saving will run in the implemented page.'};$('#reveal-key').onclick=()=>showDialog('Verify your identity',`<p class="dialog-intro">Verify the identity used for this login before viewing the private key for <strong>${esc(w.remark)}</strong>.</p><div class="secret-value">${esc(w.address)}</div><p class="muted-note">Visual preview: no provider is contacted and no key material is returned.</p>`, '<button class="btn secondary" data-close-dialog>Cancel</button><button class="btn primary" id="verify-preview">Continue with Google</button>')}
}
function walletForm(next){mode=next;preset='';showDialog(mode==='create'?'Create wallets':'Import wallets',`<p class="dialog-intro">${mode==='create'?'Create one to ten EVM or Solana wallets.':'Import one to ten wallets of the same type.'}</p><div class="field"><label for="wallet-type">Wallet type</label><select id="wallet-type"><option value="EVM">EVM</option><option value="SOLANA">Solana</option></select></div><div class="field">${mode==='create'?'<label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="10" step="1" value="1"><p class="field-hint" id="count-hint">1 of 10 wallets selected.</p>':'<label for="private-keys">Private keys</label><textarea id="private-keys" class="mono" rows="5" spellcheck="false" autocomplete="off" autocapitalize="none" placeholder="One private key per line"></textarea><p class="field-hint" id="key-guidance">One 32-byte hexadecimal private key per line, with or without 0x. Blank lines are ignored. Keys remain visible; protect your screen.</p><p class="field-hint" id="count-hint">0 of 10 private keys ready.</p>'}</div><div class="field"><label for="form-remark">Remark</label><input id="form-remark" placeholder="Optional custom remark"><p class="field-hint" id="remark-hint">Optional. Leave blank to use the next default name.</p></div><div class="field"><span class="field-label">Avatar</span>${presetPicker('form-presets')}<p class="field-hint" id="avatar-hint">Custom images can be uploaded after the wallet is saved.</p></div><p class="field-error" id="form-error" hidden></p>`,'<button class="btn secondary" data-close-dialog>Cancel</button><button class="btn primary" id="submit-wallet-form">'+(mode==='create'?'Create 1 wallet':'Import wallets')+'</button>');
 const recalc=()=>{const count=formCount();$('#count-hint').textContent=mode==='create'?`${count||0} of 10 wallets selected.`:`${count} of 10 private keys ready.`;$('#form-remark').disabled=count>1;if(count>1)$('#form-remark').value='';$('#remark-hint').textContent=count>1?`Automatic sequential names will be assigned to all ${count} wallets.`:'Optional. Leave blank to use the next default name.';$('#avatar-hint').textContent=count>1?'This avatar is shared by every wallet in this batch. Custom images can be uploaded later.':'Custom images can be uploaded after the wallet is saved.';$('#submit-wallet-form').textContent=mode==='create'?`Create ${count||0} ${count===1?'wallet':'wallets'}`:count?`Import ${count} ${count===1?'wallet':'wallets'}`:'Import wallets';};
 $(mode==='create'?'#quantity':'#private-keys').oninput=recalc;$('#wallet-type').onchange=()=>{if(mode==='import')$('#key-guidance').textContent=$('#wallet-type').value==='EVM'?'One 32-byte hexadecimal key per line, with or without 0x. Blank lines are ignored. Keys remain visible; protect your screen.':'One Base58 key, JSON byte array or 32/64-byte hexadecimal value per line. Blank lines are ignored. Keys remain visible; protect your screen.'};$('#submit-wallet-form').onclick=()=>{const count=formCount(),remark=$('#form-remark').value.trim(),type=$('#wallet-type').value,e=$('#form-error');if(!Number.isInteger(count)||count<1||count>10||Array.from(remark).length>50){e.hidden=false;e.textContent=Array.from(remark).length>50?'Use 50 Unicode characters or fewer.':'Choose between 1 and 10 wallets.';return}if(mode==='import'){e.hidden=false;e.textContent='Preview only: private keys are not validated or imported. No wallet has been added.';return}const made=Array.from({length:count},(_,i)=>({id:100+items.length+i,remark:count===1&&remark?remark:`${type==='EVM'?'EVM':'SOL'}-${items.length+i+1}`,walletType:type,address:type==='EVM'?'0x'+String(items.length+i+1).padStart(40,'0'):'PreviewSolanaAddress'+String(items.length+i+1),source:'created',avatarKind:'default',avatarPresetId:preset,avatarUrl:'',createdAt:DEMO.asOf,updatedAt:DEMO.asOf,revision:1}));items.push(...made);renderList();backup(made)};
}
function formCount(){return mode==='create'?Number($('#quantity').value):$('#private-keys').value.split(/\r?\n/).filter(x=>x.trim()).length}
function backup(list=[items[0]]){showDialog(list.length===1?'Back up your wallet':'Back up your wallets',`<div class="alert">This is the only automatic display after creation. Copy and store every private key before continuing.</div>${list.map(w=>`<h3 style="font-size:1rem">${esc(w.remark)}</h3><p class="mono" style="overflow-wrap:anywhere">${esc(w.address)}</p><div class="secret-value">DEMO-ONLY-INVALID-PRIVATE-KEY-${w.id}</div>${copy('DEMO-ONLY-INVALID-PRIVATE-KEY-'+w.id,w.remark+' demo key')}`).join('')}<label class="check-label"><input type="checkbox" id="backed-up"><span>I have backed up all private keys.</span></label><p class="muted-note">Synthetic preview values; these are not usable wallet keys.</p>`,'<button class="btn primary" id="backup-done" disabled>Done</button>');$('#dialog-close').hidden=true;$('#detail-dialog').onkeydown=e=>{if(e.key==='Escape')e.preventDefault()};$('#backed-up').onchange=()=>$('#backup-done').disabled=!$('#backed-up').checked;$('#backup-done').onclick=()=>{$('#dialog-close').hidden=false;$('#detail-dialog').onkeydown=null;closeDialog()}}
function setCase(v){if($('#detail-dialog').open){$('#detail-dialog').close();$('#dialog-close').hidden=false;$('#detail-dialog').onkeydown=null}view=v;query='';walletType='all';page=1;items=structuredClone(DEMO.items);if(v==='large'&&kind==='wallets')items=Array.from({length:13},(_,i)=>({...DEMO.items[i%4],id:i+1,remark:'Research wallet '+(i+1)}));render();if(v==='detail')walletDetail(items[0].id);if(v==='create'||v==='import')walletForm(v);if(v==='backup')backup();if(v==='expanded')$$('.fact-details').forEach((d,i)=>d.open=i===0)}
document.addEventListener('change',e=>{if(e.target.id==='page-size'){pageSize=Number(e.target.value);page=1;renderList()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-copy')){const v=b.dataset.copy;try{if(view==='copy-error'||!navigator.clipboard)throw Error('clipboard unavailable');await navigator.clipboard.writeText(v);notify('Copied to clipboard.')}catch{$('#copy-content').innerHTML=`<p class="dialog-intro">Clipboard access is unavailable. Select and copy the full value below.</p><textarea id="manual-copy" readonly class="mono" rows="4">${esc(v)}</textarea>`;$('#copy-dialog').showModal();$('#manual-copy').focus();$('#manual-copy').select()}return}if(b.hasAttribute('data-close-copy'))$('#copy-dialog').close();if(b.hasAttribute('data-close-dialog'))closeDialog();if(b.dataset.nav){const n=b.dataset.nav;if(n==='Wallets'||n==='Solana')location.href=`theme-${n.toLowerCase()}-v20.html`;else if(n==='Profit Sharing')location.href='theme-member-profit-sharing-v20.html';else notify(`${n} is outside this page preview.`)}if(b.dataset.demo)notify(`${b.dataset.demo} uses the previously approved shared page design.`);if(b.dataset.case)setCase(b.dataset.case);if(b.dataset.type){walletType=b.dataset.type;page=1;$$('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderList()}if(b.dataset.wallet)walletDetail(b.dataset.wallet);if(b.dataset.page){page=Number(b.dataset.page);renderList()}if(b.hasAttribute('data-clear')){query='';walletType='all';view='default';render()}if(b.hasAttribute('data-retry')){view='default';render()}if(b.hasAttribute('data-status-retry')){view='default';render()}if(b.hasAttribute('data-preset')){const v=b.dataset.preset;if(b.closest('#detail-presets')){selected.avatarPresetId=v;selected.avatarUrl='';renderList();walletDetail(selected.id);notify('Avatar updated in this preview.')}else{preset=v;$$('#form-presets button').forEach(x=>x.setAttribute('aria-checked',String(x===b)))}}if(b.id==='verify-preview'){$('#dialog-body').innerHTML='<div class="alert info">The implemented page will verify your current login identity before requesting a wallet key.</div><p class="dialog-intro">No identity check was performed and no key material was returned in this preview.</p>';$('#dialog-actions').innerHTML='<button class="btn secondary" data-close-dialog>Close</button>'}});
$('#detail-dialog').addEventListener('cancel',e=>{if($('#backup-done'))e.preventDefault()});
$('#dialog-close').onclick=closeDialog;
setCase(new URLSearchParams(location.search).get('case')||'default');
</script></body></html>
