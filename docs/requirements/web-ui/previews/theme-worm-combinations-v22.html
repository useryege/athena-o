function render(){setContext(view==='list'?'Combinations':view==='editor'?'Edit combination':'Execution preview','combinations');$('#content').innerHTML=(['session','noaccess'].includes(state)?heading(state==='session'?'Session expired':'Worm Trading is unavailable',state==='session'?'Sign in again to access your account.':'Your account does not have access to this module.')+alert('Access required','No account data is shown.','info'):view==='editor'?renderEditor():view==='preview'?renderPreview():renderList())+footer()+'<div class="wc-reorder-notice" id="reorder-notice" role="status"></div>';}
function nameDialog(){openDialog('Create combination',`<p class="wc-note">Save ${items.length} selected markets in their current order.</p><div class="field wc-dialog-input"><label for="new-name">Combination name</label><input id="new-name" autocomplete="off" placeholder="Name your combination"><p class="field-hint">1–80 characters · Unique in your account</p><p id="name-error" class="wc-error" role="alert"></p></div>`,btn('Cancel','cancel-dialog')+btn('Create combination','create','primary'));$('#new-name').focus()}
function validName(value){if(!value.trim())return 'Enter a combination name.';if(Array.from(value.trim()).length>80||/[\u0000-\u001f\u007f-\u009f]/u.test(value))return 'Use 1–80 characters without control characters.';return ''}
function simulate(text){closeDialog();notify(text+' Preview only; no data was written.')}
function prepare(){openDialog('Prepare live execution',`<p class="wc-note">${esc(C.name)} · Revision 7</p><dl class="wc-dl" style="margin-top:20px"><dt>Plan</dt><dd class="mono wc-id">${I.planId}</dd><dt>Reviewed steps</dt><dd>4 ready · 2 skipped</dd><dt>Maximum collateral</dt><dd>20.000000 USDC</dd></dl><p class="wc-note" style="margin-top:20px">This creates an awaiting-authorization Run only. No Worm sign-in, signature or order occurs at this stage.</p><p class="wc-hint">This visual preview does not create a real Run.</p>`,btn('Cancel','cancel-dialog')+anchor('View example Run','theme-worm-executions-v22.html?view=detail','primary'))}
function dirtyDialog(href){openDialog('Leave unsaved changes?',`<p class="wc-note">Your market choices, order and name draft have not been saved. Leaving discards this local draft.</p>`,btn('Keep editing','cancel-dialog')+`<a class="btn secondary destructive" data-discard href="${href}">Discard changes</a>`)}
document.addEventListener('click',e=>{const market=e.target.closest('[data-market]'),move=e.target.closest('[data-move]'),remove=e.target.closest('[data-remove]'),wm=e.target.closest('[data-wallet-move]'),wr=e.target.closest('[data-wallet-remove]'),b=e.target.closest('[data-action]'),a=e.target.closest('a');if(a&&view==='preview'&&new URL(a.href).searchParams.get('view')==='preview'&&new URL(a.href).searchParams.has('step')){e.preventDefault();if(!canWrite&&new URL(a.href).searchParams.get('step')!=='review')return;step=new URL(a.href).searchParams.get('step');render();scrollTo(0,0);return;}if(wr){wallets=wallets.filter(id=>id!==wr.dataset.walletRemove);render();}if(a&&dirty&&view==='editor'&&!a.hasAttribute('data-discard')){e.preventDefault();dirtyDialog(a.href);return;}if(market&&canWrite){const m=E.markets[Number(market.dataset.market)],sideValue=market.dataset.side,idx=items.findIndex(i=>i.marketConditionId===m.marketConditionId);if(idx>=0&&items[idx].side===sideValue)items.splice(idx,1);else if(idx>=0)items[idx]={...items[idx],side:sideValue,outcomeLabel:sideValue==='YES'?'Yes':'No'};else items.push({...C.items[Number(market.dataset.market)],side:sideValue});dirty=true;render();$(`[data-market="${market.dataset.market}"][data-side="${sideValue}"]`).focus();}if(move&&canWrite){const i=Number(move.dataset.move),j=i+Number(move.dataset.dir);[items[i],items[j]]=[items[j],items[i]];dirty=true;render();const focus=$(`[data-move="${j}"][data-dir="${-Number(move.dataset.dir)}"]`);focus?.focus();$('#reorder-notice').textContent=`Market moved to position ${j+1}.`;}if(remove&&canWrite){items.splice(Number(remove.dataset.remove),1);dirty=true;render();$('#current-combination h2').setAttribute('tabindex','-1');$('#current-combination h2').focus();}if(wm){const i=Number(wm.dataset.walletMove),j=i+Number(wm.dataset.dir);[wallets[i],wallets[j]]=[wallets[j],wallets[i]];render();$(`[data-wallet-move="${j}"][data-dir="${-Number(wm.dataset.dir)}"]`)?.focus();}if(!b)return;switch(b.dataset.action){case'delete':openDialog('Delete this combination?',`<p class="wc-note"><strong>${esc(C.name)}</strong> · Revision 7</p><p class="wc-note" style="margin-top:16px">This deletes the saved combination and its ordered markets. An active execution Run prevents deletion. Execution history is retained.</p><p class="wc-hint">Preview only; nothing will be deleted.</p>`,btn('Keep combination','cancel-dialog')+btn('Delete combination','delete-confirm','secondary destructive'));break;case'delete-confirm':simulate('Delete action demonstrated.');break;case'cancel-dialog':closeDialog();break;case'name-dialog':nameDialog();break;case'create':{let value=$('#new-name').value.trim(),validation=validName(value);if(!validation&&value.toLowerCase()===C.name.toLowerCase())validation='A combination with this name already exists.';if(validation){$('#name-error').textContent=validation;$('#new-name').setAttribute('aria-invalid','true');$('#new-name').focus();}else simulate('Combination creation demonstrated.');break;}case'save':error=validName(name);if(state==='conflict'){error='Reload the saved revision before trying again.';render();}else if(error)render();else notify('Save demonstrated. Preview only; no combination was updated.');break;case'add-event':{const val=$('#event-url').value.trim();let id=val;try{if(/^https?:/i.test(val)){const u=new URL(val);if(u.protocol!=='https:'||!['worm.wtf','www.worm.wtf'].includes(u.hostname)||u.username||u.password||!/^\/market\/[^/]+\/?$/.test(u.pathname))throw Error();id=u.pathname.split('/')[2];}if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(id))throw Error();if(id!==E.eventConditionId){$('#event-error').textContent='This event is not included in the synthetic preview. No request was sent.';break;}if(eventVisible){$('#event-error').textContent='This event is already loaded.';break;}eventVisible=true;render();notify('Example event added locally.');}catch{$('#event-error').textContent='Enter an HTTPS worm.wtf/market/{Event Condition ID} URL or a valid Base58 Event Condition ID.';}break;}case'remove-event':if(items.length)openDialog('Remove this event?','<p class="wc-note">This also removes its selected markets from your unsaved combination.</p>',btn('Keep event','cancel-dialog')+btn('Remove event','remove-event-confirm','secondary destructive'));else{eventVisible=false;render();}break;case'remove-event-confirm':eventVisible=false;items=[];dirty=true;closeDialog();render();break;case'refresh-event':notify('Example snapshot refreshed locally. Market choices and order are preserved.');break;case'refresh':state='';render();notify('Example list reloaded.');break;case'select-all':wallets=I.wallets.map(w=>w.id);render();break;case'clear-wallets':wallets=[];render();break;case'checks':step='checks';render();scrollTo(0,0);break;case'build':if(wallets.length!==3){notify('This static review uses the three-wallet example. Select all connected wallets to inspect it; no plan was created.');break;}state='building';step='review';render();setTimeout(()=>{state='';render();notify('Showing an example read-only plan. No real plan was created.');},500);break;case'rerun':openDialog('Build a new preview?','<p class="wc-note">A new preview rechecks the saved combination, current wallet selection, balances, exposure and estimates. This snapshot remains unchanged.</p><p class="wc-hint">Preview only; no plan is created.</p>',btn('Keep snapshot','cancel-dialog')+btn('Review current inputs','inputs','primary'));break;case'inputs':closeDialog();step='combination';state='';render();scrollTo(0,0);break;case'prepare':prepare();break;}});
document.addEventListener('input',e=>{if(e.target.id==='combination-name'){name=e.target.value;dirty=true;}if(e.target.hasAttribute('data-wallet')){const id=e.target.dataset.wallet;wallets=e.target.checked?[...wallets,id]:wallets.filter(x=>x!==id);render();$(`[data-wallet="${id}"]`).focus();}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
render();if(state==='delete')setTimeout(()=>$('[data-action=delete]')?.click(),0);if(state==='name-error'){isNew=true;render();nameDialog();$('#new-name').value=C.name;$('#name-error').textContent='A combination with this name already exists.';$('#new-name').setAttribute('aria-invalid','true');}if(state==='dirty'){dirty=true;setTimeout(()=>dirtyDialog(link('list')),0);}window.WORM_PREVIEW={getState:()=>({view,step,state,canWrite,items,wallets,dirty})};
})();
</script></body></html>
