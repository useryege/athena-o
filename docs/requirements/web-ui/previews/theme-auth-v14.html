<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>ATHENA · Sign in and registration visual proposal</title>
<style>
@font-face{font-family:Inter;src:url('files/InterVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('files/JetBrainsMono-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{color-scheme:dark;--page:#06080B;--panel:#0F1114;--raised:#181D22;--line:#252A30;--edge:#61717B;--text:#FFFFFF;--muted:#9FA0A1;--accent:#00FFA7;--positive:#55D9A1;--negative:#F58C9B;--warning:#E6BF72;font-family:Inter,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;font-synthesis:none;font-optical-sizing:auto}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--edge) var(--page)}
body{margin:0;background:var(--page);color:var(--text);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,p{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit;text-underline-offset:4px}a:hover{color:var(--text)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}::selection{background:var(--accent);color:var(--page)}
[hidden]{display:none!important}.icon{height:18px;width:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.sprite{position:absolute;width:0;height:0;overflow:hidden}
.auth-stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px 28px}
.auth-wrap{width:448px;max-width:100%;min-width:0}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}.brand-symbol{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.7;flex-shrink:0}.wordmark{font-size:1.375rem;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.auth-panel{padding:32px;border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:0}
h1{font-size:1.75rem;line-height:1.3;letter-spacing:-.02em;font-weight:600;text-wrap:balance;margin-bottom:10px}.lead{font-size:1rem;line-height:1.6;color:var(--muted)}
.method-list{display:grid;gap:12px;margin-top:28px}.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--edge);border-radius:10px;background:transparent;color:var(--text);font-size:.875rem;font-weight:500;line-height:1.5;transition:background-color .16s ease-out;overflow-wrap:anywhere;text-align:center}
.btn:not(:disabled):hover{background:var(--raised)}.provider-mark{height:20px;width:20px;flex-shrink:0;border-radius:3px}.btn:not(:disabled):active{background:#232B31}.btn:disabled{color:var(--muted);background:var(--raised);border-color:var(--line)}.btn:disabled .provider-mark{opacity:.55}
.primary{background:var(--accent);color:var(--page);border-color:var(--accent)}.primary:not(:disabled):hover{background:#51FFC3}.primary:not(:disabled):active{background:#09C385}
.wallet-note{display:flex;gap:8px;color:var(--muted);font-size:.8125rem;line-height:1.6;margin-top:14px}.wallet-note .icon{margin-top:2px;width:16px;height:16px}
.onboarding-note{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);font-size:.875rem;line-height:1.6;color:var(--muted)}.onboarding-note strong{display:block;color:var(--text);font-weight:500;margin-bottom:5px}
.access-note{margin:20px 16px 0;text-align:center;font-size:.8125rem;line-height:1.65;color:var(--muted)}
.identity{margin-top:24px;padding:16px 0;border-block:1px solid var(--line);display:flex;align-items:center;gap:12px;min-width:0}.identity>.provider-mark{width:22px;height:22px;align-self:flex-start;margin-top:3px}.identity-copy{min-width:0;flex:1}.identity-label{font-size:.8125rem;line-height:1.55;color:var(--muted);margin-bottom:5px}.identity-value{font-size:.875rem;line-height:1.6;font-weight:500;overflow-wrap:anywhere}.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.8125rem;line-height:1.7;font-weight:400;font-variant-ligatures:none}.identity-actions{display:flex;align-items:center;gap:8px;min-width:0}.identity-actions .identity-value{flex:1;min-width:0}.icon-btn{display:grid;place-items:center;min-width:36px;min-height:36px;padding:7px;border:0;background:transparent;color:var(--muted);border-radius:7px;flex-shrink:0}.icon-btn:hover{background:var(--raised);color:var(--text)}
.registration-form{margin-top:24px}.field-label{display:block;font-size:.875rem;font-weight:500;line-height:1.6;margin-bottom:8px}.input-wrap{display:flex;align-items:center;gap:8px;min-height:48px;padding:11px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--page)}.input-wrap:focus-within{outline:2px solid var(--accent);outline-offset:3px;border-color:var(--accent)}.input-wrap.invalid{border-color:var(--negative)}.input-wrap.available{border-color:#357C60}.input-wrap>span{color:var(--muted);font-size:.875rem}input{padding:0;width:100%;min-width:0;outline:0;border:0;background:transparent;color:var(--text);caret-color:var(--accent);font-size:1rem;line-height:1.5}input:focus-visible{outline:none}input:disabled{color:var(--muted)}input::placeholder{color:var(--muted)}
.field-status{display:flex;align-items:flex-start;gap:7px;margin-top:9px;font-size:.8125rem;line-height:1.55;color:var(--muted);min-height:21px}.field-status .icon{width:15px;height:15px;margin-top:3px}.field-status.success{color:var(--positive)}.field-status.error{color:var(--negative)}.permanence{font-size:.8125rem;line-height:1.6;color:var(--muted);margin-top:12px}.form-actions{display:grid;gap:12px;margin-top:24px}
.feedback{margin-top:22px;display:flex;align-items:flex-start;gap:9px;padding:14px;border:1px solid #6C5938;background:#272115;color:var(--warning);border-radius:10px;font-size:.8125rem;line-height:1.65;overflow-wrap:anywhere}.feedback>.icon{margin-top:2px}.feedback a{display:inline-block;margin-top:8px}.feedback.error{background:#2B171C;border-color:#804752;color:var(--negative)}.feedback.info{background:#18232F;border-color:#3C5C7D;color:#9BC6F3}.busy-status{margin-top:16px;color:var(--muted);font-size:.8125rem;line-height:1.6;display:flex;align-items:center;gap:8px}.spinner{width:16px;height:16px;border:2px solid #61717B;border-top-color:var(--text);border-radius:50%;display:inline-block;flex-shrink:0;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.preview-footer{width:448px;max-width:100%;margin-top:32px;color:var(--muted);font-size:.75rem;line-height:1.7;text-align:center}.preview-footer summary{cursor:pointer;padding:8px 0;min-height:36px;font-size:.75rem;list-style-position:inside}.preview-controls{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:10px;text-align:left}.preview-controls label{display:block;margin-bottom:8px}.preview-controls select{width:100%;max-width:100%;padding:10px;background:var(--panel);border:1px solid var(--edge);border-radius:8px;color:var(--text);font-size:.8125rem}.preview-controls p{margin-top:12px}.demo-notice{margin-top:16px;font-size:.8125rem;line-height:1.65;color:#9BC6F3;overflow-wrap:anywhere}
@media(max-width:600px){.auth-stage{padding:40px 20px 24px}.brand{margin-bottom:24px}.auth-panel{padding:24px}.wordmark{font-size:1.25rem}h1{font-size:1.5rem;line-height:1.35}.access-note{margin-inline:8px}.preview-footer{margin-top:24px}}
@media(max-width:360px){.auth-panel{padding:20px}.auth-stage{padding-top:32px}.btn{padding:12px}.access-note{margin-inline:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const panel=document.getElementById('auth-panel'),selector=document.getElementById('demo-state');
let activeState='login',busy=false,availability='idle',generation=0,timer;
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#${name}"></use></svg>`;
const mark=provider=>`<img class="provider-mark" src="${assets[provider]}" alt="" aria-hidden="true">`;
const notice=message=>{let node=document.getElementById('demo-notice');if(!node){node=document.createElement('p');node.id='demo-notice';node.className='demo-notice';node.setAttribute('role','status');panel.append(node)}node.textContent=message};
const feedback=(text,tone='error',link='')=>`<div class="feedback ${tone}" role="alert">${icon(tone==='error'?'alert':'info')}<div>${text}${link}</div></div>`;
function drawLogin(state){
 const warning=state==='login-missing'?'Phantom is not installed in this browser.':state==='login-cancelled'?'Google sign-in was cancelled. Try again when you are ready.':'';
 panel.innerHTML=`<h1 id="auth-title">Welcome to Athena</h1><p class="lead">Sign in with your verified identity.</p>${warning?feedback(warning,'warning',state==='login-missing'?'<a href="https://phantom.com/download" target="_blank" rel="noopener noreferrer">Install Phantom from the official website</a>':''):''}<div class="method-list" role="group" aria-label="Sign-in methods"><button class="btn" id="google">${mark('google')}<span>Continue with Google</span></button><button class="btn" id="phantom">${mark('phantom')}<span>Continue with Phantom</span></button></div><p id="login-status" class="busy-status" aria-live="polite" hidden></p><p class="wallet-note">${icon('shield')}<span>Phantom signs only a login message.<br>No transaction or network fee.</span></p><div class="onboarding-note"><strong>New to Athena?</strong><p>Verify your identity first, then choose a username to create your account.</p></div>`;
 document.getElementById('google').onclick=()=>loginBusy('google');document.getElementById('phantom').onclick=()=>show('login-missing');
 if(state==='login-busy')loginBusy('phantom',true);
}
function loginBusy(method,persist=false){
 if(busy)return;busy=true;panel.querySelector('.method-list').setAttribute('aria-busy','true');panel.querySelectorAll('.method-list button').forEach(b=>b.disabled=true);
 const selected=document.getElementById(method);selected.querySelector('img').outerHTML='<span class="spinner" aria-hidden="true"></span>';
 const status=document.getElementById('login-status');status.hidden=false;status.textContent=method==='phantom'?'Approve the message in Phantom…':'Opening Google sign-in…';
 if(!persist){const current=++generation;timer=setTimeout(()=>{if(current!==generation)return;show('login');notice('Preview only. Google sign-in was not opened.');},700)}
}
function drawRegister(state){
 const wallet=state==='register-wallet';
 panel.innerHTML='<h1 id="auth-title">Choose a username</h1><p class="lead">Your permanent public name in Athena.</p>';
 if(state==='register-loading'){panel.insertAdjacentHTML('beforeend','<p class="busy-status" role="status"><span class="spinner" aria-hidden="true"></span>Loading your verified identity…</p>');return}
 if(state==='register-expired'){panel.insertAdjacentHTML('beforeend',feedback('Your registration session has expired. Return to sign in and try again.')+'<div class="form-actions"><button class="btn" id="return-login">Return to sign in</button></div>');document.getElementById('return-login').onclick=()=>show('login');return}
 panel.insertAdjacentHTML('beforeend',`<div class="identity" aria-label="Verified identity">${mark(wallet?'phantom':'google')}<div class="identity-copy"><p class="identity-label">Verified ${wallet?'Phantom wallet':'Google account'}</p><div class="identity-actions"><p class="identity-value ${wallet?'mono':''}" id="verified-identity">${wallet?demo.solanaAddress.slice(0,7)+'…'+demo.solanaAddress.slice(-7):demo.verifiedEmail}</p>${wallet?`<button class="icon-btn" id="copy-wallet" aria-label="Copy full Phantom wallet address">${icon('copy')}</button>`:''}</div></div></div><form class="registration-form" novalidate><label class="field-label" for="username">Username</label><div class="input-wrap"><span aria-hidden="true">@</span><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-status permanence" placeholder="Choose your username"></div><p id="username-status" class="field-status" aria-live="polite" aria-atomic="true"></p><p id="permanence" class="permanence">This username cannot be changed later.</p><div class="form-actions"><button type="submit" class="btn primary" id="create-account" disabled>Create account</button><button type="button" class="btn" id="switch-identity">Use another ${wallet?'Phantom wallet':'Google account'}</button></div></form>`);
 const input=document.getElementById('username');input.value=state==='register-empty'?'':state==='register-invalid'?'mira_chen':state==='register-unavailable'?'mira':demo.username;
 input.oninput=()=>{document.getElementById('demo-notice')?.remove();checkUsername()};
 panel.querySelector('form').onsubmit=event=>{event.preventDefault();if(busy||availability!=='available')return;busy=true;setFormBusy();const current=++generation;timer=setTimeout(()=>{if(current!==generation)return;busy=false;setFormBusy();notice('Preview only. No account was created. Business access is granted separately.');},700)};
 document.getElementById('switch-identity').onclick=()=>{if(busy)return;busy=true;setFormBusy(true);const current=++generation;timer=setTimeout(()=>{if(current!==generation)return;busy=false;setFormBusy();notice(`Preview only. ${wallet?'Phantom wallet':'Google account'} switching was not started.`);},700)};
 if(wallet)document.getElementById('copy-wallet').onclick=async()=>{try{await navigator.clipboard.writeText(demo.solanaAddress);notice('Full Phantom wallet address copied.')}catch{notice('Copy failed. Full address: '+demo.solanaAddress)}};

}
function setFormBusy(switching=false){
 panel.querySelector('form').setAttribute('aria-busy',String(busy));document.getElementById('username').disabled=busy;
 document.getElementById('create-account').disabled=busy||availability!=='available';document.getElementById('switch-identity').disabled=busy;
 document.getElementById('create-account').innerHTML=busy&&!switching?'<span class="spinner" aria-hidden="true"></span>Creating account…':'Create account';
 if(switching)document.getElementById('switch-identity').innerHTML='<span class="spinner" aria-hidden="true"></span>Restarting sign-in…';
 else document.getElementById('switch-identity').textContent=activeState==='register-wallet'?'Use another Phantom wallet':'Use another Google account';
}
function setAvailability(state){
 availability=state;const input=document.getElementById('username');if(!input)return;
 const texts={idle:'3–42 characters: letters, numbers, periods, or hyphens.',checking:'Checking availability…',available:'Username is available.',invalid:'Use 3–42 letters, numbers, periods, or hyphens.',unavailable:'That username is not available. Choose another one.',error:'Unable to check availability right now. Try again.'};
 const invalid=['invalid','unavailable','error'].includes(state);input.setAttribute('aria-invalid',String(invalid));input.parentElement.className='input-wrap'+(invalid?' invalid':state==='available'?' available':'');
 const status=document.getElementById('username-status');status.className='field-status'+(invalid?' error':state==='available'?' success':'');status.innerHTML=(invalid?icon('alert'):state==='available'?icon('check'):state==='checking'?'<span class="spinner" aria-hidden="true"></span>':'')+`<span>${texts[state]}</span>`;
 document.getElementById('create-account').disabled=busy||state!=='available';
}
function checkUsername(){
 clearTimeout(timer);const current=++generation,value=document.getElementById('username').value;
 if(!value){setAvailability('idle');return}
 if(value.length<3||value.length>42||!/^[A-Za-z0-9.-]+$/.test(value)||!/[A-Za-z0-9]/.test(value)||/^0x[0-9a-f]{40}$/i.test(value)){setAvailability('invalid');return}
 setAvailability('checking');timer=setTimeout(()=>{if(current!==generation)return;setAvailability(['mira','admin','athena'].includes(value.toLowerCase())?'unavailable':value==='network.error'?'error':'available')},400);
}
function show(state){clearTimeout(timer);generation++;busy=false;activeState=state;selector.value=state;if(state.startsWith('register'))drawRegister(state);else drawLogin(state)}
selector.onchange=()=>show(selector.value);
const requested=new URLSearchParams(location.search).get('state')||'login';show([...selector.options].some(option=>option.value===requested)?requested:'login');
</script>
