const body=document.body,sidebar=document.getElementById('sidebar'),app=document.getElementById('app'),scrim=document.getElementById('scrim'),openNav=document.getElementById('open-nav'),closeNav=document.getElementById('close-nav'),collapse=document.getElementById('collapse'),account=document.getElementById('account'),accountMenu=document.getElementById('account-menu');
let noticeTimer;function notice(text){const el=document.getElementById('notice');el.textContent=text;el.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.hidden=true,5000)}
function setNav(open){body.classList.toggle('nav-open',open);scrim.hidden=!open;app.inert=open;openNav.setAttribute('aria-expanded',String(open));if(open){sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');closeNav.focus()}else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');openNav.focus()}}
openNav.addEventListener('click',()=>setNav(true));closeNav.addEventListener('click',()=>setNav(false));scrim.addEventListener('click',()=>setNav(false));collapse.addEventListener('click',()=>{const collapsed=body.classList.toggle('collapsed');collapse.setAttribute('aria-expanded',String(!collapsed));collapse.setAttribute('aria-label',collapsed?'Expand navigation':'Collapse navigation')});
const mobile=matchMedia('(max-width:900px)');mobile.addEventListener('change',()=>{if(body.classList.contains('nav-open')){setNav(false);collapse.focus()}});
account.addEventListener('click',()=>{accountMenu.hidden=!accountMenu.hidden;account.setAttribute('aria-expanded',String(!accountMenu.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.account-wrap')){accountMenu.hidden=true;account.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(body.classList.contains('nav-open'))setNav(false);if(!accountMenu.hidden){accountMenu.hidden=true;account.setAttribute('aria-expanded','false');account.focus()}}if(e.key==='Tab'&&body.classList.contains('nav-open')){const nodes=[...sidebar.querySelectorAll('button')].filter(x=>x.offsetParent!==null),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.querySelectorAll('[data-demo]').forEach(button=>button.addEventListener('click',()=>{if(body.classList.contains('nav-open'))setNav(false);accountMenu.hidden=true;account.setAttribute('aria-expanded','false');notice('Layout preview only: '+button.dataset.demo+'. No live navigation or data request.')}));
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);notice('Wallet address copied.')}catch{notice('Copy unavailable in this browser. Select the complete wallet address to copy it.')}return}
const action=e.target.closest('[data-preview]');if(action){notice('Visual preview only: '+action.dataset.preview+'. No subscription was changed and no page was opened.');return}
const v=e.target.closest('[data-view]');if(v){if(v.dataset.view===view)return;scrollByView[view]=scrollY;view=v.dataset.view;render();window.scrollTo({top:scrollByView[view],behavior:'instant'});return}
const c=e.target.closest('[data-case]');if(c){state=c.dataset.case;render();window.scrollTo({top:0,behavior:'instant'});return}
if(e.target.closest('#retry')||e.target.closest('#latest')){state='ready';render();window.scrollTo({top:0,behavior:'instant'});notice('Sample subscriptions shown. No live request was sent.');const focusTarget=document.querySelector('[data-view="'+view+'"]');focusTarget.focus({preventScroll:true})}
});render();

</script></body></html>
