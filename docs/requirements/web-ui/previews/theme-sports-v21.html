function chart(e){const opts=priceOptions(e),i=selections[e.eventKey]??(scratch?0:11),missing=state==='no-history';return `<div class="sp-chart" data-chart="${e.eventKey}"><div class="sp-chart-top"><h4>Moneyline price history</h4><span class="sp-small">Price · 0–100%</span></div><div class="sp-legend">${opts.map((o,j)=>`<span style="--series:${tones[j]}">${esc(o.label)}</span>`).join('')}</div>${missing?`<div class="sp-empty"><strong>Price history unavailable</strong><p>The event snapshot is still available.</p>${btn('Retry history','data-refresh')}</div>`:`<div class="sp-plot"><div class="sp-y"><span>100%</span><span>50%</span><span>0%</span></div><svg viewBox="0 0 600 190" preserveAspectRatio="none" data-plot="${e.eventKey}" role="img" aria-label="${esc(e.title)} moneyline price history. Use the time slider for exact values."><path d="M0 1H600M0 95H600M0 189H600" stroke="#252A30" fill="none"/><g data-lines style="clip-path:inset(0 ${scratch?100-i/11*100:0}% 0 0)">${opts.map((o,j)=>{const s=seriesFor(o);return `<path d="${s.prices.map((p,k)=>`${k?'L':'M'}${(k/11*600).toFixed(2)},${(189-p*188).toFixed(2)}`).join(' ')}" stroke="${tones[j]}" stroke-width="2.2" vector-effect="non-scaling-stroke" fill="none"/>`}).join('')}</g></svg></div><div class="sp-x"><span>${hh(seriesFor(opts[0]).timestamps[0])}</span><span>${hh(seriesFor(opts[0]).timestamps[11])} · UTC+8</span></div><input type="range" min="0" max="11" value="${i}" aria-label="${esc(e.title)} ${scratch?'Scratch reveal':'Price history time'}" data-scrub="${e.eventKey}"><div class="sp-selection" aria-live="polite">${selection(e,i)}</div>`}</div>`}
function selection(e,i){const opts=priceOptions(e);return `${scratch?'Revealed through':'Selected'} ${time(seriesFor(opts[0]).timestamps[i])}<br>${opts.map(o=>`<strong>${esc(o.label)} ${(seriesFor(o).prices[i]*100).toFixed(1)}%</strong>`).join(' · ')}`}
function event(e){const opts=priceOptions(e),hist=view==='history';return `<article class="sp-event"><header class="sp-event-top"><div><h3>${esc(e.title)}</h3><span class="sp-small">${hist?'Completed event':esc(e.period)+' · '+esc(e.elapsed)+' · '+esc(e.gameStatus)}</span></div>${btn(icon('external'),`data-source="${esc(e.slug)}" aria-label="Polymarket source for ${esc(e.title)}"`)}</header><div class="sp-event-main"><div class="sp-facts"><div class="sp-score"><div><small>${hist?'Final score':'Score'}</small><strong>${state==='unknown'?'Not available':esc(e.score)}</strong></div><span class="sp-small">${hist?esc(e.gameStatus):'In play'}</span></div>${hist?`<dl class="sp-pairs"><div><dt>Started · UTC+8</dt><dd>${time(e.startTime)}</dd></div><div><dt>Finished · UTC+8</dt><dd>${time(e.finishedAt)}</dd></div></dl>`:''}<dl class="sp-pairs"><div><dt>Volume</dt><dd>${state==='unknown'?'Not available':e.volume.toLocaleString('en-US',{minimumFractionDigits:2})}</dd></div><div><dt>Liquidity</dt><dd>${state==='unknown'?'Not available':e.liquidity.toLocaleString('en-US',{minimumFractionDigits:2})}</dd></div></dl><div class="sp-quotes"><span class="sp-small">${hist?'Final moneyline snapshot':'Moneyline snapshot'} · Price</span>${opts.map(o=>`<div class="sp-quote"><span>${esc(o.label)}</span><b>${state==='unknown'?'—':esc(o.price)}</b></div>`).join('')}</div></div>${chart(e)}</div>${source(e)}</article>`}
const hit=m=>m.homeCorners90+m.awayCorners90>6.5,total=m=>m.homeCorners90+m.awayCorners90,full=m=>m.homeCornersFull+m.awayCornersFull;
const stats=ms=>({n:ms.length,h:ms.filter(hit).length,rate:ms.length?100*ms.filter(hit).length/ms.length:0,avg:ms.length?ms.reduce((a,m)=>a+total(m),0)/ms.length:0});
const pair=(a,b)=>`${a}–${b}`;
const score=m=>`${pair(m.homeScore,m.awayScore)}${m.hasPenaltyShootout?`<br><span class="sp-small">PEN ${pair(m.homePenaltyScore,m.awayPenaltyScore)}</span>`:''}`;
const sl=m=>DEMO.corners.stages.find(s=>s.key===m.stage).shortLabel;
function cornerRows(){let ms=DEMO.corners.matches.filter(m=>(stage==='all'||m.stage===stage)&&(outcome==='all'||(outcome==='hit')===hit(m))&&(!search||`${m.homeTeam} ${m.awayTeam}`.toLowerCase().includes(search.toLowerCase().trim())));if(sort!=='default'){const f=sort.startsWith('full')?full:total;ms.sort((a,b)=>sort.endsWith('desc')?f(b)-f(a):f(a)-f(b))}return ms}
function cornerRecords(){let ms=cornerRows();return `<div class="sp-table-meta"><span class="sp-small" id="match-count" role="status">Showing ${ms.length} of ${DEMO.corners.matches.length} sample matches</span><select class="sp-sort" aria-label="Sort matches" id="corner-sort">${[['default','Tournament order'],['total-asc','90-min total: low to high'],['total-desc','90-min total: high to low'],['full-asc','Full-match total: low to high'],['full-desc','Full-match total: high to low']].map(([k,l])=>`<option value="${k}"${sort===k?' selected':''}>${l}</option>`).join('')}</select></div>${!ms.length?`<div class="sp-empty"><h3>No matches found</h3><p>Try another team, stage, or O6.5 result.</p>${btn('Reset filters','data-reset-filters')}</div>`:`<table class="sp-table"><colgroup><col style="width:29%"><col style="width:14%"><col style="width:14%"><col style="width:13%"><col style="width:11%"><col style="width:19%"></colgroup><thead><tr><th>Match / Stage</th><th>Score after ET</th><th>90-min corners</th><th>90-min total</th><th>O6.5</th><th>Full-match corners</th></tr></thead><tbody>${ms.map(m=>`<tr><td><span class="sp-small">${sl(m)}</span><strong class="sp-match-title">${m.homeTeam} – ${m.awayTeam}</strong></td><td class="num">${score(m)}</td><td class="num">${pair(m.homeCorners90,m.awayCorners90)}</td><td class="num"><strong>${total(m)}</strong></td><td><span class="sp-result${hit(m)?'':' miss'}">${hit(m)?'HIT':'MISS'}</span></td><td class="num">${pair(m.homeCornersFull,m.awayCornersFull)}</td></tr>`).join('')}</tbody></table>${ms.map(m=>`<article class="sp-mobile-match"><span class="sp-small">${sl(m)}</span><h3>${m.homeTeam} – ${m.awayTeam}</h3><div class="sp-mobile-grid"><div><small>90-min corners</small><strong>${pair(m.homeCorners90,m.awayCorners90)}</strong></div><div><small>90-min total / O6.5</small><strong>${total(m)} · <span class="sp-result${hit(m)?'':' miss'}">${hit(m)?'HIT':'MISS'}</span></strong></div><div><small>Score after ET</small><strong>${score(m)}</strong></div><div><small>Full-match corners</small><strong>${pair(m.homeCornersFull,m.awayCornersFull)}</strong></div></div></article>`).join('')}`}`}
function corners(){const a=stats(DEMO.corners.matches),k=stats(DEMO.corners.matches.filter(m=>m.stage!=='group-stage'));return `<aside class="sp-status"><div><strong>Settlement scope</strong><p class="sp-small" style="margin:6px 0 0;max-width:75ch">O6.5 uses 90 minutes plus stoppage time. Extra-time corners count only in the full-match column. Check the market-specific rules before trading.</p>${btn('View methodology & sources','data-method')}</div></aside><div class="sp-summary" aria-label="Sample summary"><div><small>Sample size</small><strong>${a.n}</strong><small>Synthetic matches</small></div><div><small>O6.5 overall</small><strong>${a.rate.toFixed(1)}%</strong><small>${a.h} of ${a.n} matches</small></div><div><small>O6.5 knockout</small><strong>${k.rate.toFixed(1)}%</strong><small>${k.h} of ${k.n} matches</small></div><div><small>Average 90-min corners</small><strong>${a.avg.toFixed(2)}</strong><small>Combined per match</small></div></div><section class="sp-panel"><h2>O6.5 hit rate by stage</h2><p class="sp-small">Sample sizes remain visible, especially for small knockout rounds.</p>${DEMO.corners.stages.map(s=>{const t=stats(DEMO.corners.matches.filter(m=>m.stage===s.key));return `<div class="sp-stage"><span>${s.shortLabel}</span><div class="sp-bar" role="img" aria-label="${s.label}: ${t.rate.toFixed(1)} percent, ${t.h} of ${t.n} matches"><i style="width:${t.rate}%"></i></div><span class="sp-stage-value">${t.rate.toFixed(1)}%<small>${t.h}/${t.n}</small></span></div>`}).join('')}</section><section class="sp-panel"><h2>Match data</h2><div class="sp-filters"><div class="sp-field"><label for="corner-search">Team</label><input id="corner-search" type="search" placeholder="Search team" value="${esc(search)}"></div><div class="sp-field"><label for="corner-stage">Stage</label><select id="corner-stage"><option value="all">All stages</option>${DEMO.corners.stages.map(s=>`<option value="${s.key}"${stage===s.key?' selected':''}>${s.label}</option>`).join('')}</select></div><div class="sp-field"><label for="corner-outcome">O6.5 outcome</label><select id="corner-outcome">${[['all','All outcomes'],['hit','Hit'],['miss','Miss']].map(([k,l])=>`<option value="${k}"${outcome===k?' selected':''}>${l}</option>`).join('')}</select></div>${btn('Reset','data-reset-filters')}</div><div id="corner-records">${cornerRecords()}</div></section><p class="sp-small">Method: periods 1–2 for 90-minute corners; periods 1–4 for full-match corners. Penalty shootouts are shown separately from the score after extra time.</p>`}
function statusBar(){if(view==='corners')return '';if(view==='live')return `<div class="sp-status${state==='stale'?' warn':''}"><span class="${state==='stale'?'':'sp-state'}">${state==='stale'?'Stale snapshot':'Snapshot available'}</span><span class="sp-small">Fetched ${time(DEMO.fetchedAt)} · UTC+8</span><span class="sp-small">${state==='stale'?'Last successful data retained. Refresh to retry.':'Live page checks every 3 seconds · Preview paused'}</span></div>`;const st=state==='syncing'?'Syncing':state==='failed'?'Failed':state==='idle'?'Idle':'Succeeded';return `<div class="sp-status${st==='Failed'?' error':''}"><strong>Sync</strong><span class="${st==='Failed'?'':'sp-state'}">${st}</span><span class="sp-small">${st==='Syncing'?'Started':st==='Idle'?'Last successful':'Completed'} ${time(st==='Syncing'?DEMO.sync.status.startedAt:DEMO.sync.status.completedAt)} · UTC+8</span>${st==='Failed'?'<span>Synchronization failed. The last successful snapshot is retained.</span>':''}</div>`}
function footer(){let ss=['default','loading','error','empty'];if(view==='live')ss.push('stale','no-history','unknown');if(view==='history')ss.push('idle','syncing','failed','read-only','no-history','unknown');return `<footer class="sp-foot">Visual preview · Synthetic review sample. No live data, synchronization, or trading requests.<details><summary>Preview states ${icon('down')}</summary><div class="sp-actions">${ss.map(s=>btn(s.replace('-',' '),`data-state="${s}" aria-pressed="${state===s}"`)).join('')}</div></details></footer>`}
function render(){setContext(names[view],view);const syncDisabled=['syncing','loading'].includes(state);document.getElementById('content').innerHTML=`<header class="sp-head"><div><h1>${names[view]}</h1><p>${view==='corners'?'2022 tournament analysis · 8 synthetic sample matches.':view==='history'?'Completed ATP and WTA events from the last 72 hours.':'Current sports events, scores, and moneyline prices.'}</p><p class="sp-small">Synthetic review sample · No live data</p></div><div class="sp-actions">${view==='history'?btn('Scratch',`id="scratch-toggle" role="switch" aria-checked="${scratch}" aria-pressed="${scratch}"`)+btn('Reset scratch',`id="scratch-reset" ${scratch?'':'disabled'}`)+(state!=='read-only'&&V21.canWrite('SPORTS_HISTORY')?btn(icon('refresh')+' Refresh data',`id="sync-data" ${syncDisabled?'disabled':''}`,true):''):btn(icon('refresh')+' Refresh','data-refresh')}</div></header>${state==='loading'?`<div class="sp-empty" role="status" aria-label="Loading ${names[view]}"><h2>Loading ${names[view]}</h2><div class="sp-skeleton"></div><div class="sp-skeleton" style="width:85%"></div><div class="sp-skeleton" style="width:65%"></div>${btn('Show loaded sample','data-state="default"')}</div>`:state==='error'?`<div class="sp-empty" role="alert"><h2>Could not load ${names[view]}</h2><p>The data source is unavailable. Retry to load the sample again.</p>${btn('Retry','data-state="default"')}</div>`:state==='empty'?`<div class="sp-empty"><h2>${view==='corners'?'No corner data':view==='history'?'No completed events':'No current events'}</h2><p>${view==='history'?'No ATP or WTA events were returned for the last 72 hours.':view==='live'?'No events were returned in this snapshot.':'The dataset has not returned any match records.'}</p>${btn('Refresh','data-state="default"')}</div>`:view==='corners'?corners():statusBar()+(scratch?'<p class="sp-scratch-note">Scratch mode · Drag the time slider to reveal prices from left to right. Reset hides the charts again. Final score and snapshot prices remain visible.</p>':'')+(state==='read-only'?'<p class="sp-small">Read-only access · Manual synchronization is unavailable.</p>':'')+`<div class="sp-groups">${DEMO[view].items.map(e=>`<section><div class="sp-group-header"><h2>${view==='history'?e.league:e.slug.split('-')[0].toUpperCase()}</h2><span class="sp-small">1 event</span></div>${event(e)}</section>`).join('')}</div>`}${footer()}`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.state){state=t.dataset.state;render()}else if(t.hasAttribute('data-refresh')){state='default';render();notify('Sample reloaded. No live request was sent.')}else if(t.id==='scratch-toggle'){scratch=!scratch;selections={};render()}else if(t.id==='scratch-reset'){selections={};render();notify('Scratch charts reset.')}else if(t.id==='sync-data'&&state!=='read-only'&&V21.canWrite('SPORTS_HISTORY')){state='syncing';render();notify('Preview only: synchronization is shown in progress. No synchronization was started.')}else if(t.hasAttribute('data-reset-filters')){search='';stage='all';outcome='all';sort='default';render()}else if(t.dataset.source){openDialog('Polymarket source',`<div class="sp-sync-preview"><p>This preview uses a synthetic event. The source link is shown for reference and is not opened.</p><code style="overflow-wrap:anywhere">https://polymarket.com/event/${esc(t.dataset.source)}</code>${copy('https://polymarket.com/event/'+t.dataset.source,'Source URL')}</div>`,btn('Close','data-close-dialog'))}else if(t.hasAttribute('data-method')){openDialog('Methodology & sources',`<div class="sp-sync-preview"><p><strong>90 minutes + stoppage time</strong><br>Count corners in periods 1–2. A combined total greater than 6.5 is a hit.</p><p><strong>Including extra time</strong><br>Full-match corners also include periods 3–4. Penalty shootouts are separate from the score after extra time.</p><p>Production dataset source: StatsBomb Open Data. These 8 review records are synthetic and do not reproduce the full 64-match tournament.</p><div class="sp-source-row"><code style="overflow-wrap:anywhere">https://github.com/statsbomb/open-data</code>${copy('https://github.com/statsbomb/open-data','Dataset source')}</div><p>Confirm the market-specific settlement rules before trading.</p><div class="sp-source-row"><code style="overflow-wrap:anywhere">https://docs.polymarket.us/faqs/sports-faqs</code>${copy('https://docs.polymarket.us/faqs/sports-faqs','Market rules')}</div></div>`,btn('Close','data-close-dialog'))}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.scrub){const key=t.dataset.scrub,old=selections[key]??0,next=Number(t.value);selections[key]=scratch?Math.max(old,next):next;t.value=selections[key];const chart=t.closest('.sp-chart'),event=DEMO[view].items.find(x=>x.eventKey===key);chart.querySelector('[data-lines]').style.clipPath=`inset(0 ${scratch?100-selections[key]/11*100:0}% 0 0)`;chart.querySelector('.sp-selection').innerHTML=selection(event,selections[key]);}else if(t.id==='corner-search'){search=t.value;document.getElementById('corner-records').innerHTML=cornerRecords()}});
document.addEventListener('change',e=>{if(e.target.id==='corner-stage')stage=e.target.value;else if(e.target.id==='corner-outcome')outcome=e.target.value;else if(e.target.id==='corner-sort')sort=e.target.value;else return;document.getElementById('corner-records').innerHTML=cornerRecords()});
document.addEventListener('pointermove',e=>{const plot=e.target.closest('[data-plot]');if(!plot||e.pointerType==='touch'&&!e.buttons)return;const box=plot.getBoundingClientRect(),i=Math.max(0,Math.min(11,Math.round((e.clientX-box.left)/box.width*11))),slider=plot.closest('.sp-chart').querySelector('[data-scrub]');slider.value=i;slider.dispatchEvent(new Event('input',{bubbles:true}))});
render();
})();
</script></body></html>
