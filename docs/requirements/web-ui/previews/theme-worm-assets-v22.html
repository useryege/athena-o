active.</label>',button('Cancel','close')+button('Authorize regeneration','regenerate-preview','destructive'));else if(a==='regenerate-preview'){if(!$('#ack-unknown').checked){notify('Acknowledge the unknown credential before continuing.');$('#ack-unknown').focus()}else notify('Acknowledgement recorded in preview only. No credential was regenerated.')}else if(a==='batch-clear'){batchPick.clear();render()}else if(a==='batch-review')batchReview();else if(a==='batch-authorize'){closeDialog();batchTargets=positions.filter(p=>batchPick.has(p.wallet.walletId));batchState='RUNNING';batchPick.clear();render();notify('Showing a synthetic running batch. No authorization or Close was sent.')}else if(a==='batch-pause'){batchState='PAUSED';render();notify('Showing a paused example; no real batch was changed.')}else if(a==='batch-continue')notify('Synthetic preflight is still waiting for a higher confirmed USDC balance. Later positions remain paused.');else if(a==='batch-check')notify('Synthetic status unchanged. Checking status never resends Close.');else if(a==='batch-terminate')openDialog('Terminate remaining Cash Outs?','<p class="dialog-intro">A Close already dispatched cannot be cancelled. Its outcome will still be reconciled; later frozen positions will be marked Not executed.</p><p class="muted-note">Preview only · No real batch command is sent.</p>',button('Keep batch','close')+button('Terminate remaining','terminate-confirm','destructive'));else if(a==='terminate-confirm'){closeDialog();batchState='TERMINATED';render();notify('Termination shown in preview only.')}});
render();
})();
</script></body></html>
