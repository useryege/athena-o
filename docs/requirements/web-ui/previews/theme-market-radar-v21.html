const fact=(label,value)=>`<div><dt>${label}</dt><dd>${value==null?'Unknown':e(value)}</dd></div>`;
const pp=w=>w?.warmup?'<span class="radar-warmup">Warmup</span>':w?.priceChangePp==null?'<span class="radar-unknown">Unknown</span>':`<span class="${w.priceChangePp>0?'radar-up':w.priceChangePp<0?'radar-down':''}">${w.priceChangePp>0?'+':''}${n(w.priceChangePp)}</span>`;
function windows(tokens){return `<div class="radar-windows"><div class="radar-window-head"><span>Outcome</span><span>Price</span><span>1m · pp</span><span>5m · pp</span><span>15m · pp</span></div>${tokens.map(t=>`<div class="radar-window-line"><span data-label="Outcome">${e(t.outcome)}</span><span data-label="Price">${prob(t.price)}</span>${['1m','5m','15m'].map(w=>`<span data-label="${w} · pp">${pp(t.windows.find(x=>x.window===w))}</span>`).join('')}</div>`).join('')}</div>`}
function ident(label,id){return `<div class="radar-ident"><div><span class="radar-label">${label}</span><code>${e(id||'Unknown')}</code></div>${id?copy(id,label):''}</div>`}
function details(row){return `<details class="radar-disclosure"><summary>Market facts & identifiers</summary><div class="radar-details"><dl class="radar-facts">${fact('24h volume · USD',n(row.volume24hr))}${fact('Total volume · USD',n(row.volumeNum))}${fact('Liquidity · USD',n(row.liquidityNum))}${fact('Market updated · UTC+8',timestamp(row.updatedAt))}${view==='hot'?fact('Spread · 0–1 price',n(row.spread))+fact('Best bid · 0–1 price',n(row.bestBid))+fact('Best ask · 0–1 price',n(row.bestAsk))+fact('Last trade · 0–1 price',n(row.lastTradePrice)):''}${fact('Market slug',row.marketSlug)}${fact('Event slug',row.eventSlug)}</dl>${ident('Condition ID',row.conditionId)}${row.tokens.map(t=>`<section class="radar-token-details"><h4>${e(t.outcome)} outcome</h4>${ident('Token ID',t.tokenId)}<dl class="radar-facts">${fact('Price · 0–1',n(t.price))}${view==='hot'?'':fact('Best bid',n(t.bestBid))+fact('Best ask',n(t.bestAsk))+fact('Spread',n(t.spread))+fact('Last trade price',n(t.lastTradePrice))+fact('Last trade size',n(t.lastTradeSize))+fact('Last trade side',t.lastTradeSide||'Unknown')+fact('Last sampled · UTC+8',timestamp(t.lastEventAt))+fact('Window state',t.warmup?'Warming up':'Ready')+(view==='movers'?fact('Score',n(t.score))+fact('Direction',t.direction||'Unknown'):'')+t.windows.map(w=>fact(w.window+' change · pp',w.warmup?'Warmup':n(w.priceChangePp))+fact(w.window+' samples',n(w.sampleCount))).join('')}</dl></section>`).join('')}</div></details>`}
function rowHTML(row){let body=view==='hot'?`<div class="radar-hot-metrics">${metric('24h volume',money(row.volume24hr))}${metric('Liquidity',money(row.liquidityNum))}${metric('Spread',n(row.spread))}</div>`:view==='realtime'?windows(row.tokens):`<div><div class="radar-leader">${metric('Leading outcome',e(row.leader?.outcome||'Unknown'))}${metric('Mover score',n(row.score))}${metric('Direction',`<span class="${row.direction==='up'?'radar-up':'radar-down'}">${row.direction==='up'?'Up':row.direction==='down'?'Down':'Unknown'}</span>`)}</div>${windows([row.leader])}</div>`;return `<article class="radar-row"><div class="radar-row-grid"><div><h3>${e(row.question)}</h3><div class="radar-slug">${e(row.eventSlug)}</div></div>${body}</div><div class="radar-row-foot">${view==='hot'?`<div class="radar-tokens">${row.tokens.map(t=>`<span class="radar-token">${e(t.outcome)}<strong>${prob(t.price)}</strong></span>`).join('')}</div>`:`<span>24h volume ${money(row.volume24hr)} · Liquidity ${money(row.liquidityNum)}</span>`}<span>Updated ${timestamp(row.updatedAt)} · UTC+8</span></div>${details(row)}</article>`}
function records(){if(state==='empty')return [];if(state==='many')return Array.from({length:60},(_,i)=>({...DEMO[view].items[i%DEMO[view].items.length],conditionId:'0x'+(i+1000).toString(16).padStart(64,'0'),question:DEMO[view].items[i%DEMO[view].items.length].question+' · Sample '+(i+1)}));return DEMO[view].items}
function render(){setContext(titles[view],view);const d=DEMO[view],items=records(),pages=Math.max(1,Math.ceil(items.length/pageSize));page=Math.min(page,pages);const current=items.slice((page-1)*pageSize,page*pageSize);const desc={hot:'Active markets ranked by 24-hour trading activity.',realtime:'Outcome prices and short-window changes from sampled market snapshots.',movers:'Markets ranked by the strongest weighted outcome-price movement.'}[view];
document.querySelector('#content').innerHTML=`<header class="radar-header"><div><h1>${titles[view]}</h1><p>${desc}</p></div><button id="radar-refresh" class="btn secondary" ${refreshing?'disabled':''}>${icon('refresh')}${refreshing?'Refreshing…':'Refresh'}</button></header>${state==='denied'?`<section class="radar-feedback"><h2>Market Radar access is unavailable</h2><p>Your account needs Market Radar read access. Market data is hidden in this preview.</p><button class="btn secondary" data-action="access">View access details</button></section>`:`<div class="radar-snapshot"><div>Fetched <strong>${timestamp(d.fetchedAt)}</strong> · UTC+8</div><div class="radar-status"><span class="${state==='stale'?'radar-warmup':'radar-up'}">${state==='stale'?'Stale snapshot':view==='hot'?'Current snapshot':'Sampling connected'}</span><span>${d.candidateCount} candidates · ${view==='realtime'?d.subscribedMarkets:d.monitoredMarkets} monitored markets</span></div></div>${state==='stale'?'<section class="radar-feedback"><h2>Showing the last available snapshot</h2><p>The latest refresh failed. Sampling is disconnected; displayed values may be out of date. Refresh to try again.</p></section>':''}${state==='error'?'<section class="radar-feedback"><h2>Market snapshot could not be loaded</h2><p>No cached snapshot is available. Refresh to try again.</p><button class="btn secondary" data-action="retry">Try again</button></section>':state==='loading'?'<section class="radar-panel" aria-label="Loading market snapshot" aria-busy="true"><div class="radar-skeleton"></div><div class="radar-skeleton"></div><div class="radar-skeleton"></div></section>':`<section class="radar-panel" aria-label="${titles[view]} records"><div class="radar-panel-heading"><div><h2>${{hot:'Market activity',realtime:'Price windows',movers:'Ranked movements'}[view]}</h2><p>${{hot:'Volume and liquidity in USD. Prices show implied probability.',realtime:'Changes are percentage points (pp). Warmup needs more samples.',movers:'Direction follows the window with the largest weighted contribution.'}[view]}</p></div><span class="radar-count">${items.length} markets</span></div>${items.length?current.map(rowHTML).join(''):`<div class="radar-empty"><h2>${view==='movers'?'No qualifying movers':'No markets available'}</h2><p>${view==='movers'?'No fresh outcome currently has a nonzero movement score. Warmup windows do not qualify.':'The snapshot returned no markets. Refresh to check the next available snapshot.'}</p></div>`}${view==='movers'?'<div class="radar-score-note">Score = |1m change| + 0.6 × |5m change| + 0.3 × |15m change|. Only fresh, non-warmup movements qualify.</div>':''}<footer class="radar-pager"><div class="radar-page-buttons"><button class="btn secondary icon-btn" aria-label="Previous page" data-action="previous" ${page===1?'disabled':''}><span style="display:flex;transform:rotate(180deg)">${icon('chevron')}</span></button><strong aria-label="Current page">${page}</strong><button class="btn secondary icon-btn" aria-label="Next page" data-action="next" ${page===pages?'disabled':''}>${icon('chevron')}</button><span>of ${pages}</span></div><label class="radar-page-size">Per page <select id="radar-page-size" aria-label="Rows per page">${[10,50,100].map(x=>`<option ${x===pageSize?'selected':''}>${x}</option>`).join('')}</select></label></footer></section>`}${view!=='hot'?`<p class="radar-score-note" style="border:0;padding:16px 0 0;margin:0">Last sampled ${timestamp(d.lastEventAt)} · UTC+8 · ${view==='realtime'?d.subscribedTokens:d.monitoredTokens} monitored tokens. Sampling uses periodic snapshots.</p>`:''}`}<footer class="radar-note">Visual preview · Synthetic market data as of ${DEMO.scenarioTime}. No live provider requests or trades.</footer><details class="radar-states"><summary>Preview states</summary><div class="radar-state-actions">${['ready','loading','empty','error','stale','denied','many'].map(s=>`<button class="btn secondary" data-state="${s}">${{ready:'Loaded',loading:'Loading',empty:'Empty',error:'Load failed',stale:'Stale / disconnected',denied:'Read access removed',many:'60 sample records'}[s]}</button>`).join('')}</div></details>`;
}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.state){state=b.dataset.state;page=1;render();return}if(b.id==='radar-refresh'||b.dataset.action==='retry'){refreshing=true;render();setTimeout(()=>{if(state!=='many'&&state!=='denied')state='ready';refreshing=false;render();notify('Preview snapshot reloaded. No provider request was sent.')},300)}if(b.dataset.action==='previous'){page--;render()}if(b.dataset.action==='next'){page++;render()}if(b.dataset.action==='access')V21.openDialog('Market Radar access','<p>This read-only module requires Market Radar read access. Access in other modules does not grant access here.</p><p class="muted">Preview state only. No account permissions were changed.</p>','<button class="btn secondary" data-close-dialog>Close</button>')});
document.addEventListener('change',ev=>{if(ev.target.id==='radar-page-size'){pageSize=Number(ev.target.value);page=1;render()}});new ResizeObserver(()=>document.documentElement.toggleAttribute('data-large-type',parseFloat(getComputedStyle(document.documentElement).fontSize)>=24)).observe(document.documentElement);render();
})();
</script></body></html>
