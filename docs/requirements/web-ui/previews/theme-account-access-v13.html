<main id="main"><div class="page-heading"><div><h1>Account Center</h1><p class="description">Manage your Athena identity, API keys, and current access.</p></div><div class="security-owner"><span class="avatar" aria-hidden="true">A</span><div><strong>Alex Chen</strong><small>@alexchen</small></div></div></div><div class="account-mobile-section"><label for="account-section">Account section</label><div class="section-select"><select id="account-section"><option value="Profile">Profile</option><option value="Security">Security</option><option value="Access & session" selected>Access &amp; session</option></select><svg class="icon" aria-hidden="true"><use href="#down"/></svg></div></div><div class="profile-layout"><nav class="profile-nav" aria-label="Account Center sections"><button type="button" data-account="Profile"><svg class="icon" aria-hidden="true"><use href="#v11-user"/></svg><span><strong>Profile</strong><small>Name and avatar</small></span></button><button type="button" data-account="Security"><svg class="icon" aria-hidden="true"><use href="#v11-shield"/></svg><span><strong>Security</strong><small>API keys and AI connections</small></span></button><button type="button" data-account="Access & session" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#v11-key"/></svg><span><strong>Access & session</strong><small>Permissions and versions</small></span></button></nav><div class="access-content" id="access-content"></div></div><footer class="preview-footer"><p>Visual preview · Synthetic identity, permissions and API version · No live checks or sign-out. Capture times use UTC+8.</p><details id="demo-controls"><summary>Explore sample states</summary><div class="demo-buttons"><button type="button" data-case="active">Current access</button><button type="button" data-case="expanded">Session details</button><button type="button" data-case="pending">Google pending</button><button type="button" data-case="phantom">Phantom pending</button><button type="button" data-case="refreshing">Refreshing permissions</button><button type="button" data-case="error">Refresh error</button><button type="button" data-case="version-unavailable">Version unavailable</button></div></details></footer></main></div><div class="notice" id="notice" role="status" hidden></div><script>const DEMO={"synthetic": true, "notice": "Visual demonstration: fictional identities, permissions and API version. No authorization or logout request is made.", "asOf": "2026-09-14T02:00:00Z", "uiVersion": "latest", "apiVersion": "v0.8.0-demo", "user": {"loggedIn": true, "accountId": "11111111-1111-4111-8111-111111111111", "username": "alexchen", "iss": "athena", "administrator": false, "profile": {"displayName": "Alex Chen", "tier": "ACCOUNT_TIER_STANDARD", "avatarUrl": "", "revision": "4"}, "preferences": {"theme": "ACCOUNT_THEME_DARK", "revision": "2"}, "access": {"loginEnabled": true, "apiKeyEnabled": true, "profitSharingEnabled": false, "revision": "7", "moduleAccess": [{"module": 1, "dataAccess": 1}, {"module": 2, "dataAccess": 1}, {"module": 3, "dataAccess": 0}, {"module": 4, "dataAccess": 0}, {"module": 5, "dataAccess": 0}, {"module": 11, "dataAccess": 0}, {"module": 7, "dataAccess": 0}, {"module": 8, "dataAccess": 0}, {"module": 13, "dataAccess": 1}, {"module": 9, "dataAccess": 2}, {"module": 12, "dataAccess": 2}]}, "identity": {"provider": "ACCOUNT_IDENTITY_PROVIDER_GOOGLE", "verifiedEmail": "alex.chen@example.invalid", "solanaAddress": "", "createdAt": 1783999440, "lastLoginAt": 1789351200}}, "pending": {"loggedIn": true, "accountId": "11111111-1111-4111-8111-111111111111", "username": "alexchen", "iss": "athena", "administrator": false, "profile": {"displayName": "Alex Chen", "tier": "ACCOUNT_TIER_STANDARD", "avatarUrl": "", "revision": "4"}, "preferences": {"theme": "ACCOUNT_THEME_DARK", "revision": "2"}, "access": {"loginEnabled": true, "apiKeyEnabled": false, "profitSharingEnabled": false, "revision": "1", "moduleAccess": []}, "identity": {"provider": "ACCOUNT_IDENTITY_PROVIDER_GOOGLE", "verifiedEmail": "alex.chen@example.invalid", "solanaAddress": "", "createdAt": 1783999440, "lastLoginAt": 1789351200}}, "phantom": {"loggedIn": true, "accountId": "11111111-1111-4111-8111-111111111111", "username": "alexchen", "iss": "athena", "administrator": false, "profile": {"displayName": "Alex Chen", "tier": "ACCOUNT_TIER_STANDARD", "avatarUrl": "", "revision": "4"}, "preferences": {"theme": "ACCOUNT_THEME_DARK", "revision": "2"}, "access": {"loginEnabled": true, "apiKeyEnabled": false, "profitSharingEnabled": false, "revision": "1", "moduleAccess": []}, "identity": {"provider": "ACCOUNT_IDENTITY_PROVIDER_SOLANA_WALLET", "verifiedEmail": "", "solanaAddress": "7fZdJmR6uFQ7kbKaojTcKVWHR3hyZiA8dCuYUBwXsMn2", "createdAt": 1783999440, "lastLoginAt": 1789351200}}, "modules": [{"module": 1, "id": "market_radar", "label": "Market Radar", "description": "Hot, realtime, and moving Polymarket discovery views.", "group": "markets", "maxAccess": 1, "dataAccess": 1, "accessLabel": "Read only"}, {"module": 2, "id": "sports_live", "label": "Sports Live", "description": "Current sports events and live price histories.", "group": "markets", "maxAccess": 1, "dataAccess": 1, "accessLabel": "Read only"}, {"module": 3, "id": "sports_history", "label": "Sports History", "description": "Completed sports history, sync state, and manual refresh.", "group": "markets", "maxAccess": 2, "dataAccess": 0, "accessLabel": "No access"}, {"module": 4, "id": "managed_oo", "label": "Managed OO", "description": "Managed Optimistic Oracle proposals, disputes, and block parsing.", "group": "markets", "maxAccess": 2, "dataAccess": 0, "accessLabel": "No access"}, {"module": 5, "id": "worm_markets", "label": "Worm Markets", "description": "Standalone Worm market data APIs.", "group": "markets", "maxAccess": 1, "apiOnly": true, "dataAccess": 0, "accessLabel": "No access"}, {"module": 11, "id": "worm_trading", "label": "Worm Trading", "description": "Owner-scoped Solana balances and Worm trading operations.", "group": "markets", "maxAccess": 2, "dataAccess": 0, "accessLabel": "No access"}, {"module": 7, "id": "world_cup_corners", "label": "World Cup Corners", "description": "Protected World Cup corner and result dataset.", "group": "markets", "maxAccess": 1, "dataAccess": 0, "accessLabel": "No access"}, {"module": 13, "id": "solana", "label": "Solana", "description": "Read-only discovery of newly initialized Solana token candidates.", "group": "token-risk", "maxAccess": 1, "dataAccess": 1, "accessLabel": "Read only"}, {"module": 9, "id": "wallet", "label": "Wallet", "description": "Wallet inventory, creation, import, aliases, and sensitive secret access.", "group": "token-risk", "maxAccess": 2, "dataAccess": 2, "accessLabel": "Read & write"}, {"module": 12, "id": "trader_sync", "label": "Trader Sync", "description": "Independent trader subscriptions and activity alerts.", "group": "markets", "maxAccess": 2, "dataAccess": 2, "accessLabel": "Read & write"}]};

const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let currentCase='active',refreshTimer=null;
const userFor=state=>state==='phantom'?DEMO.phantom:['pending','error','refreshing'].includes(state)?DEMO.pending:DEMO.user;
const isPending=state=>['pending','phantom','error','refreshing'].includes(state);
const grant=(value,label)=>'<span class="grant '+(value===2?'write':value===1?'read':'none')+'">'+esc(label)+'</span>';
const yesNo=value=>grant(value?2:0,value?'Yes':'No');
const field=(label,value,cls='')=>'<div'+(cls?' class="'+cls+'"':'')+'><dt>'+esc(label)+'</dt><dd>'+value+'</dd></div>';
const time=n=>n?'<time datetime="'+new Date(n*1000).toISOString()+'">'+new Date(n*1000).toLocaleDateString('en-GB',{timeZone:'Asia/Shanghai',day:'2-digit',month:'short',year:'numeric'})+'<span>'+new Date(n*1000).toLocaleTimeString('en-GB',{timeZone:'Asia/Shanghai',hour12:false})+'</span></time>':'Not yet';
function identity(user){const wallet=user.identity.provider==='ACCOUNT_IDENTITY_PROVIDER_SOLANA_WALLET';return{provider:wallet?'Phantom':'Google',label:wallet?'Solana address':'Verified email',value:wallet?user.identity.solanaAddress:user.identity.verifiedEmail,title:wallet?'Your Phantom wallet ownership is verified':'Your Google identity is verified',wallet}}
function identityCopy(user){const id=identity(user);return '<div class="identity-copy"><span class="identity-value'+(id.wallet?' wallet':'')+'">'+esc(id.value||'Unavailable')+'</span>'+(id.value?'<button class="icon-button" type="button" data-copy-identity aria-label="Copy '+esc(id.label.toLowerCase())+'">'+icon('v8-copy')+'</button>':'')+'</div>'}
function renderNavigation(state){const pending=isPending(state);const entry=(title,id)=>'<button class="nav-item" data-demo="'+title+'" aria-label="'+title+'" title="'+title+'">'+icon(id)+'<span class="label">'+title+'</span></button>';const group=(label,entries)=>'<div class="nav-group"><p class="group-label">'+label+'</p>'+entries+'</div>';
 $('module-navigation').innerHTML=(pending?'':group('Markets',entry('Market Radar','grid')+entry('Trader Sync','swap')+entry('Sports','cup'))+group('Token &amp; Risk',entry('Solana','layers')+entry('Wallets','wallet-icon')))+group('Operations',entry('Notifications','bell'));
 const securityEnabled=userFor(state).access.apiKeyEnabled;document.querySelector('[data-account="Security"]').hidden=!securityEnabled;document.querySelector('#account-menu [data-demo="Security"]').hidden=!securityEnabled;const option=document.querySelector('#account-section option[value="Security"]');option.hidden=!securityEnabled;option.disabled=!securityEnabled;
 document.querySelector('.page-heading .description').textContent=securityEnabled?'Manage your Athena identity, API keys, and current access.':'Manage your Athena identity and current access.';
}
function renderActive(state){const user=DEMO.user,id=identity(user);const count=[2,1,0].map(n=>DEMO.modules.filter(m=>m.dataAccess===n).length);return '<section class="access-panel" aria-labelledby="module-title"><div class="access-panel-heading"><h2 id="module-title">Module access</h2><p class="access-count">'+count[0]+' full · '+count[1]+' read · '+count[2]+' none</p></div><p class="access-intro">Your current permissions in Athena. Access is managed by an administrator.</p><ul class="module-list">'+DEMO.modules.map(m=>'<li class="module-row"><div><strong>'+esc(m.label)+'</strong><p>'+esc(m.description)+'</p></div>'+grant(m.dataAccess,m.accessLabel)+'</li>').join('')+'</ul><dl class="access-flags">'+field('API key access',yesNo(user.access.apiKeyEnabled))+field('Profit Sharing access',yesNo(user.access.profitSharingEnabled))+'</dl></section><section class="access-panel" aria-labelledby="session-title"><div class="access-panel-heading"><h2 id="session-title">Current session</h2><span class="session-status">Logged in '+yesNo(user.loggedIn)+'</span></div><dl class="session-grid">'+field(id.label,identityCopy(user),'session-identity')+field('Identity provider',esc(id.provider))+field('Username','@'+esc(user.username))+field('Role','Member')+field('Tier','Standard')+'</dl><details class="session-details" id="session-details"'+(state==='expanded'?' open':'')+'><summary>Times, revisions &amp; versions'+icon('down')+'</summary><dl class="session-grid">'+field('Account created',time(user.identity.createdAt))+field('Last sign-in',time(user.identity.lastLoginAt))+field('Access revision',esc(user.access.revision))+field('Issuer',esc(user.iss||'athena'))+field('UI version',esc(DEMO.uiVersion||'-'))+field('API version',esc(state==='version-unavailable'?'-':DEMO.apiVersion||'-'))+'</dl></details><p class="copy-feedback" id="copy-feedback" role="status" hidden></p></section>'}
function renderPending(state){const user=userFor(state),id=identity(user),busy=state==='refreshing';return '<section class="access-panel pending-panel" aria-labelledby="pending-title"><div class="access-panel-heading"><h2 id="pending-title">Access pending</h2><span class="pending-status"><span class="status-dot" aria-hidden="true"></span>Awaiting access</span></div><div class="pending-copy"><h3>'+esc(id.title)+'</h3><p>Your Athena account is ready, but an administrator has not granted business access yet. You can update your profile while you wait.</p></div><dl class="pending-identity">'+field(id.label,identityCopy(user))+'</dl><p class="pending-checked">Permissions are checked every 15 seconds and when this window regains focus. Last checked <time datetime="'+DEMO.asOf+'">10:00:00</time>.</p><div class="pending-actions"><button type="button" class="btn primary" id="refresh-permissions"'+(busy?' disabled aria-busy="true"':'')+'>'+icon('refresh-icon')+(busy?'Checking permissions…':'Refresh permissions')+'</button><button type="button" class="btn logout" id="log-out"'+(busy?' disabled':'')+'>'+icon('v13-logout')+'Log out</button></div><div class="security-feedback error pending-feedback" id="pending-error" role="alert"'+(state==='error'?'':' hidden')+'>'+icon('v8-warning')+'<div><strong>Could not refresh access</strong><p>The permission check could not be completed. Try Refresh permissions again.</p></div></div><p class="copy-feedback" id="copy-feedback" role="status" hidden></p></section>'}
function setCase(state){if(refreshTimer)clearTimeout(refreshTimer);currentCase=state;renderNavigation(state);$('access-content').innerHTML=isPending(state)?renderPending(state):renderActive(state);$('notice').hidden=true;document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.case===state)));}
async function copyIdentity(){const value=identity(userFor(currentCase)).value;try{await navigator.clipboard.writeText(value);$('copy-feedback').textContent='Copied the complete demonstration identity.'}catch{$('copy-feedback').textContent='Could not copy. Select and copy the identity manually.'}$('copy-feedback').hidden=false;}
const body=document.body,sidebar=document.getElementById('sidebar'),app=document.getElementById('app'),scrim=document.getElementById('scrim'),openNav=document.getElementById('open-nav'),closeNav=document.getElementById('close-nav'),collapse=document.getElementById('collapse'),account=document.getElementById('account'),accountMenu=document.getElementById('account-menu');
let noticeTimer;function notice(text){const el=document.getElementById('notice');el.textContent=text;el.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.hidden=true,5000)}
function setNav(open){body.classList.toggle('nav-open',open);scrim.hidden=!open;app.inert=open;openNav.setAttribute('aria-expanded',String(open));if(open){sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');closeNav.focus()}else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');openNav.focus()}}
openNav.addEventListener('click',()=>setNav(true));closeNav.addEventListener('click',()=>setNav(false));scrim.addEventListener('click',()=>setNav(false));collapse.addEventListener('click',()=>{const collapsed=body.classList.toggle('collapsed');collapse.setAttribute('aria-expanded',String(!collapsed));collapse.setAttribute('aria-label',collapsed?'Expand navigation':'Collapse navigation')});
const mobile=matchMedia('(max-width:900px)');mobile.addEventListener('change',()=>{if(body.classList.contains('nav-open')){setNav(false);collapse.focus()}});
account.addEventListener('click',()=>{accountMenu.hidden=!accountMenu.hidden;account.setAttribute('aria-expanded',String(!accountMenu.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.account-wrap')){accountMenu.hidden=true;account.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(body.classList.contains('nav-open'))setNav(false);if(!accountMenu.hidden){accountMenu.hidden=true;account.setAttribute('aria-expanded','false');account.focus()}}if(e.key==='Tab'&&body.classList.contains('nav-open')){const nodes=[...sidebar.querySelectorAll('button')].filter(x=>x.offsetParent!==null),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('account-section').addEventListener('change',e=>{notice('Visual preview only: '+e.target.value+'. No navigation.');e.target.value='Access & session'});
document.addEventListener('click',e=>{const state=e.target.closest('[data-case]');if(state){$('demo-controls').open=false;setCase(state.dataset.case);return}if(e.target.closest('[data-copy-identity]')){void copyIdentity();return}if(e.target.closest('#refresh-permissions')){const button=$('refresh-permissions'),logout=$('log-out');button.disabled=logout.disabled=true;button.setAttribute('aria-busy','true');button.innerHTML=icon('refresh-icon')+'Checking permissions…';$('pending-error').hidden=true;refreshTimer=setTimeout(()=>{button.disabled=logout.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=icon('refresh-icon')+'Refresh permissions';$('copy-feedback').textContent='Visual preview only: permissions are unchanged. No request was sent.';$('copy-feedback').hidden=false;button.focus({preventScroll:true})},650);return}if(e.target.closest('#log-out')){notice('Visual preview only: no session was ended.');return}const nav=e.target.closest('[data-account],[data-demo]');if(nav){if(body.classList.contains('nav-open'))setNav(false);notice('Visual preview only: '+(nav.dataset.account||nav.dataset.demo)+'. No navigation.')}});
setCase('active');
