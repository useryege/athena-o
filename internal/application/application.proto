syntax = "proto3";

package application;

option go_package = "github.com/useryege/athena/internal/application/apiclient";

service ApplicationService {
  rpc TestChainWatcher(TestChainWatcherRequest) returns (TestChainWatcherResponse);
}

message TestChainWatcherRequest {
  uint64 startBlock = 1;
  uint64 endBlock = 2;
}

message TestChainWatcherResponse {}
