syntax = "proto3";

// Application Service API exposes project discovery snapshots.
package athena.internal.application;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/application/apiclient";

// ListProjectsRequest queries the current known project snapshot.
message ListProjectsRequest {
  int32 page = 1;
  int32 pageSize = 2;
}

// ListProjectsResponse returns the current known project snapshot.
message ListProjectsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectListItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// GetProjectRequest queries the project snapshot for a given contract.
message GetProjectRequest {
  string contract = 1;
}

// GetProjectResponse returns the project snapshot for a given contract.
message GetProjectResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectView item = 1;
}

// ProjectEventLog is a project event timeline entry.
message ProjectEventLog {
  int64 id = 1;
  string contract = 2;
  int32 event_type = 3;
  string occurred_at = 4;
  string message = 5;
  string payload = 6;
  string created_at = 7;
}

// ListProjectEventLogsRequest queries event logs by contract.
message ListProjectEventLogsRequest {
  string contract = 1;
}

// ListProjectEventLogsResponse returns event logs for a contract.
message ListProjectEventLogsResponse {
  repeated ProjectEventLog items = 1;
}

// ProjectComment is a project comment timeline entry.
message ProjectComment {
  int64 id = 1;
  string contract = 2;
  string username = 3;
  string content = 4;
  string created_at = 5;
}

// AddProjectCommentRequest creates a project comment.
message AddProjectCommentRequest {
  string contract = 1;
  string username = 2;
  string content = 3;
}

// AddProjectCommentResponse returns the created project comment.
message AddProjectCommentResponse {
  ProjectComment item = 1;
}

// ListProjectCommentsRequest queries comments by contract.
message ListProjectCommentsRequest {
  string contract = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

// ListProjectCommentsResponse returns comments for a contract.
message ListProjectCommentsResponse {
  repeated ProjectComment items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// BytecodeBlacklistContract is a globally maintained bytecode-blacklist contract entry.
message BytecodeBlacklistContract {
  string contract = 1;
  string code_hash = 2;
  string note = 3;
  string created_at = 4;
}

// ListBytecodeBlacklistContractsRequest queries all bytecode-blacklist contract entries.
message ListBytecodeBlacklistContractsRequest {}

// ListBytecodeBlacklistContractsResponse returns all bytecode-blacklist contract entries.
message ListBytecodeBlacklistContractsResponse {
  repeated BytecodeBlacklistContract items = 1;
}

// AddBytecodeBlacklistContractRequest adds a bytecode-blacklist contract entry.
message AddBytecodeBlacklistContractRequest {
  string contract = 1;
  string note = 2;
}

// AddBytecodeBlacklistContractResponse returns the stored bytecode-blacklist contract entry.
message AddBytecodeBlacklistContractResponse {
  BytecodeBlacklistContract item = 1;
}

// UpdateBytecodeBlacklistContractNoteRequest updates the note of a bytecode-blacklist contract entry.
message UpdateBytecodeBlacklistContractNoteRequest {
  string contract = 1;
  string note = 2;
}

// UpdateBytecodeBlacklistContractNoteResponse returns the updated bytecode-blacklist contract entry.
message UpdateBytecodeBlacklistContractNoteResponse {
  BytecodeBlacklistContract item = 1;
}

// DeleteBytecodeBlacklistContractRequest deletes a bytecode-blacklist contract entry.
message DeleteBytecodeBlacklistContractRequest {
  string contract = 1;
}

// DeleteBytecodeBlacklistContractResponse is returned after deleting a bytecode-blacklist contract entry.
message DeleteBytecodeBlacklistContractResponse {}

// SourcecodeBlacklistContract is a globally maintained source-code hash blacklist contract entry.
message SourcecodeBlacklistContract {
  string source_hash = 1;
  string contract = 2;
  string note = 3;
  string created_at = 4;
}

// ListSourcecodeBlacklistContractsRequest queries all source-code hash blacklist contract entries.
message ListSourcecodeBlacklistContractsRequest {}

// ListSourcecodeBlacklistContractsResponse returns all source-code hash blacklist contract entries.
message ListSourcecodeBlacklistContractsResponse {
  repeated SourcecodeBlacklistContract items = 1;
}

// AddSourcecodeBlacklistContractRequest adds a source-code hash blacklist contract entry.
message AddSourcecodeBlacklistContractRequest {
  string contract = 1;
  string note = 2;
}

// AddSourcecodeBlacklistContractResponse returns the stored source-code hash blacklist contract entry.
message AddSourcecodeBlacklistContractResponse {
  SourcecodeBlacklistContract item = 1;
}

// UpdateSourcecodeBlacklistContractNoteRequest updates the note of a source-code hash blacklist contract entry.
message UpdateSourcecodeBlacklistContractNoteRequest {
  string contract = 1;
  string note = 2;
}

// UpdateSourcecodeBlacklistContractNoteResponse returns the updated source-code hash blacklist contract entry.
message UpdateSourcecodeBlacklistContractNoteResponse {
  SourcecodeBlacklistContract item = 1;
}

// DeleteSourcecodeBlacklistContractRequest deletes a source-code hash blacklist contract entry.
message DeleteSourcecodeBlacklistContractRequest {
  string contract = 1;
}

// DeleteSourcecodeBlacklistContractResponse is returned after deleting a source-code hash blacklist contract entry.
message DeleteSourcecodeBlacklistContractResponse {}

// WalletBlacklistEntry is a globally maintained wallet-blacklist entry.
message WalletBlacklistEntry {
  string wallet = 1;
  string note = 2;
  string created_at = 3;
}

// ListWalletBlacklistEntriesRequest queries all wallet-blacklist entries.
message ListWalletBlacklistEntriesRequest {}

// ListWalletBlacklistEntriesResponse returns all wallet-blacklist entries.
message ListWalletBlacklistEntriesResponse {
  repeated WalletBlacklistEntry items = 1;
}

// AddWalletBlacklistEntryRequest adds a wallet-blacklist entry.
message AddWalletBlacklistEntryRequest {
  string wallet = 1;
  string note = 2;
}

// AddWalletBlacklistEntryResponse returns the stored wallet-blacklist entry.
message AddWalletBlacklistEntryResponse {
  WalletBlacklistEntry item = 1;
}

// UpdateWalletBlacklistEntryNoteRequest updates the note of a wallet-blacklist entry.
message UpdateWalletBlacklistEntryNoteRequest {
  string wallet = 1;
  string note = 2;
}

// UpdateWalletBlacklistEntryNoteResponse returns the updated wallet-blacklist entry.
message UpdateWalletBlacklistEntryNoteResponse {
  WalletBlacklistEntry item = 1;
}

// DeleteWalletBlacklistEntryRequest deletes a wallet-blacklist entry.
message DeleteWalletBlacklistEntryRequest {
  string wallet = 1;
}

// DeleteWalletBlacklistEntryResponse is returned after deleting a wallet-blacklist entry.
message DeleteWalletBlacklistEntryResponse {}

// GetProjectOptionsRequest don't need any parameters.
message GetProjectOptionsRequest {}

// GetProjectOptionsResponse returns the options.
message GetProjectOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectOption options = 1;
}

service ApplicationService {
  // ListProjects returns the current known project snapshot.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // GetProject returns the project snapshot for a given contract.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // ListProjectEventLogs returns event logs for a given contract.
  rpc ListProjectEventLogs(ListProjectEventLogsRequest) returns (ListProjectEventLogsResponse);
  // AddProjectComment creates a project comment.
  rpc AddProjectComment(AddProjectCommentRequest) returns (AddProjectCommentResponse);
  // ListProjectComments returns comments for a given contract.
  rpc ListProjectComments(ListProjectCommentsRequest) returns (ListProjectCommentsResponse);
  // ListBytecodeBlacklistContracts returns all globally configured bytecode-blacklist contract entries.
  rpc ListBytecodeBlacklistContracts(ListBytecodeBlacklistContractsRequest) returns (ListBytecodeBlacklistContractsResponse);
  // AddBytecodeBlacklistContract adds a globally configured bytecode-blacklist contract entry.
  rpc AddBytecodeBlacklistContract(AddBytecodeBlacklistContractRequest) returns (AddBytecodeBlacklistContractResponse);
  // UpdateBytecodeBlacklistContractNote updates the note of a globally configured bytecode-blacklist contract entry.
  rpc UpdateBytecodeBlacklistContractNote(UpdateBytecodeBlacklistContractNoteRequest) returns (UpdateBytecodeBlacklistContractNoteResponse);
  // DeleteBytecodeBlacklistContract deletes a globally configured bytecode-blacklist contract entry.
  rpc DeleteBytecodeBlacklistContract(DeleteBytecodeBlacklistContractRequest) returns (DeleteBytecodeBlacklistContractResponse);
  // ListSourcecodeBlacklistContracts returns all globally configured source-code hash blacklist contract entries.
  rpc ListSourcecodeBlacklistContracts(ListSourcecodeBlacklistContractsRequest) returns (ListSourcecodeBlacklistContractsResponse);
  // AddSourcecodeBlacklistContract adds a globally configured source-code hash blacklist contract entry.
  rpc AddSourcecodeBlacklistContract(AddSourcecodeBlacklistContractRequest) returns (AddSourcecodeBlacklistContractResponse);
  // UpdateSourcecodeBlacklistContractNote updates the note of a globally configured source-code hash blacklist contract entry.
  rpc UpdateSourcecodeBlacklistContractNote(UpdateSourcecodeBlacklistContractNoteRequest) returns (UpdateSourcecodeBlacklistContractNoteResponse);
  // DeleteSourcecodeBlacklistContract deletes a globally configured source-code hash blacklist contract entry.
  rpc DeleteSourcecodeBlacklistContract(DeleteSourcecodeBlacklistContractRequest) returns (DeleteSourcecodeBlacklistContractResponse);
  // ListWalletBlacklistEntries returns all globally configured wallet-blacklist entries.
  rpc ListWalletBlacklistEntries(ListWalletBlacklistEntriesRequest) returns (ListWalletBlacklistEntriesResponse);
  // AddWalletBlacklistEntry adds a globally configured wallet-blacklist entry.
  rpc AddWalletBlacklistEntry(AddWalletBlacklistEntryRequest) returns (AddWalletBlacklistEntryResponse);
  // UpdateWalletBlacklistEntryNote updates the note of a globally configured wallet-blacklist entry.
  rpc UpdateWalletBlacklistEntryNote(UpdateWalletBlacklistEntryNoteRequest) returns (UpdateWalletBlacklistEntryNoteResponse);
  // DeleteWalletBlacklistEntry deletes a globally configured wallet-blacklist entry.
  rpc DeleteWalletBlacklistEntry(DeleteWalletBlacklistEntryRequest) returns (DeleteWalletBlacklistEntryResponse);
  // GetProjectOptions returns the options.
  rpc GetProjectOptions(GetProjectOptionsRequest) returns (GetProjectOptionsResponse);
}
