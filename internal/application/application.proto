syntax = "proto3";

// Application Service API exposes project discovery snapshots.
package athena.internal.application;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/application/apiclient";

// ListProjectsRequest queries the current known project snapshot.
message ListProjectsRequest {
  int32 page = 1;
  int32 pageSize = 2;
}

// ListProjectsResponse returns the current known project snapshot.
message ListProjectsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectListItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// GetProjectRequest queries the project snapshot for a given contract.
message GetProjectRequest {
  string contract = 1;
}

// GetProjectResponse returns the project snapshot for a given contract.
message GetProjectResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectView item = 1;
}

message GetProjectBaseRequest {
  string contract = 1;
}

message GetProjectBaseResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectBaseView item = 1;
}

message GetProjectReportRequest {
  string contract = 1;
}

message GetProjectReportResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectReport item = 1;
}

message GetProjectChainStateRequest {
  string contract = 1;
}

message GetProjectChainStateResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectChainState item = 1;
}

message GetProjectSimulationRequest {
  string contract = 1;
}

message GetProjectSimulationResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SimulateResult item = 1;
}

message GetProjectAveStateRequest {
	string contract = 1;
}

message GetProjectAveStateResponse {
	github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectAveState item = 1;
}

message RefreshProjectAveDetailRequest {
	string contract = 1;
}

message RefreshProjectAveDetailResponse {
	github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectAveState item = 1;
}

message ListProjectGenesisWalletsRequest {
  string contract = 1;
}

message ListProjectGenesisWalletsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.GenesisWalletState items = 1;
}

message ListProjectCreatorHistoricalProjectsRequest {
  string contract = 1;
}

message ListProjectCreatorHistoricalProjectsResponse {
  repeated string items = 1;
}

// ProjectEventLog is a project event timeline entry.
message ProjectEventLog {
  int64 id = 1;
  string contract = 2;
  int32 event_type = 3;
  string occurred_at = 4;
  string message = 5;
  string payload = 6;
  string created_at = 7;
}

// ListProjectEventLogsRequest queries event logs by contract.
message ListProjectEventLogsRequest {
  string contract = 1;
}

// ListProjectEventLogsResponse returns event logs for a contract.
message ListProjectEventLogsResponse {
  repeated ProjectEventLog items = 1;
}

// ProjectComment is a project comment timeline entry.
message ProjectComment {
  int64 id = 1;
  string contract = 2;
  string username = 3;
  string content = 4;
  string created_at = 5;
}

// AddProjectCommentRequest creates a project comment.
message AddProjectCommentRequest {
  string contract = 1;
  string username = 2;
  string content = 3;
}

// AddProjectCommentResponse returns the created project comment.
message AddProjectCommentResponse {
  ProjectComment item = 1;
}

// ListProjectCommentsRequest queries comments by contract.
message ListProjectCommentsRequest {
  string contract = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

// ListProjectCommentsResponse returns comments for a contract.
message ListProjectCommentsResponse {
  repeated ProjectComment items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// GetProjectOptionsRequest don't need any parameters.
message GetProjectOptionsRequest {}

// GetProjectOptionsResponse returns the options.
message GetProjectOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectOption options = 1;
}

service ApplicationService {
  // ListProjects returns the current known project snapshot.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // GetProject returns the project snapshot for a given contract.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc GetProjectBase(GetProjectBaseRequest) returns (GetProjectBaseResponse);
  rpc GetProjectReport(GetProjectReportRequest) returns (GetProjectReportResponse);
  rpc GetProjectChainState(GetProjectChainStateRequest) returns (GetProjectChainStateResponse);
  rpc GetProjectSimulation(GetProjectSimulationRequest) returns (GetProjectSimulationResponse);
  rpc GetProjectAveState(GetProjectAveStateRequest) returns (GetProjectAveStateResponse);
  rpc RefreshProjectAveDetail(RefreshProjectAveDetailRequest) returns (RefreshProjectAveDetailResponse);
  rpc ListProjectGenesisWallets(ListProjectGenesisWalletsRequest) returns (ListProjectGenesisWalletsResponse);
  rpc ListProjectCreatorHistoricalProjects(ListProjectCreatorHistoricalProjectsRequest) returns (ListProjectCreatorHistoricalProjectsResponse);
  // ListProjectEventLogs returns event logs for a given contract.
  rpc ListProjectEventLogs(ListProjectEventLogsRequest) returns (ListProjectEventLogsResponse);
  // AddProjectComment creates a project comment.
  rpc AddProjectComment(AddProjectCommentRequest) returns (AddProjectCommentResponse);
  // ListProjectComments returns comments for a given contract.
  rpc ListProjectComments(ListProjectCommentsRequest) returns (ListProjectCommentsResponse);
  // GetProjectOptions returns the options.
  rpc GetProjectOptions(GetProjectOptionsRequest) returns (GetProjectOptionsResponse);
}
