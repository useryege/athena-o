syntax = "proto3";

// Application Service API exposes project discovery snapshots.
package athena.internal.application;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/application/apiclient";

message GetProjectDiscoveryStatusRequest {}

message StartProjectDiscoveryRequest {}

message StopProjectDiscoveryRequest {}

// GetContractSourceInfoRequest asks the application service to resolve contract bytecode/source facts.
message GetContractSourceInfoRequest {
  int64 chain_id = 1;
  string contract = 2;
}

// ListBytecodesRequest queries stored bytecodes.
message ListBytecodesRequest {
  int64 page = 1;
  int64 page_size = 2;
  string code_hash = 3;
}

// ListBytecodesResponse returns stored bytecodes.
message ListBytecodesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.BytecodeListItem items = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

// GetBytecodeRequest queries one stored bytecode.
message GetBytecodeRequest {
  string code_hash = 1;
}

// ListBytecodeDeploymentsRequest queries contracts using a bytecode.
message ListBytecodeDeploymentsRequest {
  string code_hash = 1;
  int64 page = 2;
  int64 page_size = 3;
  int64 chain_id = 4;
  string contract = 5;
}

// ListBytecodeDeploymentsResponse returns contracts using a bytecode.
message ListBytecodeDeploymentsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.BytecodeDeployment items = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

// ListBytecodeBlacklistEntriesRequest queries all bytecode blacklist entries.
message ListBytecodeBlacklistEntriesRequest {}

// ListBytecodeBlacklistEntriesResponse returns bytecode blacklist entries.
message ListBytecodeBlacklistEntriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.BytecodeBlacklistEntry items = 1;
}

// AddBytecodeBlacklistEntryRequest adds a bytecode blacklist entry by code hash or source contract.
message AddBytecodeBlacklistEntryRequest {
  string code_hash = 1;
  int64 source_chain_id = 2;
  string source_contract = 3;
  string note = 4;
}

// AddBytecodeBlacklistEntryResponse returns the stored bytecode blacklist entry.
message AddBytecodeBlacklistEntryResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.BytecodeBlacklistEntry item = 1;
}

// UpdateBytecodeBlacklistNoteRequest updates a bytecode blacklist note.
message UpdateBytecodeBlacklistNoteRequest {
  string code_hash = 1;
  string note = 2;
}

// UpdateBytecodeBlacklistNoteResponse returns the updated bytecode blacklist entry.
message UpdateBytecodeBlacklistNoteResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.BytecodeBlacklistEntry item = 1;
}

// DeleteBytecodeBlacklistRequest deletes a bytecode blacklist entry.
message DeleteBytecodeBlacklistRequest {
  string code_hash = 1;
}

// DeleteBytecodeBlacklistResponse is returned after deleting a bytecode blacklist entry.
message DeleteBytecodeBlacklistResponse {}

// ListWalletBlacklistEntriesRequest queries all wallet blacklist entries.
message ListWalletBlacklistEntriesRequest {}

// ListWalletBlacklistEntriesResponse returns wallet blacklist entries.
message ListWalletBlacklistEntriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletBlacklistEntry items = 1;
}

// AddWalletBlacklistEntryRequest adds a wallet blacklist entry.
message AddWalletBlacklistEntryRequest {
  string wallet = 1;
  string note = 2;
}

// AddWalletBlacklistEntryResponse returns the stored wallet blacklist entry.
message AddWalletBlacklistEntryResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletBlacklistEntry item = 1;
}

// UpdateWalletBlacklistEntryNoteRequest updates a wallet blacklist note.
message UpdateWalletBlacklistEntryNoteRequest {
  string wallet = 1;
  string note = 2;
}

// UpdateWalletBlacklistEntryNoteResponse returns the updated wallet blacklist entry.
message UpdateWalletBlacklistEntryNoteResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletBlacklistEntry item = 1;
}

// DeleteWalletBlacklistEntryRequest deletes a wallet blacklist entry.
message DeleteWalletBlacklistEntryRequest {
  string wallet = 1;
}

// DeleteWalletBlacklistEntryResponse is returned after deleting a wallet blacklist entry.
message DeleteWalletBlacklistEntryResponse {}

// ListSourceQualityPromptsRequest queries source quality prompts.
message ListSourceQualityPromptsRequest {}

// ListSourceQualityPromptsResponse returns source quality prompt records.
message ListSourceQualityPromptsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.SourceQualityPrompt items = 1;
}

// GetSourceQualityPromptRequest queries one source quality prompt.
message GetSourceQualityPromptRequest {
  int64 id = 1;
}

// CreateSourceQualityPromptRequest creates a source quality prompt.
message CreateSourceQualityPromptRequest {
  string name = 1;
  string system_prompt = 2;
}

// CreateSourceQualityPromptResponse returns the created prompt.
message CreateSourceQualityPromptResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SourceQualityPrompt item = 1;
}

// UpdateSourceQualityPromptRequest creates a new source quality prompt version.
message UpdateSourceQualityPromptRequest {
  int64 id = 1;
  string name = 2;
  string system_prompt = 3;
}

// UpdateSourceQualityPromptResponse returns the new prompt version.
message UpdateSourceQualityPromptResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SourceQualityPrompt item = 1;
}

// ActivateSourceQualityPromptRequest marks a prompt as current.
message ActivateSourceQualityPromptRequest {
  int64 id = 1;
}

// ActivateSourceQualityPromptResponse returns the activated prompt.
message ActivateSourceQualityPromptResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SourceQualityPrompt item = 1;
}

// DeleteSourceQualityPromptRequest soft deletes a prompt.
message DeleteSourceQualityPromptRequest {
  int64 id = 1;
}

// DeleteSourceQualityPromptResponse is returned after deleting a prompt.
message DeleteSourceQualityPromptResponse {}

// GetProjectOptionsRequest don't need any parameters.
message GetProjectOptionsRequest {}

// GetProjectOptionsResponse returns the options.
message GetProjectOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectOption options = 1;
}

service ApplicationService {
  rpc GetProjectDiscoveryStatus(GetProjectDiscoveryStatusRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectDiscoveryStatus);
  rpc StartProjectDiscovery(StartProjectDiscoveryRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectDiscoveryStatus);
  rpc StopProjectDiscovery(StopProjectDiscoveryRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectDiscoveryStatus);
  // GetContractSourceInfo resolves bytecode/source facts for a contract.
  rpc GetContractSourceInfo(GetContractSourceInfoRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.ContractSourceInfo);
  // ListBytecodes returns stored bytecodes.
  rpc ListBytecodes(ListBytecodesRequest) returns (ListBytecodesResponse);
  // GetBytecode returns one stored bytecode.
  rpc GetBytecode(GetBytecodeRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.BytecodeDetail);
  // ListBytecodeDeployments returns contracts using a bytecode.
  rpc ListBytecodeDeployments(ListBytecodeDeploymentsRequest) returns (ListBytecodeDeploymentsResponse);
  // ListBytecodeBlacklistEntries returns configured bytecode blacklist entries.
  rpc ListBytecodeBlacklistEntries(ListBytecodeBlacklistEntriesRequest) returns (ListBytecodeBlacklistEntriesResponse);
  // AddBytecodeBlacklistEntry adds a bytecode blacklist entry.
  rpc AddBytecodeBlacklistEntry(AddBytecodeBlacklistEntryRequest) returns (AddBytecodeBlacklistEntryResponse);
  // UpdateBytecodeBlacklistNote updates a bytecode blacklist note.
  rpc UpdateBytecodeBlacklistNote(UpdateBytecodeBlacklistNoteRequest) returns (UpdateBytecodeBlacklistNoteResponse);
  // DeleteBytecodeBlacklist deletes a bytecode blacklist entry.
  rpc DeleteBytecodeBlacklist(DeleteBytecodeBlacklistRequest) returns (DeleteBytecodeBlacklistResponse);
  // ListWalletBlacklistEntries returns configured wallet blacklist entries.
  rpc ListWalletBlacklistEntries(ListWalletBlacklistEntriesRequest) returns (ListWalletBlacklistEntriesResponse);
  // AddWalletBlacklistEntry adds a wallet blacklist entry.
  rpc AddWalletBlacklistEntry(AddWalletBlacklistEntryRequest) returns (AddWalletBlacklistEntryResponse);
  // UpdateWalletBlacklistEntryNote updates a wallet blacklist note.
  rpc UpdateWalletBlacklistEntryNote(UpdateWalletBlacklistEntryNoteRequest) returns (UpdateWalletBlacklistEntryNoteResponse);
  // DeleteWalletBlacklistEntry deletes a wallet blacklist entry.
  rpc DeleteWalletBlacklistEntry(DeleteWalletBlacklistEntryRequest) returns (DeleteWalletBlacklistEntryResponse);
  // ListSourceQualityPrompts returns configured source quality prompts.
  rpc ListSourceQualityPrompts(ListSourceQualityPromptsRequest) returns (ListSourceQualityPromptsResponse);
  // GetSourceQualityPrompt returns one source quality prompt.
  rpc GetSourceQualityPrompt(GetSourceQualityPromptRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.SourceQualityPrompt);
  // CreateSourceQualityPrompt creates a source quality prompt.
  rpc CreateSourceQualityPrompt(CreateSourceQualityPromptRequest) returns (CreateSourceQualityPromptResponse);
  // UpdateSourceQualityPrompt creates a new prompt version.
  rpc UpdateSourceQualityPrompt(UpdateSourceQualityPromptRequest) returns (UpdateSourceQualityPromptResponse);
  // ActivateSourceQualityPrompt marks a prompt as current.
  rpc ActivateSourceQualityPrompt(ActivateSourceQualityPromptRequest) returns (ActivateSourceQualityPromptResponse);
  // DeleteSourceQualityPrompt soft deletes a prompt.
  rpc DeleteSourceQualityPrompt(DeleteSourceQualityPromptRequest) returns (DeleteSourceQualityPromptResponse);
  // GetProjectOptions returns the options.
  rpc GetProjectOptions(GetProjectOptionsRequest) returns (GetProjectOptionsResponse);
}
