syntax = "proto3";
package operationlog.internal.v1;
option go_package = "github.com/useryege/athena/internal/operationlog/apiclient;apiclient";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";

message OperationLogResource { string type = 1 [(gogoproto.jsontag) = "type,omitempty"]; string id = 2 [(gogoproto.jsontag) = "id,omitempty"]; string relation = 3 [(gogoproto.jsontag) = "relation,omitempty"]; bool reference_verified = 4 [(gogoproto.jsontag) = "referenceVerified,omitempty"]; }
message OperationLogChange { string field_code = 1 [(gogoproto.jsontag) = "fieldCode,omitempty"]; string before_value = 2 [(gogoproto.jsontag) = "beforeValue,omitempty"]; string after_value = 3 [(gogoproto.jsontag) = "afterValue,omitempty"]; bool before_available = 4 [(gogoproto.jsontag) = "beforeAvailable,omitempty"]; string value_kind = 5 [(gogoproto.jsontag) = "valueKind,omitempty"]; }
message OperationLogCounts { string requested = 1 [(gogoproto.jsontag) = "requested,omitempty"]; string confirmed = 2 [(gogoproto.jsontag) = "confirmed,omitempty"]; string failed = 3 [(gogoproto.jsontag) = "failed,omitempty"]; string unknown = 4 [(gogoproto.jsontag) = "unknown,omitempty"]; }
message OperationLogProtocolResult { string grpc_code = 1 [(gogoproto.jsontag) = "grpcCode,omitempty"]; string http_status = 2 [(gogoproto.jsontag) = "httpStatus,omitempty"]; string reason_code = 3 [(gogoproto.jsontag) = "reasonCode,omitempty"]; bool response_write_failed = 4 [(gogoproto.jsontag) = "responseWriteFailed,omitempty"]; }
message OperationLogSourceFacts { string producer_id = 1 [(gogoproto.jsontag) = "producerId,omitempty"]; string first_received_at = 2 [(gogoproto.jsontag) = "firstReceivedAt,omitempty"]; string last_received_at = 3 [(gogoproto.jsontag) = "lastReceivedAt,omitempty"]; repeated string phases_received = 4 [(gogoproto.jsontag) = "phasesReceived,omitempty"]; string snapshot_sequence = 5 [(gogoproto.jsontag) = "snapshotSequence,omitempty"]; }
message OperationLogProducerStatus { string producer_id = 1 [(gogoproto.jsontag) = "producerId,omitempty"]; string started_at = 2 [(gogoproto.jsontag) = "startedAt,omitempty"]; string last_seen_at = 3 [(gogoproto.jsontag) = "lastSeenAt,omitempty"]; string stopped_at = 4 [(gogoproto.jsontag) = "stoppedAt,omitempty"]; string attempted_events = 5 [(gogoproto.jsontag) = "attemptedEvents,omitempty"]; string confirmed_events = 6 [(gogoproto.jsontag) = "confirmedEvents,omitempty"]; string unconfirmed_events = 7 [(gogoproto.jsontag) = "unconfirmedEvents,omitempty"]; string invalid_events = 8 [(gogoproto.jsontag) = "invalidEvents,omitempty"]; string capacity_rejected_events = 9 [(gogoproto.jsontag) = "capacityRejectedEvents,omitempty"]; string last_failure_at = 10 [(gogoproto.jsontag) = "lastFailureAt,omitempty"]; string last_failure_code = 11 [(gogoproto.jsontag) = "lastFailureCode,omitempty"]; string last_recovered_at = 12 [(gogoproto.jsontag) = "lastRecoveredAt,omitempty"]; bool persistence_reachable = 13 [(gogoproto.jsontag) = "persistenceReachable,omitempty"]; }
message Viewer { string account_id = 1 [(gogoproto.jsontag) = "accountId,omitempty"]; string realm = 2 [(gogoproto.jsontag) = "realm,omitempty"]; string credential_kind = 3 [(gogoproto.jsontag) = "credentialKind,omitempty"]; bytes session_binding = 4 [(gogoproto.jsontag) = "sessionBinding,omitempty"]; uint64 access_revision = 5 [(gogoproto.jsontag) = "accessRevision,omitempty"]; }
message ListOperationLogsRequest {
 string from = 1 [(gogoproto.jsontag) = "from,omitempty"]; string to = 2 [(gogoproto.jsontag) = "to,omitempty"]; string actor_query = 3 [(gogoproto.jsontag) = "actorQuery,omitempty"]; string actor_role = 4 [(gogoproto.jsontag) = "actorRole,omitempty"]; string credential_kind = 5 [(gogoproto.jsontag) = "credentialKind,omitempty"]; string module_code = 6 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string action_code = 7 [(gogoproto.jsontag) = "actionCode,omitempty"]; string outcome = 8 [(gogoproto.jsontag) = "outcome,omitempty"]; string target_account_id = 9 [(gogoproto.jsontag) = "targetAccountId,omitempty"]; string resource_type = 10 [(gogoproto.jsontag) = "resourceType,omitempty"]; string resource_id = 11 [(gogoproto.jsontag) = "resourceId,omitempty"]; int32 page_size = 12 [(gogoproto.jsontag) = "pageSize,omitempty"]; string cursor = 13 [(gogoproto.jsontag) = "cursor,omitempty"]; Viewer viewer = 14 [(gogoproto.jsontag) = "viewer,omitempty"]; }
message GetOperationLogRequest { string operation_id = 1 [(gogoproto.jsontag) = "operationId,omitempty"]; string snapshot_token = 2 [(gogoproto.jsontag) = "snapshotToken,omitempty"]; Viewer viewer = 3 [(gogoproto.jsontag) = "viewer,omitempty"]; }
message OperationLogSummary {
 string operation_id = 1 [(gogoproto.jsontag) = "operationId,omitempty"]; string started_at = 2 [(gogoproto.jsontag) = "startedAt,omitempty"]; string actor_account_id = 3 [(gogoproto.jsontag) = "actorAccountId,omitempty"]; string actor_username = 4 [(gogoproto.jsontag) = "actorUsername,omitempty"]; string actor_role = 5 [(gogoproto.jsontag) = "actorRole,omitempty"]; string realm = 6 [(gogoproto.jsontag) = "realm,omitempty"]; string credential_kind = 7 [(gogoproto.jsontag) = "credentialKind,omitempty"]; bool identity_verified = 8 [(gogoproto.jsontag) = "identityVerified,omitempty"]; bool identity_snapshot_complete = 9 [(gogoproto.jsontag) = "identitySnapshotComplete,omitempty"]; string module_code = 10 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string action_code = 11 [(gogoproto.jsontag) = "actionCode,omitempty"]; string primary_resource_type = 12 [(gogoproto.jsontag) = "primaryResourceType,omitempty"]; string primary_resource_id = 13 [(gogoproto.jsontag) = "primaryResourceId,omitempty"]; string outcome = 14 [(gogoproto.jsontag) = "outcome,omitempty"]; string observation = 15 [(gogoproto.jsontag) = "observation,omitempty"]; string reason_code = 16 [(gogoproto.jsontag) = "reasonCode,omitempty"]; string duration_ms = 17 [(gogoproto.jsontag) = "durationMs,omitempty"]; string business_state = 18 [(gogoproto.jsontag) = "businessState,omitempty"]; string resource_count = 19 [(gogoproto.jsontag) = "resourceCount,omitempty"]; bool resources_complete = 20 [(gogoproto.jsontag) = "resourcesComplete,omitempty"]; bool response_write_failed = 21 [(gogoproto.jsontag) = "responseWriteFailed,omitempty"]; string provider = 22 [(gogoproto.jsontag) = "provider,omitempty"]; string target_account_id = 23 [(gogoproto.jsontag) = "targetAccountId,omitempty"]; }
message Page { string next_cursor = 1 [(gogoproto.jsontag) = "nextCursor,omitempty"]; string snapshot_token = 2 [(gogoproto.jsontag) = "snapshotToken,omitempty"]; string snapshot_sequence = 3 [(gogoproto.jsontag) = "snapshotSequence,omitempty"]; string snapshot_at = 4 [(gogoproto.jsontag) = "snapshotAt,omitempty"]; int32 page_size = 5 [(gogoproto.jsontag) = "pageSize,omitempty"]; }
message AppliedFilters { string from = 1 [(gogoproto.jsontag) = "from,omitempty"]; string to = 2 [(gogoproto.jsontag) = "to,omitempty"]; string actor_query = 3 [(gogoproto.jsontag) = "actorQuery,omitempty"]; string actor_role = 4 [(gogoproto.jsontag) = "actorRole,omitempty"]; string credential_kind = 5 [(gogoproto.jsontag) = "credentialKind,omitempty"]; string module_code = 6 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string action_code = 7 [(gogoproto.jsontag) = "actionCode,omitempty"]; string outcome = 8 [(gogoproto.jsontag) = "outcome,omitempty"]; string target_account_id = 9 [(gogoproto.jsontag) = "targetAccountId,omitempty"]; string resource_type = 10 [(gogoproto.jsontag) = "resourceType,omitempty"]; string resource_id = 11 [(gogoproto.jsontag) = "resourceId,omitempty"]; }
message ListOperationLogsResponse { repeated OperationLogSummary items = 1 [(gogoproto.jsontag) = "items,omitempty"]; Page page = 2 [(gogoproto.jsontag) = "page,omitempty"]; AppliedFilters applied_filters = 3 [(gogoproto.jsontag) = "appliedFilters,omitempty"]; }
message OperationLogDetail { OperationLogSummary summary = 1 [(gogoproto.jsontag) = "summary,omitempty"]; string finished_at = 2 [(gogoproto.jsontag) = "finishedAt,omitempty"]; string request_id = 3 [(gogoproto.jsontag) = "requestId,omitempty"]; string parent_operation_id = 4 [(gogoproto.jsontag) = "parentOperationId,omitempty"]; string business_request_id = 5 [(gogoproto.jsontag) = "businessRequestId,omitempty"]; string provider = 6 [(gogoproto.jsontag) = "provider,omitempty"]; string effect = 7 [(gogoproto.jsontag) = "effect,omitempty"]; repeated string resources = 8 [(gogoproto.jsontag) = "resourceIds,omitempty"]; repeated string changes = 9 [(gogoproto.jsontag) = "changeCodes,omitempty"]; repeated string counts = 10 [(gogoproto.jsontag) = "countFacts,omitempty"]; string protocol_result = 11 [(gogoproto.jsontag) = "protocolResultText,omitempty"]; string source_facts = 12 [(gogoproto.jsontag) = "sourceFactsText,omitempty"]; repeated OperationLogResource resource_facts = 13 [(gogoproto.jsontag) = "resources,omitempty"]; repeated OperationLogChange change_facts = 14 [(gogoproto.jsontag) = "changes,omitempty"]; OperationLogCounts count_facts = 15 [(gogoproto.jsontag) = "counts,omitempty"]; OperationLogProtocolResult protocol = 16 [(gogoproto.jsontag) = "protocolResult,omitempty"]; OperationLogSourceFacts source = 17 [(gogoproto.jsontag) = "sourceFacts,omitempty"]; }
message GetOperationLogResponse { OperationLogDetail item = 1 [(gogoproto.jsontag) = "item,omitempty"]; }
message RuntimeStatus { string service_epoch = 1 [(gogoproto.jsontag) = "serviceEpoch,omitempty"]; string checked_at = 2 [(gogoproto.jsontag) = "checkedAt,omitempty"]; bool query_ready = 3 [(gogoproto.jsontag) = "queryReady,omitempty"]; string projection_state = 4 [(gogoproto.jsontag) = "projectionState,omitempty"]; string last_published_at = 5 [(gogoproto.jsontag) = "lastPublishedAt,omitempty"]; string publication_sequence = 6 [(gogoproto.jsontag) = "publicationSequence,omitempty"]; string pending_events = 7 [(gogoproto.jsontag) = "pendingEvents,omitempty"]; string oldest_pending_received_at = 8 [(gogoproto.jsontag) = "oldestPendingReceivedAt,omitempty"]; string quarantined_events = 9 [(gogoproto.jsontag) = "quarantinedEvents,omitempty"]; string last_processing_error_code = 10 [(gogoproto.jsontag) = "lastProcessingErrorCode,omitempty"]; repeated OperationLogProducerStatus observed_producers = 11 [(gogoproto.jsontag) = "observedProducers,omitempty"]; string total_observed = 12 [(gogoproto.jsontag) = "totalObserved,omitempty"]; bool producers_complete = 13 [(gogoproto.jsontag) = "producersComplete,omitempty"]; }
message GetOperationLogRuntimeStatusRequest { Viewer viewer = 1 [(gogoproto.jsontag) = "viewer,omitempty"]; }
message GetOperationLogRuntimeStatusResponse { RuntimeStatus status = 1 [(gogoproto.jsontag) = "status,omitempty"]; }
service OperationLogInternalService {
 rpc ListOperationLogs(ListOperationLogsRequest) returns (ListOperationLogsResponse) { option (google.api.http) = { get: "/internal/v1/operation-logs" }; }
 rpc GetOperationLog(GetOperationLogRequest) returns (GetOperationLogResponse) { option (google.api.http) = { get: "/internal/v1/operation-logs/{operation_id}" }; }
 rpc GetOperationLogRuntimeStatus(GetOperationLogRuntimeStatusRequest) returns (GetOperationLogRuntimeStatusResponse) { option (google.api.http) = { get: "/internal/v1/operation-log-runtime" }; }
}
