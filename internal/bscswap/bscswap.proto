syntax = "proto3";

// BSC Swap Transaction Service exposes finalized BNB Smart Chain Mainnet
// transactions that emitted at least one configured V2 Swap topic log.
package athena.internal.bscswap;

option go_package = "github.com/useryege/athena/internal/bscswap/apiclient";

// ListSwapTransactionsRequest lists matching transactions sent by one wallet,
// newest first. The first page requires before_block_number. Continuation pages
// use page_token and leave before_block_number unset.
message ListSwapTransactionsRequest {
  string wallet_address = 1;
  uint64 before_block_number = 2;
  int32 page_size = 3;
  string page_token = 4;
}

// ListSwapTransactionsResponse returns transaction hashes and the scanner
// position that bounds the available data.
message ListSwapTransactionsResponse {
  repeated string transaction_hashes = 1;
  string next_page_token = 2;
  uint64 indexed_through_block = 3;
  uint64 indexed_through_timestamp = 4;
}

service BscSwapTransactionService {
  // ListSwapTransactions returns matching transaction hashes sent by one wallet.
  rpc ListSwapTransactions(ListSwapTransactionsRequest) returns (ListSwapTransactionsResponse);
}
