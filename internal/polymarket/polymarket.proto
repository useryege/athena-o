syntax = "proto3";

// Polymarket Service API exposes polymarket service runtime status.
package athena.internal.polymarket;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/polymarket/apiclient";

// GetPolymarketStatusRequest queries the polymarket service runtime status.
message GetPolymarketStatusRequest {}

// ListPolymarketHotMarketsRequest queries discovered hot markets.
message ListPolymarketHotMarketsRequest {
  int32 limit = 1;
}

// ListPolymarketHotMarketsResponse returns discovered hot markets.
message ListPolymarketHotMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketHotMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  int32 monitored_markets = 4;
  int32 monitored_tokens = 5;
  int32 candidate_count = 6;
}

// ListPolymarketRealtimeMarketsRequest queries realtime market rows.
message ListPolymarketRealtimeMarketsRequest {
  int32 limit = 1;
}

// ListPolymarketRealtimeMarketsResponse returns realtime market rows.
message ListPolymarketRealtimeMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketRealtimeMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  int32 subscribed_markets = 4;
  int32 subscribed_tokens = 5;
  bool connected = 6;
  int64 last_event_at = 7;
  int32 candidate_count = 8;
}

// ListPolymarketMoversRequest queries price mover market rows.
message ListPolymarketMoversRequest {
  int32 limit = 1;
}

// ListPolymarketMoversResponse returns price mover market rows.
message ListPolymarketMoversResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketMoverMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  bool connected = 4;
  int64 last_event_at = 5;
  int32 monitored_markets = 6;
  int32 monitored_tokens = 7;
  int32 candidate_count = 8;
}

// ListPolymarketSportsLiveMarketsRequest queries sports live market rows.
message ListPolymarketSportsLiveMarketsRequest {
  int32 limit = 1;
}

// ListPolymarketSportsLiveMarketsResponse returns sports live market rows.
message ListPolymarketSportsLiveMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketSportsLiveMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
}

service PolymarketService {
  // GetPolymarketStatus returns the polymarket service runtime status.
  rpc GetPolymarketStatus(GetPolymarketStatusRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketStatus);

  // ListPolymarketHotMarkets returns discovered hot markets.
  rpc ListPolymarketHotMarkets(ListPolymarketHotMarketsRequest) returns (ListPolymarketHotMarketsResponse);

  // ListPolymarketRealtimeMarkets returns realtime market rows.
  rpc ListPolymarketRealtimeMarkets(ListPolymarketRealtimeMarketsRequest) returns (ListPolymarketRealtimeMarketsResponse);

  // ListPolymarketMovers returns price mover market rows.
  rpc ListPolymarketMovers(ListPolymarketMoversRequest) returns (ListPolymarketMoversResponse);

  // ListPolymarketSportsLiveMarkets returns sports live market rows.
  rpc ListPolymarketSportsLiveMarkets(ListPolymarketSportsLiveMarketsRequest) returns (ListPolymarketSportsLiveMarketsResponse);
}
