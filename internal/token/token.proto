syntax = "proto3";

// Token Service API exposes token-level workload status.
package athena.internal.token;

option go_package = "github.com/useryege/athena/internal/token/apiclient";

// GetTokenStatusRequest queries the token service runtime status.
message GetTokenStatusRequest {}

// GetTokenStatusResponse returns the token service runtime status.
message GetTokenStatusResponse {
  bool started = 1;
  string status = 2;
}

service TokenService {
  // GetTokenStatus returns the token service runtime status.
  rpc GetTokenStatus(GetTokenStatusRequest) returns (GetTokenStatusResponse);
}
