syntax = "proto3";

// Worm Markets Service API exposes Worm sports-market workloads.
package athena.internal.wormmarkets;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/wormmarkets/apiclient";

// GetWormMarketsStatusRequest queries the Worm Markets service runtime status.
message GetWormMarketsStatusRequest {}

// GetWormMarketsStatusResponse returns the Worm Markets service runtime status.
message GetWormMarketsStatusResponse {
  bool started = 1;
  string status = 2;
}

// GetWormEventRequest queries one Worm event by condition id.
message GetWormEventRequest {
  string condition_id = 1;
}

// GetWormEventResponse returns one Worm event and related market summaries.
message GetWormEventResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WormMarketsEventItem event = 1;
  int64 fetched_at = 2;
}

// GetOrderEventCatalogRequest queries one Worm event for order-combination
// construction. event_condition_id must be one canonical Solana public key.
message GetOrderEventCatalogRequest {
  string event_condition_id = 1;
}

// OrderEventCatalogOutcome is one canonical YES or NO direction. A direction
// is selectable only when the market-wide checks and its own 1x leverage check
// pass. unavailable_code is a stable machine-readable reason.
message OrderEventCatalogOutcome {
  bool is_yes = 1;
  string label = 2;
  string max_leverage = 3;
  bool selectable = 4;
  string unavailable_code = 5;
}

// OrderEventCatalogMarket is one child market of an order event. Detail
// failures remain in the catalog but are explicitly unavailable.
message OrderEventCatalogMarket {
  string market_condition_id = 1;
  string event_condition_id = 2;
  string title = 3;
  string logo = 4;
  string state = 5;
  bool margin_enabled = 6;
  string backend = 7;
  string unavailable_code = 8;
  repeated OrderEventCatalogOutcome outcomes = 9;
}

// OrderEventCatalog is a fresh provider-backed event and its complete ordered
// child-market catalog.
message OrderEventCatalog {
  string event_condition_id = 1;
  string title = 2;
  string logo = 3;
  repeated OrderEventCatalogMarket markets = 4;
}

// GetOrderEventCatalogResponse returns a fresh catalog without performing
// margin estimates or any Worm mutation.
message GetOrderEventCatalogResponse {
  OrderEventCatalog event = 1;
  int64 fetched_at = 2;
}

// ListWormEventsRequest queries Worm events for the configured browse view.
message ListWormEventsRequest {
  int32 limit = 1;
  string cursor = 2;
  string sort_option = 3;
  string category_slug = 4;
}

// ListWormEventsResponse returns Worm events and cursor pagination.
message ListWormEventsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WormMarketsEventItem events = 1;
  string next_cursor = 2;
  int64 fetched_at = 3;
  bool stale = 4;
}

service WormMarketsService {
  // GetWormMarketsStatus returns the Worm Markets service runtime status.
  rpc GetWormMarketsStatus(GetWormMarketsStatusRequest) returns (GetWormMarketsStatusResponse);

  // GetWormEvent returns an event and related market summaries by condition id.
  rpc GetWormEvent(GetWormEventRequest) returns (GetWormEventResponse);

  // GetOrderEventCatalog returns a fresh order-construction catalog by event
  // condition id without estimating or mutating a trade.
  rpc GetOrderEventCatalog(GetOrderEventCatalogRequest) returns (GetOrderEventCatalogResponse);

  // ListWormEvents returns events for the requested browse filters.
  rpc ListWormEvents(ListWormEventsRequest) returns (ListWormEventsResponse);
}
