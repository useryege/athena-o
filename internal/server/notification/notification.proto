syntax = "proto3";

import "gogoproto/gogo.proto";

// Notification Service exposes member Telegram binding and administrator
// system-notification operations.
package notification;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/notification";

message TelegramNotificationBinding {
  string status = 1;
  string telegram_username = 2;
  string telegram_display_name = 3;
  string bound_at = 4;
  int64 revision = 5;
}

message TelegramNotificationBindingAttempt {
  string id = 1;
  string status = 2;
  string expires_at = 3;
  string failure_reason = 4;
}

message GetTelegramBindingRequest {}

message GetTelegramBindingResponse {
  bool bot_available = 1;
  string bot_username = 2;
  TelegramNotificationBinding binding = 3;
  TelegramNotificationBindingAttempt attempt = 4;
}

message CreateTelegramBindingAttemptRequest {}

message CreateTelegramBindingAttemptResponse {
  TelegramNotificationBindingAttempt attempt = 1;
  string bot_username = 2;
  string deep_link = 3;
  string fallback_command = 4;
}

message DeleteTelegramBindingAttemptRequest {}

message DeleteTelegramBindingAttemptResponse {
  bool deleted = 1;
}

message DeleteTelegramBindingRequest {}

message DeleteTelegramBindingResponse {
  bool deleted = 1;
}

message GetNotificationRuntimeStatusRequest {}


// Recovery is observed by the sender process. Missing remaining evidence is not zero.
message NotificationRecoveryStatus {
  string state = 1;
  string reason = 2;
  string started_at = 3 [json_name="startedAt", (gogoproto.jsontag)="startedAt,omitempty"];
  string remaining_millis = 4 [json_name="remainingMillis", (gogoproto.jsontag)="remainingMillis,omitempty"];
  string elapsed_millis = 5 [json_name="elapsedMillis", (gogoproto.jsontag)="elapsedMillis,omitempty"];
  string clock_source = 6 [json_name="clockSource", (gogoproto.jsontag)="clockSource,omitempty"];
}

message NotificationRuntimeStatus {
  bool started = 1;
  string status = 2;
  bool bot_available = 3;
  int64 bot_id = 4;
  string bot_username = 5;
  bool poller_active = 6;
  string last_poll_at = 7;
  string last_update_at = 8;
  int64 system_pending_count = 9;
  int64 system_retry_count = 10;
  int64 system_failed_count = 11;
  int64 account_pending_count = 12;
  int64 account_retry_count = 13;
  int64 account_failed_count = 14;
  int64 unreachable_binding_count = 15;
  int64 system_sending_count = 16;
  int64 system_unknown_count = 17;
  int64 account_sending_count = 18;
  int64 account_unknown_count = 19;
  NotificationRecoveryStatus recovery = 20;
}

message ListSystemNotificationDeliveriesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;
  string severity = 4;
  string source = 5;
  string keyword = 6;
  string topic_label = 7;
  string telegram_chat = 8;
}

message ListSystemNotificationDeliveriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.SystemNotificationDeliveryItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetSystemNotificationDeliveryRequest {
  int64 id = 1;
}

message GetSystemNotificationDeliveryResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SystemNotificationDeliveryDetail item = 1;
}

message SendSystemNotificationTestRequest {
  string topic_label = 1;
}

message SendSystemNotificationTestResponse {
  int64 notification_id = 1;
  string status = 2;
  string provider_message_id = 3;
  string error_message = 4;
}

service NotificationService {
  rpc GetTelegramBinding(GetTelegramBindingRequest) returns (GetTelegramBindingResponse) {
    option (google.api.http) = {get: "/api/v1/notification-bindings/telegram"};
  }

  rpc CreateTelegramBindingAttempt(CreateTelegramBindingAttemptRequest) returns (CreateTelegramBindingAttemptResponse) {
    option (google.api.http) = {post: "/api/v1/notification-bindings/telegram/attempt"};
  }

  rpc DeleteTelegramBindingAttempt(DeleteTelegramBindingAttemptRequest) returns (DeleteTelegramBindingAttemptResponse) {
    option (google.api.http) = {delete: "/api/v1/notification-bindings/telegram/attempt"};
  }

  rpc DeleteTelegramBinding(DeleteTelegramBindingRequest) returns (DeleteTelegramBindingResponse) {
    option (google.api.http) = {delete: "/api/v1/notification-bindings/telegram"};
  }

  rpc GetNotificationRuntimeStatus(GetNotificationRuntimeStatusRequest) returns (NotificationRuntimeStatus) {
    option (google.api.http) = {get: "/api/v1/admin/notification-runtime/status"};
  }

  rpc ListSystemNotificationDeliveries(ListSystemNotificationDeliveriesRequest) returns (ListSystemNotificationDeliveriesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/system-notification-deliveries"};
  }

  rpc GetSystemNotificationDelivery(GetSystemNotificationDeliveryRequest) returns (GetSystemNotificationDeliveryResponse) {
    option (google.api.http) = {get: "/api/v1/admin/system-notification-deliveries/{id}"};
  }

  rpc SendSystemNotificationTest(SendSystemNotificationTestRequest) returns (SendSystemNotificationTestResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/system-notification-tests"
      body: "*"
    };
  }
}
