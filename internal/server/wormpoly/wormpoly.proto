syntax = "proto3";

// Worm Poly Service
//
// Worm Poly Service API returns worm-poly runtime and FIFA dashboard data.
package wormpoly;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/wormpoly";

// GetWormPolyStatusRequest queries the worm-poly service runtime status.
message GetWormPolyStatusRequest {}

// GetWormPolyStatusResponse returns the worm-poly service runtime status.
message GetWormPolyStatusResponse {
  bool started = 1;
  string status = 2;
}

message GetWormPolyFIFADashboardRequest {}

message GetWormPolyFIFADashboardResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WormPolyFIFADashboard dashboard = 1;
}

message UpdateWormPolyFIFAEventConfigRequest {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WormPolyFIFAEventConfig config = 1;
}

message UpdateWormPolyFIFAEventConfigResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WormPolyFIFAEventConfig config = 1;
}

service WormPolyService {
  // GetWormPolyStatus returns the worm-poly service runtime status.
  rpc GetWormPolyStatus(GetWormPolyStatusRequest) returns (GetWormPolyStatusResponse) {
    option (google.api.http) = {get: "/api/v1/worm-poly/status"};
  }

  rpc GetWormPolyFIFADashboard(GetWormPolyFIFADashboardRequest) returns (GetWormPolyFIFADashboardResponse) {
    option (google.api.http) = {get: "/api/v1/worm-poly/fifa/dashboard"};
  }

  rpc UpdateWormPolyFIFAEventConfig(UpdateWormPolyFIFAEventConfigRequest) returns (UpdateWormPolyFIFAEventConfigResponse) {
    option (google.api.http) = {
      put: "/api/v1/worm-poly/fifa/event-config"
      body: "config"
    };
  }
}
