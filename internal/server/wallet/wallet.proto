syntax = "proto3";

// Wallet Service
//
// Wallet Service API manages account-owned EVM and Solana wallets.
package wallet;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/wallet";

message GetWalletStatusRequest {}

message ListWalletsRequest {
  string wallet_type = 1 [(gogoproto.jsontag) = "walletType,omitempty"];
  string query = 2;
  int32 page = 3;
  int32 page_size = 4 [(gogoproto.jsontag) = "pageSize,omitempty"];
}

message ListWalletsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4 [(gogoproto.jsontag) = "pageSize,omitempty"];
}

message GetWalletRequest {
  int64 id = 1;
}

message GetWalletResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

message BatchCreateWalletsRequest {
  string wallet_type = 1 [(gogoproto.jsontag) = "walletType,omitempty"];
  // Number of wallets to create. The accepted range is 1 through 10.
  int32 count = 2;
  // A custom remark is accepted only when count is 1.
  string remark = 3;
  string avatar_preset_id = 4 [(gogoproto.jsontag) = "avatarPresetId,omitempty"];
}

message BatchCreateWalletResult {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
  string private_key = 2 [(gogoproto.jsontag) = "privateKey,omitempty"];
}

message BatchCreateWalletsResponse {
  repeated BatchCreateWalletResult results = 1;
}

message BatchImportWalletsRequest {
  string wallet_type = 1 [(gogoproto.jsontag) = "walletType,omitempty"];
  // Private keys are imported atomically in request order. The accepted size is 1 through 10.
  repeated string private_keys = 2 [(gogoproto.jsontag) = "privateKeys,omitempty"];
  // A custom remark is accepted only when exactly one private key is supplied.
  string remark = 3;
  string avatar_preset_id = 4 [(gogoproto.jsontag) = "avatarPresetId,omitempty"];
}

message BatchImportWalletsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem items = 1;
}

message UpdateWalletRemarkRequest {
  int64 id = 1;
  string remark = 2;
  uint64 expected_revision = 3 [(gogoproto.jsontag) = "expectedRevision,omitempty"];
}

message UpdateWalletRemarkResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

message UpdateWalletAvatarPresetRequest {
  int64 id = 1;
  string avatar_preset_id = 2 [(gogoproto.jsontag) = "avatarPresetId,omitempty"];
  uint64 expected_revision = 3 [(gogoproto.jsontag) = "expectedRevision,omitempty"];
}

message UpdateWalletAvatarPresetResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

service WalletService {
  rpc GetWalletStatus(GetWalletStatusRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletStatus) {
    option (google.api.http) = {get: "/api/v1/wallet/status"};
  }

  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse) {
    option (google.api.http) = {get: "/api/v1/wallets"};
  }

  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option (google.api.http) = {get: "/api/v1/wallets/{id}"};
  }

  rpc BatchCreateWallets(BatchCreateWalletsRequest) returns (BatchCreateWalletsResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallets:batchCreate"
      body: "*"
    };
  }

  rpc BatchImportWallets(BatchImportWalletsRequest) returns (BatchImportWalletsResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallets:batchImport"
      body: "*"
    };
  }

  rpc UpdateWalletRemark(UpdateWalletRemarkRequest) returns (UpdateWalletRemarkResponse) {
    option (google.api.http) = {
      patch: "/api/v1/wallets/{id}/remark"
      body: "*"
    };
  }

  rpc UpdateWalletAvatarPreset(UpdateWalletAvatarPresetRequest) returns (UpdateWalletAvatarPresetResponse) {
    option (google.api.http) = {
      patch: "/api/v1/wallets/{id}/avatar-preset"
      body: "*"
    };
  }
}
