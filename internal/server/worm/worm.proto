syntax = "proto3";

// Worm Service
//
// Worm Service API returns worm-level workload status.
package worm;

import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/worm";

// GetWormStatusRequest queries the worm service runtime status.
message GetWormStatusRequest {}

// GetWormStatusResponse returns the worm service runtime status.
message GetWormStatusResponse {
  bool started = 1;
  string status = 2;
}

// ListWormMarketsRequest queries the public Worm markets view.
message ListWormMarketsRequest {
  int32 limit = 1;
  string cursor = 2;
}

// WormMarketItem is the UI-facing subset of a Worm market row.
message WormMarketItem {
  string condition_id = 1;
  string title = 2;
  string description = 3;
  string logo = 4;
  string last_trade_price = 5;
  string state = 6;
  string category = 7;
  int64 created = 8;
  string event_title = 9;
  string event_condition_id = 10;
  string event_logo = 11;
  bool margin_enabled = 12;
}

// ListWormMarketsResponse returns Worm market rows and cursor pagination.
message ListWormMarketsResponse {
  repeated WormMarketItem items = 1;
  string next_cursor = 2;
}

service WormService {
  // GetWormStatus returns the worm service runtime status.
  rpc GetWormStatus(GetWormStatusRequest) returns (GetWormStatusResponse) {
    option (google.api.http) = {get: "/api/v1/worm/status"};
  }

  // ListWormMarkets returns sports markets sorted by leverage.
  rpc ListWormMarkets(ListWormMarketsRequest) returns (ListWormMarketsResponse) {
    option (google.api.http) = {get: "/api/v1/worm/markets"};
  }
}
