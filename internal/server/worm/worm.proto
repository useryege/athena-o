syntax = "proto3";

// Worm Service
//
// Worm Service API returns worm-level workload status.
package worm;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/worm";

// GetWormStatusRequest queries the worm service runtime status.
message GetWormStatusRequest {}

// GetWormStatusResponse returns the worm service runtime status.
message GetWormStatusResponse {
  bool started = 1;
  string status = 2;
}

// ListWormMarketsRequest queries the public Worm markets view.
message ListWormMarketsRequest {
  int32 limit = 1;
  string cursor = 2;
  string sort_option = 3;
  string category_slug = 4;
}

// ListWormMarketsResponse returns Worm market rows and cursor pagination.
message ListWormMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WormMarketItem items = 1;
  string next_cursor = 2;
  int64 fetched_at = 3;
  bool stale = 4;
}

// GetWormMarketRequest queries one public Worm market detail.
message GetWormMarketRequest {
  string condition_id = 1;
}

// GetWormMarketResponse returns one Worm market detail.
message GetWormMarketResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WormMarketDetail market = 1;
  int64 fetched_at = 2;
  bool stale = 3;
}

service WormService {
  // GetWormStatus returns the worm service runtime status.
  rpc GetWormStatus(GetWormStatusRequest) returns (GetWormStatusResponse) {
    option (google.api.http) = {get: "/api/v1/worm/status"};
  }

  // ListWormMarkets returns markets for the requested browse filters.
  rpc ListWormMarkets(ListWormMarketsRequest) returns (ListWormMarketsResponse) {
    option (google.api.http) = {get: "/api/v1/worm/markets"};
  }

  // GetWormMarket returns one market detail from Worm.
  rpc GetWormMarket(GetWormMarketRequest) returns (GetWormMarketResponse) {
    option (google.api.http) = {get: "/api/v1/worm/markets/{condition_id}"};
  }
}
