syntax = "proto3";

// Session Service
//
// Session Service API performs CRUD actions against session resources
package session;

import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/session";

// SessionCreateRequest is for logging in.
message SessionCreateRequest {
  string username = 1;
  string password = 2;
  string token = 3;
  string captcha_id = 4;
  string captcha_answer = 5;
}

// SessionDeleteRequest is for logging out.
message SessionDeleteRequest {}

// SessionResponse wraps the created token or returns an empty string if deleted.
message SessionResponse {
  string token = 1;
}

// Get the current user's userInfo info
message GetUserInfoRequest {}

// CaptchaRequest requests a fresh login captcha.
message CaptchaRequest {}

// CaptchaResponse returns a one-time login captcha challenge.
message CaptchaResponse {
  string captcha_id = 1;
  string image_data_url = 2;
  int32 expires_in = 3;
}

message ResourcePermission {
  string resource = 1;
  string action = 2;
  string subresource = 3;
}

// The current user's userInfo info
message GetUserInfoResponse {
  bool loggedIn = 1;
  string username = 2;
  string iss = 3;
  repeated string groups = 4;
  repeated ResourcePermission permissions = 5;
}

// SessionService
service SessionService {
  // Get the current user's info
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {
    option (google.api.http).get = "/api/v1/session/userinfo";
  }

  // GetCaptcha returns a fresh login captcha for web login.
  rpc GetCaptcha(CaptchaRequest) returns (CaptchaResponse) {
    option (google.api.http).get = "/api/v1/session/captcha";
  }

  // Create a new JWT for authentication and set a cookie if using HTTP
  rpc Create(SessionCreateRequest) returns (SessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/session"
      body: "*"
    };
  }

  // Delete an existing JWT cookie if using HTTP
  rpc Delete(SessionDeleteRequest) returns (SessionResponse) {
    option (google.api.http) = {delete: "/api/v1/session"};
  }
}
