syntax = "proto3";

// Session Service
//
// Session Service API projects the current Athena identity.
package session;

import "internal/server/account/account.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/session";

// Get the current user's userInfo info
message GetUserInfoRequest {}

// The current user's userInfo info
message GetUserInfoResponse {
  bool loggedIn = 1;
  string username = 2;
  string iss = 3;
  bool administrator = 4;
  reserved 5, 6;
  reserved "dataAccess", "authorizationRevision";
  account.AccountAccess access = 7;
  account.AccountProfile profile = 8;
  account.AccountPreferences preferences = 9;
  account.AccountIdentity identity = 10;
  string accountId = 11;
}

// SessionService
service SessionService {
  // Get the current user's info
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {
    option (google.api.http).get = "/api/v1/session/userinfo";
  }
}
