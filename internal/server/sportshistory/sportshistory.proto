syntax = "proto3";

// Sports History Service API exposes completed sports events, price histories, and synchronization control.
package sportshistory;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/sportshistory";

// GetSportsHistoryStatusRequest queries the Sports History service runtime status.
message GetSportsHistoryStatusRequest {}

// GetSportsHistoryStatusResponse returns the Sports History service runtime status.
message GetSportsHistoryStatusResponse {
  bool started = 1;
  string status = 2;
}

// ListSportsHistoryEventsRequest queries completed sports event cards.
message ListSportsHistoryEventsRequest {
  int32 limit = 1;
}

// ListSportsHistoryEventsResponse returns completed sports event cards.
message ListSportsHistoryEventsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.SportsHistoryEventCardItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
}

// BatchGetSportsHistoryPriceHistoriesRequest queries price history for selected historical markets.
message BatchGetSportsHistoryPriceHistoriesRequest {
  repeated string market_keys = 1;
  int32 limit_per_token = 2;
}

// BatchGetSportsHistoryPriceHistoriesResponse returns grouped historical-market price histories.
message BatchGetSportsHistoryPriceHistoriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.SportsHistoryPriceHistorySeriesItem items = 1;
}

// GetSportsHistorySyncStatusRequest queries the current historical synchronization state.
message GetSportsHistorySyncStatusRequest {}

// GetSportsHistorySyncStatusResponse returns the current historical synchronization state.
message GetSportsHistorySyncStatusResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SportsHistorySyncStatus status = 1;
}

// RefreshSportsHistoryRequest starts a manual historical synchronization pass.
message RefreshSportsHistoryRequest {}

// RefreshSportsHistoryResponse returns the synchronization state after accepting the refresh.
message RefreshSportsHistoryResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SportsHistorySyncStatus status = 1;
}

service SportsHistoryService {
  // GetSportsHistoryStatus returns the Sports History service runtime status.
  rpc GetSportsHistoryStatus(GetSportsHistoryStatusRequest) returns (GetSportsHistoryStatusResponse) {
    option (google.api.http) = {get: "/api/v1/sports-history/status"};
  }

  // ListSportsHistoryEvents returns completed sports event cards.
  rpc ListSportsHistoryEvents(ListSportsHistoryEventsRequest) returns (ListSportsHistoryEventsResponse) {
    option (google.api.http) = {get: "/api/v1/sports-history/events"};
  }

  // BatchGetSportsHistoryPriceHistories returns grouped historical-market price histories.
  rpc BatchGetSportsHistoryPriceHistories(BatchGetSportsHistoryPriceHistoriesRequest) returns (BatchGetSportsHistoryPriceHistoriesResponse) {
    option (google.api.http) = {
      post: "/api/v1/sports-history/price-history:batchGet"
      body: "*"
    };
  }

  // GetSportsHistorySyncStatus returns the current historical synchronization state.
  rpc GetSportsHistorySyncStatus(GetSportsHistorySyncStatusRequest) returns (GetSportsHistorySyncStatusResponse) {
    option (google.api.http) = {get: "/api/v1/sports-history/sync-status"};
  }

  // RefreshSportsHistory starts a manual historical synchronization pass.
  rpc RefreshSportsHistory(RefreshSportsHistoryRequest) returns (RefreshSportsHistoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/sports-history:refresh"
      body: "*"
    };
  }
}
