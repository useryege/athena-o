syntax = "proto3";
package operationlog;
option go_package = "github.com/useryege/athena/pkg/apiclient/operationlog";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";

message NullableString { string value = 1 [(gogoproto.jsontag) = "value"]; }
message NullableBool { bool value = 1 [(gogoproto.jsontag) = "value"]; }
message OperationLogResource { string type = 1 [(gogoproto.jsontag) = "type,omitempty"]; string id = 2 [(gogoproto.jsontag) = "id,omitempty"]; string relation = 3 [(gogoproto.jsontag) = "relation,omitempty"]; NullableBool reference_verified = 4 [(gogoproto.jsontag) = "referenceVerified,omitempty"]; }
message OperationLogChange { string field_code = 1 [(gogoproto.jsontag) = "fieldCode,omitempty"]; NullableString before_value = 2 [(gogoproto.jsontag) = "beforeValue,omitempty"]; NullableString after_value = 3 [(gogoproto.jsontag) = "afterValue,omitempty"]; NullableBool before_available = 4 [(gogoproto.jsontag) = "beforeAvailable,omitempty"]; string value_kind = 5 [(gogoproto.jsontag) = "valueKind,omitempty"]; }
message OperationLogCounts { NullableString requested = 1 [(gogoproto.jsontag) = "requested,omitempty"]; NullableString confirmed = 2 [(gogoproto.jsontag) = "confirmed,omitempty"]; NullableString failed = 3 [(gogoproto.jsontag) = "failed,omitempty"]; NullableString unknown = 4 [(gogoproto.jsontag) = "unknown,omitempty"]; }
message OperationLogProtocolResult { NullableString grpc_code = 1 [(gogoproto.jsontag) = "grpcCode,omitempty"]; NullableString http_status = 2 [(gogoproto.jsontag) = "httpStatus,omitempty"]; NullableString reason_code = 3 [(gogoproto.jsontag) = "reasonCode,omitempty"]; NullableBool response_write_failed = 4 [(gogoproto.jsontag) = "responseWriteFailed,omitempty"]; }
message OperationLogSourceFacts { NullableString producer_id = 1 [(gogoproto.jsontag) = "producerId,omitempty"]; NullableString first_received_at = 2 [(gogoproto.jsontag) = "firstReceivedAt,omitempty"]; NullableString last_received_at = 3 [(gogoproto.jsontag) = "lastReceivedAt,omitempty"]; repeated string phases_received = 4 [(gogoproto.jsontag) = "phasesReceived,omitempty"]; NullableString snapshot_sequence = 5 [(gogoproto.jsontag) = "snapshotSequence,omitempty"]; }
message OperationLogProducerStatus { NullableString producer_id = 1 [(gogoproto.jsontag) = "producerId,omitempty"]; NullableString started_at = 2 [(gogoproto.jsontag) = "startedAt,omitempty"]; NullableString last_seen_at = 3 [(gogoproto.jsontag) = "lastSeenAt,omitempty"]; NullableString stopped_at = 4 [(gogoproto.jsontag) = "stoppedAt,omitempty"]; NullableString attempted_events = 5 [(gogoproto.jsontag) = "attemptedEvents,omitempty"]; NullableString confirmed_events = 6 [(gogoproto.jsontag) = "confirmedEvents,omitempty"]; NullableString unconfirmed_events = 7 [(gogoproto.jsontag) = "unconfirmedEvents,omitempty"]; NullableString invalid_events = 8 [(gogoproto.jsontag) = "invalidEvents,omitempty"]; NullableString capacity_rejected_events = 9 [(gogoproto.jsontag) = "capacityRejectedEvents,omitempty"]; NullableString last_failure_at = 10 [(gogoproto.jsontag) = "lastFailureAt,omitempty"]; NullableString last_failure_code = 11 [(gogoproto.jsontag) = "lastFailureCode,omitempty"]; NullableString last_recovered_at = 12 [(gogoproto.jsontag) = "lastRecoveredAt,omitempty"]; NullableBool persistence_reachable = 13 [(gogoproto.jsontag) = "persistenceReachable,omitempty"]; }
message ListOperationLogsRequest {
 string from = 1 [(gogoproto.jsontag) = "from,omitempty"]; string to = 2 [(gogoproto.jsontag) = "to,omitempty"]; string actor_query = 3 [(gogoproto.jsontag) = "actorQuery,omitempty"]; string actor_role = 4 [(gogoproto.jsontag) = "actorRole,omitempty"]; string credential_kind = 5 [(gogoproto.jsontag) = "credentialKind,omitempty"]; string module_code = 6 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string action_code = 7 [(gogoproto.jsontag) = "actionCode,omitempty"]; string outcome = 8 [(gogoproto.jsontag) = "outcome,omitempty"]; string target_account_id = 9 [(gogoproto.jsontag) = "targetAccountId,omitempty"]; string resource_type = 10 [(gogoproto.jsontag) = "resourceType,omitempty"]; string resource_id = 11 [(gogoproto.jsontag) = "resourceId,omitempty"]; int32 page_size = 12 [(gogoproto.jsontag) = "pageSize,omitempty"]; string cursor = 13 [(gogoproto.jsontag) = "cursor,omitempty"]; }
message GetOperationLogRequest { string operation_id = 1 [(gogoproto.jsontag) = "operationId,omitempty"]; string snapshot_token = 2 [(gogoproto.jsontag) = "snapshotToken,omitempty"]; }
message OperationLogSummary {
 string operation_id = 1 [(gogoproto.jsontag) = "operationId,omitempty"]; NullableString started_at = 2 [(gogoproto.jsontag) = "startedAt,omitempty"]; NullableString actor_account_id = 3 [(gogoproto.jsontag) = "actorAccountId,omitempty"]; NullableString actor_username = 4 [(gogoproto.jsontag) = "actorUsername,omitempty"]; string actor_role = 5 [(gogoproto.jsontag) = "actorRole,omitempty"]; string realm = 6 [(gogoproto.jsontag) = "realm,omitempty"]; string credential_kind = 7 [(gogoproto.jsontag) = "credentialKind,omitempty"]; NullableBool identity_verified = 8 [(gogoproto.jsontag) = "identityVerified,omitempty"]; NullableBool identity_snapshot_complete = 9 [(gogoproto.jsontag) = "identitySnapshotComplete,omitempty"]; string module_code = 10 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string action_code = 11 [(gogoproto.jsontag) = "actionCode,omitempty"]; NullableString primary_resource_type = 12 [(gogoproto.jsontag) = "primaryResourceType,omitempty"]; NullableString primary_resource_id = 13 [(gogoproto.jsontag) = "primaryResourceId,omitempty"]; string outcome = 14 [(gogoproto.jsontag) = "outcome,omitempty"]; string observation = 15 [(gogoproto.jsontag) = "observation,omitempty"]; NullableString reason_code = 16 [(gogoproto.jsontag) = "reasonCode,omitempty"]; NullableString duration_ms = 17 [(gogoproto.jsontag) = "durationMs,omitempty"]; NullableString business_state = 18 [(gogoproto.jsontag) = "businessState,omitempty"]; NullableString resource_count = 19 [(gogoproto.jsontag) = "resourceCount,omitempty"]; NullableBool resources_complete = 20 [(gogoproto.jsontag) = "resourcesComplete,omitempty"]; NullableBool response_write_failed = 21 [(gogoproto.jsontag) = "responseWriteFailed,omitempty"]; NullableString provider = 22 [(gogoproto.jsontag) = "provider,omitempty"]; NullableString target_account_id = 23 [(gogoproto.jsontag) = "targetAccountId,omitempty"]; }
message Page { string next_cursor = 1 [(gogoproto.jsontag) = "nextCursor,omitempty"]; string snapshot_token = 2 [(gogoproto.jsontag) = "snapshotToken,omitempty"]; string snapshot_sequence = 3 [(gogoproto.jsontag) = "snapshotSequence,omitempty"]; string snapshot_at = 4 [(gogoproto.jsontag) = "snapshotAt,omitempty"]; int32 page_size = 5 [(gogoproto.jsontag) = "pageSize,omitempty"]; }
message AppliedFilters { string from = 1 [(gogoproto.jsontag) = "from,omitempty"]; string to = 2 [(gogoproto.jsontag) = "to,omitempty"]; string actor_query = 3 [(gogoproto.jsontag) = "actorQuery,omitempty"]; string actor_role = 4 [(gogoproto.jsontag) = "actorRole,omitempty"]; string credential_kind = 5 [(gogoproto.jsontag) = "credentialKind,omitempty"]; string module_code = 6 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string action_code = 7 [(gogoproto.jsontag) = "actionCode,omitempty"]; string outcome = 8 [(gogoproto.jsontag) = "outcome,omitempty"]; string target_account_id = 9 [(gogoproto.jsontag) = "targetAccountId,omitempty"]; string resource_type = 10 [(gogoproto.jsontag) = "resourceType,omitempty"]; string resource_id = 11 [(gogoproto.jsontag) = "resourceId,omitempty"]; }
message ListOperationLogsResponse { repeated OperationLogSummary items = 1 [(gogoproto.jsontag) = "items,omitempty"]; Page page = 2 [(gogoproto.jsontag) = "page,omitempty"]; AppliedFilters applied_filters = 3 [(gogoproto.jsontag) = "appliedFilters,omitempty"]; }
message OperationLogDetail { OperationLogSummary summary = 1 [(gogoproto.jsontag) = "summary,omitempty"]; NullableString finished_at = 2 [(gogoproto.jsontag) = "finishedAt,omitempty"]; NullableString request_id = 3 [(gogoproto.jsontag) = "requestId,omitempty"]; NullableString parent_operation_id = 4 [(gogoproto.jsontag) = "parentOperationId,omitempty"]; NullableString business_request_id = 5 [(gogoproto.jsontag) = "businessRequestId,omitempty"]; NullableString provider = 6 [(gogoproto.jsontag) = "provider,omitempty"]; repeated string effect = 7 [(gogoproto.jsontag) = "effect,omitempty"]; reserved 8 to 12; repeated OperationLogResource resource_facts = 13 [(gogoproto.jsontag) = "resources,omitempty"]; repeated OperationLogChange change_facts = 14 [(gogoproto.jsontag) = "changes,omitempty"]; OperationLogCounts count_facts = 15 [(gogoproto.jsontag) = "counts,omitempty"]; OperationLogProtocolResult protocol = 16 [(gogoproto.jsontag) = "protocolResult,omitempty"]; OperationLogSourceFacts source = 17 [(gogoproto.jsontag) = "sourceFacts,omitempty"]; }
message GetOperationLogResponse { OperationLogDetail item = 1 [(gogoproto.jsontag) = "item,omitempty"]; }
message RuntimeStatus { string service_epoch = 1 [(gogoproto.jsontag) = "serviceEpoch,omitempty"]; NullableString checked_at = 2 [(gogoproto.jsontag) = "checkedAt,omitempty"]; NullableBool query_ready = 3 [(gogoproto.jsontag) = "queryReady,omitempty"]; string projection_state = 4 [(gogoproto.jsontag) = "projectionState,omitempty"]; NullableString last_published_at = 5 [(gogoproto.jsontag) = "lastPublishedAt,omitempty"]; string publication_sequence = 6 [(gogoproto.jsontag) = "publicationSequence,omitempty"]; NullableString pending_events = 7 [(gogoproto.jsontag) = "pendingEvents,omitempty"]; NullableString oldest_pending_received_at = 8 [(gogoproto.jsontag) = "oldestPendingReceivedAt,omitempty"]; string quarantined_events = 9 [(gogoproto.jsontag) = "quarantinedEvents,omitempty"]; string last_processing_error_code = 10 [(gogoproto.jsontag) = "lastProcessingErrorCode,omitempty"]; repeated OperationLogProducerStatus observed_producers = 11 [(gogoproto.jsontag) = "observedProducers,omitempty"]; NullableString total_observed = 12 [(gogoproto.jsontag) = "totalObserved,omitempty"]; NullableBool producers_complete = 13 [(gogoproto.jsontag) = "producersComplete,omitempty"]; }
message GetOperationLogRuntimeStatusRequest {}
message GetOperationLogRuntimeStatusResponse { RuntimeStatus status = 1 [(gogoproto.jsontag) = "status,omitempty"]; }
message GetOperationLogCaptureStatusRequest {}
message CaptureStatus { string instance_id = 1 [(gogoproto.jsontag) = "instanceId,omitempty"]; NullableString started_at = 2 [(gogoproto.jsontag) = "startedAt,omitempty"]; NullableString observed_at = 3 [(gogoproto.jsontag) = "observedAt,omitempty"]; NullableString attempted_events = 4 [(gogoproto.jsontag) = "attemptedEvents,omitempty"]; NullableString confirmed_events = 5 [(gogoproto.jsontag) = "confirmedEvents,omitempty"]; NullableString unconfirmed_events = 6 [(gogoproto.jsontag) = "unconfirmedEvents,omitempty"]; NullableString invalid_events = 7 [(gogoproto.jsontag) = "invalidEvents,omitempty"]; NullableString capacity_rejected_events = 8 [(gogoproto.jsontag) = "capacityRejectedEvents,omitempty"]; NullableString in_flight_events = 9 [(gogoproto.jsontag) = "inFlightEvents,omitempty"]; NullableString last_failure_code = 10 [(gogoproto.jsontag) = "lastFailureCode,omitempty"]; NullableBool persistence_reachable = 11 [(gogoproto.jsontag) = "persistenceReachable,omitempty"]; NullableString last_confirmed_at = 12 [(gogoproto.jsontag) = "lastConfirmedAt,omitempty"]; }
message GetOperationLogCaptureStatusResponse { CaptureStatus status = 1 [(gogoproto.jsontag) = "status,omitempty"]; }
message ListOperationLogActionsRequest {}
message OperationLogAction { string code = 1 [(gogoproto.jsontag) = "code,omitempty"]; string module_code = 2 [(gogoproto.jsontag) = "moduleCode,omitempty"]; string label = 3 [(gogoproto.jsontag) = "label,omitempty"]; string resource_type = 4 [(gogoproto.jsontag) = "resourceType,omitempty"]; }
message ListOperationLogActionsResponse { string catalog_version = 1 [(gogoproto.jsontag) = "catalogVersion,omitempty"]; repeated OperationLogAction actions = 2 [(gogoproto.jsontag) = "actions,omitempty"]; }
service OperationLogService {
 rpc ListOperationLogs(ListOperationLogsRequest) returns (ListOperationLogsResponse) { option (google.api.http) = { get: "/api/v1/admin/operation-logs" }; }
 rpc GetOperationLog(GetOperationLogRequest) returns (GetOperationLogResponse) { option (google.api.http) = { get: "/api/v1/admin/operation-logs/{operation_id}" }; }
 rpc GetOperationLogRuntimeStatus(GetOperationLogRuntimeStatusRequest) returns (GetOperationLogRuntimeStatusResponse) { option (google.api.http) = { get: "/api/v1/admin/operation-log-runtime" }; }
 rpc GetOperationLogCaptureStatus(GetOperationLogCaptureStatusRequest) returns (GetOperationLogCaptureStatusResponse) { option (google.api.http) = { get: "/api/v1/admin/operation-log-capture-status" }; }
 rpc ListOperationLogActions(ListOperationLogActionsRequest) returns (ListOperationLogActionsResponse) { option (google.api.http) = { get: "/api/v1/admin/operation-log-actions" }; }
}
