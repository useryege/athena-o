syntax = "proto3";

// Account Service
//
// Account Service API updates Athena account settings

package account;

import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/account";

message ChangePasswordRequest {
  string currentPassword = 1;
  string newPassword = 2;
}

message ChangePasswordResponse {}

message GetAccountRequest {
  string name = 1;
}

enum AccountDataAccess {
  ACCOUNT_DATA_ACCESS_NONE = 0;
  ACCOUNT_DATA_ACCESS_READ = 1;
  ACCOUNT_DATA_ACCESS_READ_WRITE = 2;
}

enum AccountDataModule {
  ACCOUNT_DATA_MODULE_UNSPECIFIED = 0;
  ACCOUNT_DATA_MODULE_MARKET_RADAR = 1;
  ACCOUNT_DATA_MODULE_SPORTS_LIVE = 2;
  ACCOUNT_DATA_MODULE_SPORTS_HISTORY = 3;
  ACCOUNT_DATA_MODULE_MANAGED_OO = 4;
  ACCOUNT_DATA_MODULE_WORM_MARKETS = 5;
  ACCOUNT_DATA_MODULE_FIFA_MARKET_DASHBOARD = 6;
  ACCOUNT_DATA_MODULE_WORLD_CUP_CORNERS = 7;
  ACCOUNT_DATA_MODULE_TOKEN = 8;
  ACCOUNT_DATA_MODULE_WALLET = 9;
  ACCOUNT_DATA_MODULE_NOTIFICATIONS = 10;
}

message AccountModuleAccess {
  AccountDataModule module = 1;
  AccountDataAccess dataAccess = 2;
}

message AccountAccess {
  bool loginEnabled = 1;
  reserved 2;
  reserved "dataAccess";
  uint64 revision = 3;
  repeated AccountModuleAccess moduleAccess = 4;
}

enum AccountTier {
  ACCOUNT_TIER_UNSPECIFIED = 0;
  ACCOUNT_TIER_STANDARD = 1;
  ACCOUNT_TIER_PRO = 2;
}

enum AccountThemeMode {
  ACCOUNT_THEME_MODE_UNSPECIFIED = 0;
  ACCOUNT_THEME_MODE_SYSTEM = 1;
  ACCOUNT_THEME_MODE_LIGHT = 2;
  ACCOUNT_THEME_MODE_DARK = 3;
}

message AccountProfile {
  string displayName = 1;
  AccountTier tier = 2;
  string avatarUrl = 3;
  uint64 revision = 4;
}

message AccountPreferences {
  AccountThemeMode theme = 1;
  uint64 revision = 2;
}

message UpdateAccountAccessRequest {
  string name = 1;
  // access contains the complete supported account data module matrix.
  AccountAccess access = 2;
}

message Account {
  string name = 1;
  bool administrator = 2;
  AccountAccess access = 3;
  repeated string capabilities = 4;
  AccountProfile profile = 5;
}

message AccountsList {
  repeated Account items = 1;
}

message Token {
  string id = 1;
  int64 issuedAt = 2;
  int64 expiresAt = 3;
}

message TokensList {
  repeated Token items = 1;
}

message CreateTokenRequest {
  // expiresIn represents a duration in seconds
  int64 expiresIn = 1;
  string id = 2;
}

message CreateTokenResponse {
  string token = 1;
}

message DeleteTokenRequest {
  string id = 1;
}

message ListAccountsRequest {}

message ListTokensRequest {}

message UpdateAccountProfileRequest {
  string name = 1;
  string displayName = 2;
  uint64 expectedRevision = 3;
}

message UpdateAccountTierRequest {
  string name = 1;
  AccountTier tier = 2;
  uint64 expectedRevision = 3;
}

message UpdateAccountPreferencesRequest {
  AccountThemeMode theme = 1;
  uint64 expectedRevision = 2;
}

message EmptyResponse {}

service AccountService {
  // ChangePassword changes the current account's password.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      put: "/api/v1/account/password"
      body: "*"
    };
  }

  // ListAccounts returns the list of accounts
  rpc ListAccounts(ListAccountsRequest) returns (AccountsList) {
    option (google.api.http).get = "/api/v1/account";
  }

  // GetAccount returns an account
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http).get = "/api/v1/account/{name}";
  }

  // UpdateAccountAccess replaces a non-administrator account's access state.
  rpc UpdateAccountAccess(UpdateAccountAccessRequest) returns (Account) {
    option (google.api.http) = {
      put: "/api/v1/account/{name}/access"
      body: "access"
    };
  }

  // UpdateAccountProfile changes an account's public display name.
  rpc UpdateAccountProfile(UpdateAccountProfileRequest) returns (AccountProfile) {
    option (google.api.http) = {
      put: "/api/v1/account/{name}/profile"
      body: "*"
    };
  }

  // UpdateAccountTier changes display-only packaging metadata.
  rpc UpdateAccountTier(UpdateAccountTierRequest) returns (AccountProfile) {
    option (google.api.http) = {
      put: "/api/v1/account/{name}/tier"
      body: "*"
    };
  }

  // UpdateAccountPreferences changes the current account's UI preferences.
  rpc UpdateAccountPreferences(UpdateAccountPreferencesRequest) returns (AccountPreferences) {
    option (google.api.http) = {
      put: "/api/v1/account/preferences"
      body: "*"
    };
  }

  // ListTokens lists API Key metadata for the current account.
  rpc ListTokens(ListTokensRequest) returns (TokensList) {
    option (google.api.http).get = "/api/v1/account/security/tokens";
  }

  // CreateToken creates a token
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/account/security/tokens"
      body: "*"
    };
  }

  // DeleteToken deletes a token
  rpc DeleteToken(DeleteTokenRequest) returns (EmptyResponse) {
    option (google.api.http).delete = "/api/v1/account/security/tokens/{id}";
  }
}
