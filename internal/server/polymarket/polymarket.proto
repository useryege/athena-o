syntax = "proto3";

// Polymarket Service
//
// Polymarket Service API returns polymarket-level workload status.
package polymarket;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/polymarket";

// GetPolymarketStatusRequest queries the polymarket service runtime status.
message GetPolymarketStatusRequest {}

// ListPolymarketHotMarketsRequest queries discovered hot markets.
message ListPolymarketHotMarketsRequest {
  int32 limit = 1;
}

// ListPolymarketHotMarketsResponse returns discovered hot markets.
message ListPolymarketHotMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketHotMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  int32 monitored_markets = 4;
  int32 monitored_tokens = 5;
  int32 candidate_count = 6;
}

// ListPolymarketRealtimeMarketsRequest queries realtime market rows.
message ListPolymarketRealtimeMarketsRequest {
  int32 limit = 1;
}

// ListPolymarketRealtimeMarketsResponse returns realtime market rows.
message ListPolymarketRealtimeMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketRealtimeMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  int32 subscribed_markets = 4;
  int32 subscribed_tokens = 5;
  bool connected = 6;
  int64 last_event_at = 7;
  int32 candidate_count = 8;
}

// ListPolymarketMoversRequest queries price mover market rows.
message ListPolymarketMoversRequest {
  int32 limit = 1;
}

// ListPolymarketMoversResponse returns price mover market rows.
message ListPolymarketMoversResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketMoverMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  bool connected = 4;
  int64 last_event_at = 5;
  int32 monitored_markets = 6;
  int32 monitored_tokens = 7;
  int32 candidate_count = 8;
}

// ListPolymarketSportsLiveEventsRequest queries the sports live event card list.
message ListPolymarketSportsLiveEventsRequest {
  int32 limit = 1;
}

// ListPolymarketSportsLiveEventsResponse returns sports live event cards.
message ListPolymarketSportsLiveEventsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketSportsLiveEventCardItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
}

// BatchGetPolymarketSportsLivePriceHistoryRequest queries price history for sports live moneyline markets.
message BatchGetPolymarketSportsLivePriceHistoryRequest {
  repeated string market_keys = 1;
  int32 limit_per_token = 2;
}

// BatchGetPolymarketSportsLivePriceHistoryResponse returns grouped price history series.
message BatchGetPolymarketSportsLivePriceHistoryResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketSportsLivePriceHistorySeriesItem items = 1;
}

message ListPolymarketSportsHistoryEventsRequest {
  int32 limit = 1;
}

message ListPolymarketSportsHistoryEventsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketSportsHistoryEventCardItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
}

message BatchGetPolymarketSportsHistoryPriceHistoryRequest {
  repeated string market_keys = 1;
  int32 limit_per_token = 2;
}

message BatchGetPolymarketSportsHistoryPriceHistoryResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketSportsLivePriceHistorySeriesItem items = 1;
}

service PolymarketService {
  // GetPolymarketStatus returns the polymarket service runtime status.
  rpc GetPolymarketStatus(GetPolymarketStatusRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.PolymarketStatus) {
    option (google.api.http) = {get: "/api/v1/polymarket/status"};
  }

  // ListPolymarketHotMarkets returns discovered hot markets.
  rpc ListPolymarketHotMarkets(ListPolymarketHotMarketsRequest) returns (ListPolymarketHotMarketsResponse) {
    option (google.api.http) = {get: "/api/v1/polymarket/hot-markets"};
  }

  // ListPolymarketRealtimeMarkets returns realtime market rows.
  rpc ListPolymarketRealtimeMarkets(ListPolymarketRealtimeMarketsRequest) returns (ListPolymarketRealtimeMarketsResponse) {
    option (google.api.http) = {get: "/api/v1/polymarket/realtime-markets"};
  }

  // ListPolymarketMovers returns price mover market rows.
  rpc ListPolymarketMovers(ListPolymarketMoversRequest) returns (ListPolymarketMoversResponse) {
    option (google.api.http) = {get: "/api/v1/polymarket/movers"};
  }

  // ListPolymarketSportsLiveEvents returns sports live event cards.
  rpc ListPolymarketSportsLiveEvents(ListPolymarketSportsLiveEventsRequest) returns (ListPolymarketSportsLiveEventsResponse) {
    option (google.api.http) = {get: "/api/v1/polymarket/sports/live/events"};
  }

  // BatchGetPolymarketSportsLivePriceHistory returns price history for sports live moneyline markets.
  rpc BatchGetPolymarketSportsLivePriceHistory(BatchGetPolymarketSportsLivePriceHistoryRequest) returns (BatchGetPolymarketSportsLivePriceHistoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/polymarket/sports/live/price-history:batchGet"
      body: "*"
    };
  }

  rpc ListPolymarketSportsHistoryEvents(ListPolymarketSportsHistoryEventsRequest) returns (ListPolymarketSportsHistoryEventsResponse) {
    option (google.api.http) = {get: "/api/v1/polymarket/sports/history/events"};
  }

  rpc BatchGetPolymarketSportsHistoryPriceHistory(BatchGetPolymarketSportsHistoryPriceHistoryRequest) returns (BatchGetPolymarketSportsHistoryPriceHistoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/polymarket/sports/history/price-history:batchGet"
      body: "*"
    };
  }
}
