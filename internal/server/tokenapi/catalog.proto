syntax = "proto3";
package tokenapi;
import "internal/server/tokenapi/types.proto";
import "google/api/annotations.proto";
option go_package = "github.com/useryege/athena/pkg/apiclient/tokenapi";
service TokenCatalogService {
  rpc GetContractCode(GetContractCodeRequest) returns (GetContractCodeResponse) { option (google.api.http) = {get: "/api/v1/tokens/contract-codes/{code_hash}"}; }
  rpc ListContractCodes(ListContractCodesRequest) returns (ListContractCodesResponse) { option (google.api.http) = {get: "/api/v1/tokens/contract-codes"}; }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) { option (google.api.http) = {get: "/api/v1/tokens/projects"}; }
  rpc GetProjectDetail(GetProjectDetailRequest) returns (GetProjectDetailResponse) { option (google.api.http) = {get: "/api/v1/tokens/projects/{project_id}"}; }
  rpc GetProjectProfile(GetProjectProfileRequest) returns (GetProjectProfileResponse) { option (google.api.http) = {get: "/api/v1/tokens/projects/{project_id}/profile"}; }
  rpc GetProjectSwapActivity(GetProjectSwapActivityRequest) returns (GetProjectSwapActivityResponse) { option (google.api.http) = {get: "/api/v1/tokens/projects/{project_id}/swap-activity"}; }
  rpc ListProjectSwapEvents(ListProjectSwapEventsRequest) returns (ListProjectSwapEventsResponse) { option (google.api.http) = {get: "/api/v1/tokens/projects/{project_id}/swap-pairs/{pair_kind}/blocks/{block_number}/events"}; }
  rpc ListProjectWalletNormalTransactions(ListProjectWalletNormalTransactionsRequest) returns (ListProjectWalletNormalTransactionsResponse) { option (google.api.http) = {get: "/api/v1/tokens/projects/{project_id}/wallet-normal-transactions"}; }
}
