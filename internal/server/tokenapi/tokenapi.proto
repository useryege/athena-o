syntax = "proto3";
package tokenapi;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";
option go_package = "github.com/useryege/athena/pkg/apiclient/tokenapi";

message GetContractCodeBlocklistEntryRequest { string code_hash = 1; }
message GetContractCodeBlocklistEntryResponse { bool found = 1; github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCodeBlocklistEntry entry = 2; }
message ListContractCodeBlocklistEntriesRequest {}
message ListContractCodeBlocklistEntriesResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCodeBlocklistEntry entries = 1; }
message CreateContractCodeBlocklistEntryRequest { string note = 1; int64 source_chain_id = 2; string source_contract = 3; }
message CreateContractCodeBlocklistEntryResponse {}
message UpdateContractCodeBlocklistEntryRequest { string code_hash = 1; string note = 2; }
message UpdateContractCodeBlocklistEntryResponse { int64 updated_count = 1; }
message DeleteContractCodeBlocklistEntryRequest { string code_hash = 1; }
message DeleteContractCodeBlocklistEntryResponse { int64 deleted_count = 1; }

message GetWalletBlocklistEntryRequest { string wallet = 1; }
message GetWalletBlocklistEntryResponse { bool found = 1; github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIWalletBlocklistEntry entry = 2; }
message ListWalletBlocklistEntriesRequest {}
message ListWalletBlocklistEntriesResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIWalletBlocklistEntry entries = 1; }
message CreateWalletBlocklistEntryRequest { string wallet = 1; string note = 2; }
message CreateWalletBlocklistEntryResponse {}
message UpdateWalletBlocklistEntryRequest { string wallet = 1; string note = 2; }
message UpdateWalletBlocklistEntryResponse { int64 updated_count = 1; }
message DeleteWalletBlocklistEntryRequest { string wallet = 1; }
message DeleteWalletBlocklistEntryResponse { int64 deleted_count = 1; }

message GetOptionsRequest {}
message GetOptionsResponse { github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIOptions options = 1; }
message ListNodeStatusesRequest {}
message ListNodeStatusesResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPINodeStatus node_statuses = 1; }
message GetChainIngestCheckpointRequest { int64 chain_id = 1; }
message GetChainIngestCheckpointResponse { bool found = 1; github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoint = 2; }
message ListChainIngestCheckpointsRequest {}
message ListChainIngestCheckpointsResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoints = 1; }
message UpdateChainIngestCheckpointRequest { int64 chain_id = 1; string status = 2; }
message UpdateChainIngestCheckpointResponse { bool found = 1; github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoint = 2; }
message GetContractCodeRequest { string code_hash = 1; }
message GetContractCodeResponse { bool found = 1; github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCode contract_code = 2; }
message ListContractCodesRequest { string code_hash = 1; int32 page = 2; int32 page_size = 3; string order_by = 4; }
message ListContractCodesResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCode contract_codes = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectsRequest { int64 chain_id = 1; string code_hash = 2; string contract = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectsResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProject projects = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectReportsRequest { int64 chain_id = 1; int64 project_id = 2; string contract = 3; string evaluation_status = 4; int32 page = 5; int32 page_size = 6; }
message ListProjectReportsResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectReport project_reports = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message GetProjectDataCollectionTaskRequest { int64 task_id = 1; }
message GetProjectDataCollectionTaskResponse { bool found = 1; github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectDataCollectionTask task = 2; }
message ListProjectDataCollectionTasksRequest { int64 project_id = 1; string data_type = 2; string status = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectDataCollectionTasksResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectDataCollectionTask tasks = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectResearchStatesRequest { int64 project_id = 1; int64 chain_id = 2; string status = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectResearchStatesResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectResearchState research_states = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectReportRevisionsRequest { int64 project_id = 1; int64 chain_id = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectReportRevisionsResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectReportRevision report_revisions = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectSelectionsRequest { int64 project_id = 1; int64 chain_id = 2; string outcome = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectSelectionsResponse { repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectSelection selections = 1; int64 total = 2; int32 page = 3; int32 page_size = 4; }

service TokenAPIService {
  rpc GetOptions(GetOptionsRequest) returns (GetOptionsResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/options"}; }
  rpc ListNodeStatuses(ListNodeStatusesRequest) returns (ListNodeStatusesResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/node-statuses"}; }
  rpc GetContractCodeBlocklistEntry(GetContractCodeBlocklistEntryRequest) returns (GetContractCodeBlocklistEntryResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/contract-code-blocklist/{code_hash}"}; }
  rpc ListContractCodeBlocklistEntries(ListContractCodeBlocklistEntriesRequest) returns (ListContractCodeBlocklistEntriesResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/contract-code-blocklist"}; }
  rpc CreateContractCodeBlocklistEntry(CreateContractCodeBlocklistEntryRequest) returns (CreateContractCodeBlocklistEntryResponse) { option (google.api.http) = {post: "/api/v1/tokenapi/contract-code-blocklist" body: "*"}; }
  rpc UpdateContractCodeBlocklistEntry(UpdateContractCodeBlocklistEntryRequest) returns (UpdateContractCodeBlocklistEntryResponse) { option (google.api.http) = {post: "/api/v1/tokenapi/contract-code-blocklist/{code_hash}" body: "*"}; }
  rpc DeleteContractCodeBlocklistEntry(DeleteContractCodeBlocklistEntryRequest) returns (DeleteContractCodeBlocklistEntryResponse) { option (google.api.http) = {delete: "/api/v1/tokenapi/contract-code-blocklist/{code_hash}"}; }
  rpc GetWalletBlocklistEntry(GetWalletBlocklistEntryRequest) returns (GetWalletBlocklistEntryResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/wallet-blocklist/{wallet}"}; }
  rpc ListWalletBlocklistEntries(ListWalletBlocklistEntriesRequest) returns (ListWalletBlocklistEntriesResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/wallet-blocklist"}; }
  rpc CreateWalletBlocklistEntry(CreateWalletBlocklistEntryRequest) returns (CreateWalletBlocklistEntryResponse) { option (google.api.http) = {post: "/api/v1/tokenapi/wallet-blocklist" body: "*"}; }
  rpc UpdateWalletBlocklistEntry(UpdateWalletBlocklistEntryRequest) returns (UpdateWalletBlocklistEntryResponse) { option (google.api.http) = {post: "/api/v1/tokenapi/wallet-blocklist/{wallet}" body: "*"}; }
  rpc DeleteWalletBlocklistEntry(DeleteWalletBlocklistEntryRequest) returns (DeleteWalletBlocklistEntryResponse) { option (google.api.http) = {delete: "/api/v1/tokenapi/wallet-blocklist/{wallet}"}; }
  rpc GetChainIngestCheckpoint(GetChainIngestCheckpointRequest) returns (GetChainIngestCheckpointResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/chain-ingest-checkpoints/{chain_id}"}; }
  rpc ListChainIngestCheckpoints(ListChainIngestCheckpointsRequest) returns (ListChainIngestCheckpointsResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/chain-ingest-checkpoints"}; }
  rpc UpdateChainIngestCheckpoint(UpdateChainIngestCheckpointRequest) returns (UpdateChainIngestCheckpointResponse) { option (google.api.http) = {post: "/api/v1/tokenapi/chain-ingest-checkpoints/{chain_id}/status" body: "*"}; }
  rpc GetContractCode(GetContractCodeRequest) returns (GetContractCodeResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/contract-codes/{code_hash}"}; }
  rpc ListContractCodes(ListContractCodesRequest) returns (ListContractCodesResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/contract-codes"}; }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/projects"}; }
  rpc ListProjectReports(ListProjectReportsRequest) returns (ListProjectReportsResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/project-reports"}; }
  rpc GetProjectDataCollectionTask(GetProjectDataCollectionTaskRequest) returns (GetProjectDataCollectionTaskResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/project-data-collection-tasks/{task_id}"}; }
  rpc ListProjectDataCollectionTasks(ListProjectDataCollectionTasksRequest) returns (ListProjectDataCollectionTasksResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/project-data-collection-tasks"}; }
  rpc ListProjectResearchStates(ListProjectResearchStatesRequest) returns (ListProjectResearchStatesResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/project-research-states"}; }
  rpc ListProjectReportRevisions(ListProjectReportRevisionsRequest) returns (ListProjectReportRevisionsResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/project-report-revisions"}; }
  rpc ListProjectSelections(ListProjectSelectionsRequest) returns (ListProjectSelectionsResponse) { option (google.api.http) = {get: "/api/v1/tokenapi/project-selections"}; }
}
