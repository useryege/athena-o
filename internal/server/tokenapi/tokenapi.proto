syntax = "proto3";

// TokenAPI Service
//
// TokenAPI Service API exposes token-api-level operational data.
package tokenapi;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/tokenapi";

message GetBytecodeBlacklistRequest {
  string code_hash = 1;
}

message GetBytecodeBlacklistResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIBytecodeBlacklist bytecode_blacklist = 2;
}

message ListBytecodeBlacklistsRequest {}

message ListBytecodeBlacklistsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIBytecodeBlacklist bytecode_blacklists = 1;
}

message CreateBytecodeBlacklistRequest {
  string note = 1;
  int64 source_chain_id = 2;
  string source_contract = 3;
}

message CreateBytecodeBlacklistResponse {}

message GetOptionsRequest {}

message GetOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIOptions options = 1;
}

message ListNodeStatusesRequest {}

message ListNodeStatusesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPINodeStatus node_statuses = 1;
}

message UpdateBytecodeBlacklistRequest {
  string code_hash = 1;
  string note = 2;
}

message UpdateBytecodeBlacklistResponse {
  int64 updated_count = 1;
}

message DeleteBytecodeBlacklistRequest {
  string code_hash = 1;
}

message DeleteBytecodeBlacklistResponse {
  int64 deleted_count = 1;
}

message GetWalletBlacklistRequest {
  string wallet = 1;
}

message GetWalletBlacklistResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIWalletBlacklist wallet_blacklist = 2;
}

message ListWalletBlacklistsRequest {}

message ListWalletBlacklistsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIWalletBlacklist wallet_blacklists = 1;
}

message CreateWalletBlacklistRequest {
  string wallet = 1;
  string note = 2;
}

message CreateWalletBlacklistResponse {}

message UpdateWalletBlacklistRequest {
  string wallet = 1;
  string note = 2;
}

message UpdateWalletBlacklistResponse {
  int64 updated_count = 1;
}

message DeleteWalletBlacklistRequest {
  string wallet = 1;
}

message DeleteWalletBlacklistResponse {
  int64 deleted_count = 1;
}

message GetChainIngestCheckpointRequest {
  int64 chain_id = 1;
}

message GetChainIngestCheckpointResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoint = 2;
}

message ListChainIngestCheckpointsRequest {}

message ListChainIngestCheckpointsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoints = 1;
}

message UpdateChainIngestCheckpointRequest {
  int64 chain_id = 1;
  string status = 2;
}

message UpdateChainIngestCheckpointResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoint = 2;
}

message GetContractCodeRequest {
  string code_hash = 1;
}

message GetContractCodeResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCode contract_code = 2;
}

message ListContractCodesRequest {
  string code_hash = 1;
  int32 page = 2;
  int32 page_size = 3;
  string order_by = 4;
}

message ListContractCodesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCode contract_codes = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListProjectsRequest {
  int64 chain_id = 1;
  string code_hash = 2;
  string contract = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListProjectsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProject projects = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetProjectDataCollectionTaskRequest {
  int64 project_id = 1;
  string data_type = 2;
}

message GetProjectDataCollectionTaskResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectDataCollectionTask task = 2;
}

message ListProjectDataCollectionTasksRequest {
  int64 project_id = 1;
  string data_type = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListProjectDataCollectionTasksResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectDataCollectionTask tasks = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service TokenAPIService {
  rpc GetOptions(GetOptionsRequest) returns (GetOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/options"};
  }

  rpc ListNodeStatuses(ListNodeStatusesRequest) returns (ListNodeStatusesResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/node-statuses"};
  }

  rpc GetBytecodeBlacklist(GetBytecodeBlacklistRequest) returns (GetBytecodeBlacklistResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/bytecode-blacklists/{code_hash}"};
  }

  rpc ListBytecodeBlacklists(ListBytecodeBlacklistsRequest) returns (ListBytecodeBlacklistsResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/bytecode-blacklists"};
  }

  rpc CreateBytecodeBlacklist(CreateBytecodeBlacklistRequest) returns (CreateBytecodeBlacklistResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokenapi/bytecode-blacklists"
      body: "*"
    };
  }

  rpc UpdateBytecodeBlacklist(UpdateBytecodeBlacklistRequest) returns (UpdateBytecodeBlacklistResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokenapi/bytecode-blacklists/{code_hash}"
      body: "*"
    };
  }

  rpc DeleteBytecodeBlacklist(DeleteBytecodeBlacklistRequest) returns (DeleteBytecodeBlacklistResponse) {
    option (google.api.http) = {delete: "/api/v1/tokenapi/bytecode-blacklists/{code_hash}"};
  }

  rpc GetWalletBlacklist(GetWalletBlacklistRequest) returns (GetWalletBlacklistResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/wallet-blacklists/{wallet}"};
  }

  rpc ListWalletBlacklists(ListWalletBlacklistsRequest) returns (ListWalletBlacklistsResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/wallet-blacklists"};
  }

  rpc CreateWalletBlacklist(CreateWalletBlacklistRequest) returns (CreateWalletBlacklistResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokenapi/wallet-blacklists"
      body: "*"
    };
  }

  rpc UpdateWalletBlacklist(UpdateWalletBlacklistRequest) returns (UpdateWalletBlacklistResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokenapi/wallet-blacklists/{wallet}"
      body: "*"
    };
  }

  rpc DeleteWalletBlacklist(DeleteWalletBlacklistRequest) returns (DeleteWalletBlacklistResponse) {
    option (google.api.http) = {delete: "/api/v1/tokenapi/wallet-blacklists/{wallet}"};
  }

  rpc GetChainIngestCheckpoint(GetChainIngestCheckpointRequest) returns (GetChainIngestCheckpointResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/chain-ingest-checkpoints/{chain_id}"};
  }

  rpc ListChainIngestCheckpoints(ListChainIngestCheckpointsRequest) returns (ListChainIngestCheckpointsResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/chain-ingest-checkpoints"};
  }

  rpc UpdateChainIngestCheckpoint(UpdateChainIngestCheckpointRequest) returns (UpdateChainIngestCheckpointResponse) {
    option (google.api.http) = {
      post: "/api/v1/tokenapi/chain-ingest-checkpoints/{chain_id}/status"
      body: "*"
    };
  }

  rpc GetContractCode(GetContractCodeRequest) returns (GetContractCodeResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/contract-codes/{code_hash}"};
  }

  rpc ListContractCodes(ListContractCodesRequest) returns (ListContractCodesResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/contract-codes"};
  }

  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/projects"};
  }

  rpc GetProjectDataCollectionTask(GetProjectDataCollectionTaskRequest) returns (GetProjectDataCollectionTaskResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/project-data-collection-tasks/{project_id}/{data_type}"};
  }

  rpc ListProjectDataCollectionTasks(ListProjectDataCollectionTasksRequest) returns (ListProjectDataCollectionTasksResponse) {
    option (google.api.http) = {get: "/api/v1/tokenapi/project-data-collection-tasks"};
  }
}
