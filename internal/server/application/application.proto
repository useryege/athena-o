syntax = "proto3";

// Application Service
//
// Application Service API returns the list of projects.
package application;

import "github.com/useryege/athena/internal/pkg/proto/v1/v1.proto";
import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/application";

// ListProjectsRequest queries the current known project snapshot.
message ListProjectsRequest {
  v1.ProjectScope scope = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

// ListProjectsResponse returns the current known project snapshot.
message ListProjectsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectView items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// GetProjectRequest queries the project snapshot for a given contract.
message GetProjectRequest {
  string contract = 1;
}

// GetProjectResponse returns the project snapshot for a given contract.
message GetProjectResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectView item = 1;
}

// SourceCodeBlacklistField is a globally maintained source-code blacklist field.
message SourceCodeBlacklistField {
  int64 id = 1;
  string field = 2;
}

// ListSourceCodeBlacklistFieldsRequest queries all source-code blacklist fields.
message ListSourceCodeBlacklistFieldsRequest {}

// ListSourceCodeBlacklistFieldsResponse returns all source-code blacklist fields.
message ListSourceCodeBlacklistFieldsResponse {
  repeated SourceCodeBlacklistField items = 1;
}

// AddSourceCodeBlacklistFieldRequest adds a source-code blacklist field.
message AddSourceCodeBlacklistFieldRequest {
  string field = 1;
}

// AddSourceCodeBlacklistFieldResponse returns the stored source-code blacklist field.
message AddSourceCodeBlacklistFieldResponse {
  SourceCodeBlacklistField item = 1;
}

// DeleteSourceCodeBlacklistFieldRequest deletes a source-code blacklist field.
message DeleteSourceCodeBlacklistFieldRequest {
  string field = 1;
}

// BytecodeBlacklistContract is a globally maintained bytecode-blacklist contract entry.
message BytecodeBlacklistContract {
  string contract = 1;
  string code_hash = 2;
  string note = 3;
  string created_at = 4;
}

// ListBytecodeBlacklistContractsRequest queries all bytecode-blacklist contract entries.
message ListBytecodeBlacklistContractsRequest {}

// ListBytecodeBlacklistContractsResponse returns all bytecode-blacklist contract entries.
message ListBytecodeBlacklistContractsResponse {
  repeated BytecodeBlacklistContract items = 1;
}

// AddBytecodeBlacklistContractRequest adds a bytecode-blacklist contract entry.
message AddBytecodeBlacklistContractRequest {
  string contract = 1;
  string note = 2;
}

// AddBytecodeBlacklistContractResponse returns the stored bytecode-blacklist contract entry.
message AddBytecodeBlacklistContractResponse {
  BytecodeBlacklistContract item = 1;
}

// UpdateBytecodeBlacklistContractNoteRequest updates the note of a bytecode-blacklist contract entry.
message UpdateBytecodeBlacklistContractNoteRequest {
  string contract = 1;
  string note = 2;
}

// UpdateBytecodeBlacklistContractNoteResponse returns the updated bytecode-blacklist contract entry.
message UpdateBytecodeBlacklistContractNoteResponse {
  BytecodeBlacklistContract item = 1;
}

// DeleteBytecodeBlacklistContractRequest deletes a bytecode-blacklist contract entry.
message DeleteBytecodeBlacklistContractRequest {
  string contract = 1;
}

// DeleteBytecodeBlacklistContractResponse is returned after deleting a bytecode-blacklist contract entry.
message DeleteBytecodeBlacklistContractResponse {}

// WalletBlacklistContract is a globally maintained wallet-blacklist entry.
message WalletBlacklistContract {
  string contract = 1;
  string note = 2;
  string created_at = 3;
}

// ListWalletBlacklistContractsRequest queries all wallet-blacklist entries.
message ListWalletBlacklistContractsRequest {}

// ListWalletBlacklistContractsResponse returns all wallet-blacklist entries.
message ListWalletBlacklistContractsResponse {
  repeated WalletBlacklistContract items = 1;
}

// AddWalletBlacklistContractRequest adds a wallet-blacklist entry.
message AddWalletBlacklistContractRequest {
  string contract = 1;
  string note = 2;
}

// AddWalletBlacklistContractResponse returns the stored wallet-blacklist entry.
message AddWalletBlacklistContractResponse {
  WalletBlacklistContract item = 1;
}

// UpdateWalletBlacklistContractNoteRequest updates the note of a wallet-blacklist entry.
message UpdateWalletBlacklistContractNoteRequest {
  string contract = 1;
  string note = 2;
}

// UpdateWalletBlacklistContractNoteResponse returns the updated wallet-blacklist entry.
message UpdateWalletBlacklistContractNoteResponse {
  WalletBlacklistContract item = 1;
}

// DeleteWalletBlacklistContractRequest deletes a wallet-blacklist entry.
message DeleteWalletBlacklistContractRequest {
  string contract = 1;
}

// DeleteWalletBlacklistContractResponse is returned after deleting a wallet-blacklist entry.
message DeleteWalletBlacklistContractResponse {}

// GetProjectOptionsRequest don't need any parameters.
message GetProjectOptionsRequest {}

// GetProjectOptionsResponse returns the options.
message GetProjectOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectOption options = 1;
}

// DeleteSourceCodeBlacklistFieldResponse is returned after deleting a source-code blacklist field.
message DeleteSourceCodeBlacklistFieldResponse {}

message ArchiveProjectRequest {
  string contract = 1;
}

message ArchiveProjectResponse {}

message UnarchiveProjectRequest {
  string contract = 1;
}

message UnarchiveProjectResponse {}

service ApplicationService {
  // ListProjects returns the current known project snapshot.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/api/v1/projects"};
  }

  // GetProject returns the project snapshot for a given contract.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = {get: "/api/v1/projects/{contract}"};
  }

  // ListSourceCodeBlacklistFields returns all globally configured source-code blacklist fields.
  rpc ListSourceCodeBlacklistFields(ListSourceCodeBlacklistFieldsRequest) returns (ListSourceCodeBlacklistFieldsResponse) {
    option (google.api.http) = {get: "/api/v1/source-code/blacklist-fields"};
  }

  // AddSourceCodeBlacklistField adds a globally configured source-code blacklist field.
  rpc AddSourceCodeBlacklistField(AddSourceCodeBlacklistFieldRequest) returns (AddSourceCodeBlacklistFieldResponse) {
    option (google.api.http) = {
      post: "/api/v1/source-code/blacklist-fields"
      body: "*"
    };
  }

  // DeleteSourceCodeBlacklistField deletes a globally configured source-code blacklist field.
  rpc DeleteSourceCodeBlacklistField(DeleteSourceCodeBlacklistFieldRequest) returns (DeleteSourceCodeBlacklistFieldResponse) {
    option (google.api.http) = {delete: "/api/v1/source-code/blacklist-fields/{field}"};
  }

  // ListBytecodeBlacklistContracts returns all globally configured bytecode-blacklist contract entries.
  rpc ListBytecodeBlacklistContracts(ListBytecodeBlacklistContractsRequest) returns (ListBytecodeBlacklistContractsResponse) {
    option (google.api.http) = {get: "/api/v1/bytecode/blacklist-contracts"};
  }

  // AddBytecodeBlacklistContract adds a globally configured bytecode-blacklist contract entry.
  rpc AddBytecodeBlacklistContract(AddBytecodeBlacklistContractRequest) returns (AddBytecodeBlacklistContractResponse) {
    option (google.api.http) = {
      post: "/api/v1/bytecode/blacklist-contracts"
      body: "*"
    };
  }

  // UpdateBytecodeBlacklistContractNote updates the note of a globally configured bytecode-blacklist contract entry.
  rpc UpdateBytecodeBlacklistContractNote(UpdateBytecodeBlacklistContractNoteRequest) returns (UpdateBytecodeBlacklistContractNoteResponse) {
    option (google.api.http) = {
      post: "/api/v1/bytecode/blacklist-contracts/{contract}/note"
      body: "*"
    };
  }

  // DeleteBytecodeBlacklistContract deletes a globally configured bytecode-blacklist contract entry.
  rpc DeleteBytecodeBlacklistContract(DeleteBytecodeBlacklistContractRequest) returns (DeleteBytecodeBlacklistContractResponse) {
    option (google.api.http) = {delete: "/api/v1/bytecode/blacklist-contracts/{contract}"};
  }

  // ListWalletBlacklistContracts returns all globally configured wallet-blacklist entries.
  rpc ListWalletBlacklistContracts(ListWalletBlacklistContractsRequest) returns (ListWalletBlacklistContractsResponse) {
    option (google.api.http) = {get: "/api/v1/wallet/blacklist-contracts"};
  }

  // AddWalletBlacklistContract adds a globally configured wallet-blacklist entry.
  rpc AddWalletBlacklistContract(AddWalletBlacklistContractRequest) returns (AddWalletBlacklistContractResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallet/blacklist-contracts"
      body: "*"
    };
  }

  // UpdateWalletBlacklistContractNote updates the note of a globally configured wallet-blacklist entry.
  rpc UpdateWalletBlacklistContractNote(UpdateWalletBlacklistContractNoteRequest) returns (UpdateWalletBlacklistContractNoteResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallet/blacklist-contracts/{contract}/note"
      body: "*"
    };
  }

  // DeleteWalletBlacklistContract deletes a globally configured wallet-blacklist entry.
  rpc DeleteWalletBlacklistContract(DeleteWalletBlacklistContractRequest) returns (DeleteWalletBlacklistContractResponse) {
    option (google.api.http) = {delete: "/api/v1/wallet/blacklist-contracts/{contract}"};
  }

  // GetProjectOptions returns the options.
  rpc GetProjectOptions(GetProjectOptionsRequest) returns (GetProjectOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/project-options"};
  }

  // ArchiveProject archives a project by contract.
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse) {
    option (google.api.http) = {
      post: "/api/v1/project/{contract}/archive"
      body: "*"
    };
  }

  // UnarchiveProject unarchives a project by contract.
  rpc UnarchiveProject(UnarchiveProjectRequest) returns (UnarchiveProjectResponse) {
    option (google.api.http) = {
      post: "/api/v1/project/{contract}/unarchive"
      body: "*"
    };
  }
}
