syntax = "proto3";

// Application Service
//
// Application Service API returns the list of projects.
package application;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";
import "google/api/annotations.proto";

option go_package = "github.com/useryege/athena/pkg/apiclient/application";

// ListProjectsRequest queries the current known project snapshot.
message ListProjectsRequest {
  int32 page = 1;
  int32 pageSize = 2;
}

// ListProjectsResponse returns the current known project snapshot.
message ListProjectsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectListItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// GetProjectRequest queries the project snapshot for a given contract.
message GetProjectRequest {
  string contract = 1;
}

// GetProjectResponse returns the project snapshot for a given contract.
message GetProjectResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectView item = 1;
}

// ProjectEventLog is a project event timeline entry.
message ProjectEventLog {
  int64 id = 1;
  string contract = 2;
  int32 event_type = 3;
  string occurred_at = 4;
  string message = 5;
  string payload = 6;
  string created_at = 7;
}

// ListProjectEventLogsRequest queries event logs by contract.
message ListProjectEventLogsRequest {
  string contract = 1;
}

// ListProjectEventLogsResponse returns event logs for a contract.
message ListProjectEventLogsResponse {
  repeated ProjectEventLog items = 1;
}

// ProjectComment is a project comment timeline entry.
message ProjectComment {
  int64 id = 1;
  string contract = 2;
  string username = 3;
  string content = 4;
  string created_at = 5;
}

// AddProjectCommentRequest creates a project comment.
message AddProjectCommentRequest {
  string contract = 1;
  string content = 2;
}

// AddProjectCommentResponse returns the created project comment.
message AddProjectCommentResponse {
  ProjectComment item = 1;
}

// ListProjectCommentsRequest queries comments by contract.
message ListProjectCommentsRequest {
  string contract = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

// ListProjectCommentsResponse returns comments for a contract.
message ListProjectCommentsResponse {
  repeated ProjectComment items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

// WalletBlacklistEntry is a globally maintained wallet-blacklist entry.
message WalletBlacklistEntry {
  string wallet = 1;
  string note = 2;
  string created_at = 3;
}

// ListWalletBlacklistEntriesRequest queries all wallet-blacklist entries.
message ListWalletBlacklistEntriesRequest {}

// ListWalletBlacklistEntriesResponse returns all wallet-blacklist entries.
message ListWalletBlacklistEntriesResponse {
  repeated WalletBlacklistEntry items = 1;
}

// AddWalletBlacklistEntryRequest adds a wallet-blacklist entry.
message AddWalletBlacklistEntryRequest {
  string wallet = 1;
  string note = 2;
}

// AddWalletBlacklistEntryResponse returns the stored wallet-blacklist entry.
message AddWalletBlacklistEntryResponse {
  WalletBlacklistEntry item = 1;
}

// UpdateWalletBlacklistEntryNoteRequest updates the note of a wallet-blacklist entry.
message UpdateWalletBlacklistEntryNoteRequest {
  string wallet = 1;
  string note = 2;
}

// UpdateWalletBlacklistEntryNoteResponse returns the updated wallet-blacklist entry.
message UpdateWalletBlacklistEntryNoteResponse {
  WalletBlacklistEntry item = 1;
}

// DeleteWalletBlacklistEntryRequest deletes a wallet-blacklist entry.
message DeleteWalletBlacklistEntryRequest {
  string wallet = 1;
}

// DeleteWalletBlacklistEntryResponse is returned after deleting a wallet-blacklist entry.
message DeleteWalletBlacklistEntryResponse {}

// GetProjectOptionsRequest don't need any parameters.
message GetProjectOptionsRequest {}

// GetProjectOptionsResponse returns the options.
message GetProjectOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.ProjectOption options = 1;
}

service ApplicationService {
  // ListProjects returns the current known project snapshot.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/api/v1/projects"};
  }

  // GetProject returns the project snapshot for a given contract.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = {get: "/api/v1/projects/{contract}"};
  }

  // ListProjectEventLogs returns event logs for a given contract.
  rpc ListProjectEventLogs(ListProjectEventLogsRequest) returns (ListProjectEventLogsResponse) {
    option (google.api.http) = {get: "/api/v1/projects/{contract}/events"};
  }

  // AddProjectComment creates a project comment.
  rpc AddProjectComment(AddProjectCommentRequest) returns (AddProjectCommentResponse) {
    option (google.api.http) = {
      post: "/api/v1/projects/{contract}/comments"
      body: "*"
    };
  }

  // ListProjectComments returns comments for a given contract.
  rpc ListProjectComments(ListProjectCommentsRequest) returns (ListProjectCommentsResponse) {
    option (google.api.http) = {get: "/api/v1/projects/{contract}/comments"};
  }

  // ListWalletBlacklistEntries returns all globally configured wallet-blacklist entries.
  rpc ListWalletBlacklistEntries(ListWalletBlacklistEntriesRequest) returns (ListWalletBlacklistEntriesResponse) {
    option (google.api.http) = {get: "/api/v1/wallet-blacklist"};
  }

  // AddWalletBlacklistEntry adds a globally configured wallet-blacklist entry.
  rpc AddWalletBlacklistEntry(AddWalletBlacklistEntryRequest) returns (AddWalletBlacklistEntryResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallet-blacklist"
      body: "*"
    };
  }

  // UpdateWalletBlacklistEntryNote updates the note of a globally configured wallet-blacklist entry.
  rpc UpdateWalletBlacklistEntryNote(UpdateWalletBlacklistEntryNoteRequest) returns (UpdateWalletBlacklistEntryNoteResponse) {
    option (google.api.http) = {
      post: "/api/v1/wallet-blacklist/{wallet}/note"
      body: "*"
    };
  }

  // DeleteWalletBlacklistEntry deletes a globally configured wallet-blacklist entry.
  rpc DeleteWalletBlacklistEntry(DeleteWalletBlacklistEntryRequest) returns (DeleteWalletBlacklistEntryResponse) {
    option (google.api.http) = {delete: "/api/v1/wallet-blacklist/{wallet}"};
  }

  // GetProjectOptions returns the options.
  rpc GetProjectOptions(GetProjectOptionsRequest) returns (GetProjectOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/project-options"};
  }

}
