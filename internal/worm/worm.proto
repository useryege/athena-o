syntax = "proto3";

// Worm Service API exposes worm-level workload status.
package athena.internal.worm;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/worm/apiclient";

// GetWormStatusRequest queries the worm service runtime status.
message GetWormStatusRequest {}

// GetWormStatusResponse returns the worm service runtime status.
message GetWormStatusResponse {
  bool started = 1;
  string status = 2;
}

// GetWormEventRequest queries one Worm event by condition id.
message GetWormEventRequest {
  string condition_id = 1;
}

// GetWormEventResponse returns one Worm event and related market summaries.
message GetWormEventResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WormEventItem event = 1;
  int64 fetched_at = 2;
}

// ListWormEventsRequest queries Worm events for the configured browse view.
message ListWormEventsRequest {
  int32 limit = 1;
  string cursor = 2;
  string sort_option = 3;
  string category_slug = 4;
}

// ListWormEventsResponse returns Worm events and cursor pagination.
message ListWormEventsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WormEventItem events = 1;
  string next_cursor = 2;
  int64 fetched_at = 3;
  bool stale = 4;
}

service WormService {
  // GetWormStatus returns the worm service runtime status.
  rpc GetWormStatus(GetWormStatusRequest) returns (GetWormStatusResponse);

  // GetWormEvent returns an event and related market summaries by condition id.
  rpc GetWormEvent(GetWormEventRequest) returns (GetWormEventResponse);

  // ListWormEvents returns events for the requested browse filters.
  rpc ListWormEvents(ListWormEventsRequest) returns (ListWormEventsResponse);
}
