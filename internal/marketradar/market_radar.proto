syntax = "proto3";

package athena.internal.marketradar;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/marketradar/apiclient";

message GetMarketRadarStatusRequest {}

message GetMarketRadarStatusResponse {
  bool started = 1;
  string status = 2;
}

message ListHotMarketsRequest {
  int32 limit = 1;
}

message ListHotMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.MarketRadarHotMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  int32 monitored_markets = 4;
  int32 monitored_tokens = 5;
  int32 candidate_count = 6;
}

message ListRealtimeMarketsRequest {
  int32 limit = 1;
}

message ListRealtimeMarketsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.MarketRadarRealtimeMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  int32 subscribed_markets = 4;
  int32 subscribed_tokens = 5;
  bool connected = 6;
  int64 last_event_at = 7;
  int32 candidate_count = 8;
}

message ListMarketMoversRequest {
  int32 limit = 1;
}

message ListMarketMoversResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.MarketRadarMoverMarketItem items = 1;
  int64 fetched_at = 2;
  bool stale = 3;
  bool connected = 4;
  int64 last_event_at = 5;
  int32 monitored_markets = 6;
  int32 monitored_tokens = 7;
  int32 candidate_count = 8;
}

service MarketRadarService {
  rpc GetMarketRadarStatus(GetMarketRadarStatusRequest) returns (GetMarketRadarStatusResponse);
  rpc ListHotMarkets(ListHotMarketsRequest) returns (ListHotMarketsResponse);
  rpc ListRealtimeMarkets(ListRealtimeMarketsRequest) returns (ListRealtimeMarketsResponse);
  rpc ListMarketMovers(ListMarketMoversRequest) returns (ListMarketMoversResponse);
}
