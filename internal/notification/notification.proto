syntax = "proto3";

// Notification exposes the internal system and account notification domains.
package athena.internal.notification;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/notification/apiclient";

// NotificationSeverity describes the urgency of a notification.
enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_WARNING = 2;
  NOTIFICATION_SEVERITY_ERROR = 3;
  NOTIFICATION_SEVERITY_CRITICAL = 4;
}

// NotificationDeliveryStatus describes a durable delivery result.
enum NotificationDeliveryStatus {
  NOTIFICATION_DELIVERY_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_DELIVERY_STATUS_PENDING = 1;
  NOTIFICATION_DELIVERY_STATUS_SENT = 2;
  NOTIFICATION_DELIVERY_STATUS_FAILED = 3;
  NOTIFICATION_DELIVERY_STATUS_CANCELLED = 4;
}

// TelegramChat selects the configured system Telegram chat.
enum TelegramChat {
  TELEGRAM_CHAT_UNSPECIFIED = 0;
  TELEGRAM_CHAT_TEST = 1;
  TELEGRAM_CHAT_PROD = 2;
}

message GetNotificationRuntimeStatusRequest {}

message NotificationRuntimeStatus {
  bool started = 1;
  string status = 2;
  bool bot_available = 3;
  int64 bot_id = 4;
  string bot_username = 5;
  bool poller_active = 6;
  string last_poll_at = 7;
  string last_update_at = 8;
  int64 system_pending_count = 9;
  int64 system_retry_count = 10;
  int64 system_failed_count = 11;
  int64 account_pending_count = 12;
  int64 account_retry_count = 13;
  int64 account_failed_count = 14;
  int64 unreachable_binding_count = 15;
}

message SendSystemNotificationRequest {
  string topic_label = 1;
  string source = 2;
  NotificationSeverity severity = 3;
  string title = 4;
  string body = 5;
  string link = 6;
  TelegramChat telegram_chat = 7;
}

message SendSystemNotificationResponse {
  int64 notification_id = 1;
  NotificationDeliveryStatus status = 2;
  string provider_message_id = 3;
  string error_message = 4;
}

message ListSystemNotificationDeliveriesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;
  string severity = 4;
  string source = 5;
  string keyword = 6;
  string topic_label = 7;
  string telegram_chat = 8;
}

message ListSystemNotificationDeliveriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.SystemNotificationDeliveryItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetSystemNotificationDeliveryRequest {
  int64 id = 1;
}

message GetSystemNotificationDeliveryResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.SystemNotificationDeliveryDetail item = 1;
}

enum TelegramBindingStatus {
  TELEGRAM_BINDING_STATUS_UNSPECIFIED = 0;
  TELEGRAM_BINDING_STATUS_CONNECTED = 1;
  TELEGRAM_BINDING_STATUS_UNREACHABLE = 2;
}

enum TelegramBindingAttemptStatus {
  TELEGRAM_BINDING_ATTEMPT_STATUS_UNSPECIFIED = 0;
  TELEGRAM_BINDING_ATTEMPT_STATUS_PENDING = 1;
  TELEGRAM_BINDING_ATTEMPT_STATUS_FAILED = 2;
}

message TelegramBinding {
  TelegramBindingStatus status = 1;
  string telegram_username = 2;
  string telegram_display_name = 3;
  string bound_at = 4;
  int64 revision = 5;
}

message TelegramBindingAttempt {
  string id = 1;
  TelegramBindingAttemptStatus status = 2;
  string expires_at = 3;
  string failure_reason = 4;
}

message GetTelegramBindingRequest {
  string account_id = 1;
}

message GetTelegramBindingResponse {
  bool bot_available = 1;
  string bot_username = 2;
  TelegramBinding binding = 3;
  TelegramBindingAttempt attempt = 4;
}

message CreateTelegramBindingAttemptRequest {
  string account_id = 1;
}

message CreateTelegramBindingAttemptResponse {
  TelegramBindingAttempt attempt = 1;
  string bot_username = 2;
  string deep_link = 3;
  string fallback_command = 4;
}

message DeleteTelegramBindingAttemptRequest {
  string account_id = 1;
}

message DeleteTelegramBindingAttemptResponse {
  bool deleted = 1;
}

message DeleteTelegramBindingRequest {
  string account_id = 1;
}

message DeleteTelegramBindingResponse {
  bool deleted = 1;
}

message SendAccountNotificationRequest {
  string account_id = 1;
  string idempotency_key = 2;
  string source = 3;
  NotificationSeverity severity = 4;
  string title = 5;
  string body = 6;
  string link = 7;
}

enum SendAccountNotificationResult {
  SEND_ACCOUNT_NOTIFICATION_RESULT_UNSPECIFIED = 0;
  SEND_ACCOUNT_NOTIFICATION_RESULT_QUEUED = 1;
  SEND_ACCOUNT_NOTIFICATION_RESULT_RECIPIENT_NOT_BOUND = 2;
  SEND_ACCOUNT_NOTIFICATION_RESULT_RECIPIENT_UNREACHABLE = 3;
}

message SendAccountNotificationResponse {
  SendAccountNotificationResult result = 1;
  int64 delivery_id = 2;
}

service SystemNotificationService {
  rpc SendSystemNotification(SendSystemNotificationRequest) returns (SendSystemNotificationResponse);
  rpc ListSystemNotificationDeliveries(ListSystemNotificationDeliveriesRequest) returns (ListSystemNotificationDeliveriesResponse);
  rpc GetSystemNotificationDelivery(GetSystemNotificationDeliveryRequest) returns (GetSystemNotificationDeliveryResponse);
}

service NotificationRuntimeService {
  rpc GetNotificationRuntimeStatus(GetNotificationRuntimeStatusRequest) returns (NotificationRuntimeStatus);
}

service AccountNotificationService {
  rpc GetTelegramBinding(GetTelegramBindingRequest) returns (GetTelegramBindingResponse);
  rpc CreateTelegramBindingAttempt(CreateTelegramBindingAttemptRequest) returns (CreateTelegramBindingAttemptResponse);
  rpc DeleteTelegramBindingAttempt(DeleteTelegramBindingAttemptRequest) returns (DeleteTelegramBindingAttemptResponse);
  rpc DeleteTelegramBinding(DeleteTelegramBindingRequest) returns (DeleteTelegramBindingResponse);
  rpc SendAccountNotification(SendAccountNotificationRequest) returns (SendAccountNotificationResponse);
}
