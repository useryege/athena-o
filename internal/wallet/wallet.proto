syntax = "proto3";

// Wallet Service API is the trusted account-owned wallet boundary.
package athena.internal.wallet;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/wallet/apiclient";

message GetWalletStatusRequest {}

message ListWalletsRequest {
  string wallet_type = 1;
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
  string requester_account_id = 5;
}

message ListWalletsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetWalletRequest {
  int64 id = 1;
  string requester_account_id = 2;
}

message GetWalletResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

message CreateWalletRequest {
  string wallet_type = 1;
  string remark = 2;
  string avatar_preset_id = 3;
  string requester_account_id = 4;
}

message CreateWalletResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
  string private_key = 2;
}

message ImportWalletRequest {
  string wallet_type = 1;
  string private_key = 2;
  string remark = 3;
  string avatar_preset_id = 4;
  string requester_account_id = 5;
}

message ImportWalletResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

message UpdateWalletRemarkRequest {
  int64 id = 1;
  string remark = 2;
  uint64 expected_revision = 3;
  string requester_account_id = 4;
}

message UpdateWalletRemarkResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

message UpdateWalletAvatarPresetRequest {
  int64 id = 1;
  string avatar_preset_id = 2;
  uint64 expected_revision = 3;
  string requester_account_id = 4;
}

message UpdateWalletAvatarPresetResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
  string previous_avatar_object_key = 2;
}

message RevealWalletPrivateKeyRequest {
  int64 id = 1;
  string requester_account_id = 2;
}

message RevealWalletPrivateKeyResponse {
  string private_key = 1;
}

message SignWormAuthChallengeRequest {
  int64 id = 1;
  string requester_account_id = 2;
  string expected_address = 3;
  string nonce = 4;
  string message = 5;
}

message SignWormAuthChallengeResponse {
  string signature = 1;
  string message_sha256 = 2;
}

message WalletAvatarMetadata {
  int64 id = 1;
  uint64 revision = 2;
  string object_key = 3;
  string content_type = 4;
  string etag = 5;
  int64 size_bytes = 6;
}

message GetWalletAvatarMetadataRequest {
  int64 id = 1;
  string requester_account_id = 2;
}

message GetWalletAvatarMetadataResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
  WalletAvatarMetadata metadata = 2;
}

message ReplaceWalletAvatarMetadataRequest {
  int64 id = 1;
  uint64 expected_revision = 2;
  string object_key = 3;
  string content_type = 4;
  string etag = 5;
  int64 size_bytes = 6;
  string requester_account_id = 7;
}

message ReplaceWalletAvatarMetadataResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
  string previous_avatar_object_key = 2;
}

message ResetWalletAvatarMetadataRequest {
  int64 id = 1;
  uint64 expected_revision = 2;
  string requester_account_id = 3;
}

message ResetWalletAvatarMetadataResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
  string previous_avatar_object_key = 2;
}

message ListWalletAvatarObjectKeysRequest {}

message ListWalletAvatarObjectKeysResponse {
  repeated string object_keys = 1;
}

service WalletService {
  rpc GetWalletStatus(GetWalletStatusRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletStatus);
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc ImportWallet(ImportWalletRequest) returns (ImportWalletResponse);
  rpc UpdateWalletRemark(UpdateWalletRemarkRequest) returns (UpdateWalletRemarkResponse);
  rpc UpdateWalletAvatarPreset(UpdateWalletAvatarPresetRequest) returns (UpdateWalletAvatarPresetResponse);
  rpc RevealWalletPrivateKey(RevealWalletPrivateKeyRequest) returns (RevealWalletPrivateKeyResponse);
  rpc SignWormAuthChallenge(SignWormAuthChallengeRequest) returns (SignWormAuthChallengeResponse);
  rpc GetWalletAvatarMetadata(GetWalletAvatarMetadataRequest) returns (GetWalletAvatarMetadataResponse);
  rpc ReplaceWalletAvatarMetadata(ReplaceWalletAvatarMetadataRequest) returns (ReplaceWalletAvatarMetadataResponse);
  rpc ResetWalletAvatarMetadata(ResetWalletAvatarMetadataRequest) returns (ResetWalletAvatarMetadataResponse);
  rpc ListWalletAvatarObjectKeys(ListWalletAvatarObjectKeysRequest) returns (ListWalletAvatarObjectKeysResponse);
}
