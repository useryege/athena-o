syntax = "proto3";

// Wallet Service API exposes wallet service runtime status.
package athena.internal.wallet;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/wallet/apiclient";

// GetWalletStatusRequest queries the wallet service runtime status.
message GetWalletStatusRequest {}

// ListWalletsRequest queries persisted wallet records.
message ListWalletsRequest {
  string chain = 1;
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ListWalletsResponse returns persisted wallet records without secret material.
message ListWalletsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// GetWalletRequest queries one persisted wallet record.
message GetWalletRequest {
  int64 id = 1;
  bool reveal_secrets = 2;
}

// GetWalletResponse returns one persisted wallet record.
message GetWalletResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletDetail item = 1;
}

// CreateWalletRequest creates a new wallet for one chain.
message CreateWalletRequest {
  string chain = 1;
  string alias = 2;
}

// CreateWalletResponse returns the created wallet record.
message CreateWalletResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletDetail item = 1;
}

// ImportPrivateKeyRequest imports a private key for one chain.
message ImportPrivateKeyRequest {
  string chain = 1;
  string private_key = 2;
  string alias = 3;
}

// ImportPrivateKeyResponse returns the imported wallet record.
message ImportPrivateKeyResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletDetail item = 1;
}

// ImportMnemonicRequest imports a mnemonic-derived wallet for one chain.
message ImportMnemonicRequest {
  string chain = 1;
  string mnemonic = 2;
  string alias = 3;
}

// ImportMnemonicResponse returns the imported wallet record.
message ImportMnemonicResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletDetail item = 1;
}

// UpdateWalletAliasRequest updates wallet alias text without changing secret material.
message UpdateWalletAliasRequest {
  int64 id = 1;
  string alias = 2;
}

// UpdateWalletAliasResponse returns the updated wallet record.
message UpdateWalletAliasResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletItem item = 1;
}

// WalletBlacklistEntry is a globally maintained wallet-blacklist entry.
message WalletBlacklistEntry {
  string wallet = 1;
  string note = 2;
  string created_at = 3;
}

// ListWalletBlacklistEntriesRequest queries all wallet-blacklist entries.
message ListWalletBlacklistEntriesRequest {}

// ListWalletBlacklistEntriesResponse returns all wallet-blacklist entries.
message ListWalletBlacklistEntriesResponse {
  repeated WalletBlacklistEntry items = 1;
}

// AddWalletBlacklistEntryRequest adds a wallet-blacklist entry.
message AddWalletBlacklistEntryRequest {
  string wallet = 1;
  string note = 2;
}

// AddWalletBlacklistEntryResponse returns the stored wallet-blacklist entry.
message AddWalletBlacklistEntryResponse {
  WalletBlacklistEntry item = 1;
}

// UpdateWalletBlacklistEntryNoteRequest updates the note of a wallet-blacklist entry.
message UpdateWalletBlacklistEntryNoteRequest {
  string wallet = 1;
  string note = 2;
}

// UpdateWalletBlacklistEntryNoteResponse returns the updated wallet-blacklist entry.
message UpdateWalletBlacklistEntryNoteResponse {
  WalletBlacklistEntry item = 1;
}

// DeleteWalletBlacklistEntryRequest deletes a wallet-blacklist entry.
message DeleteWalletBlacklistEntryRequest {
  string wallet = 1;
}

// DeleteWalletBlacklistEntryResponse is returned after deleting a wallet-blacklist entry.
message DeleteWalletBlacklistEntryResponse {}

service WalletService {
  // GetWalletStatus returns the wallet service runtime status.
  rpc GetWalletStatus(GetWalletStatusRequest) returns (github.com.useryege.athena.pkg.apis.application.v1alpha1.WalletStatus);

  // ListWallets returns persisted wallet records without secret material.
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);

  // GetWallet returns one wallet record and optionally reveals secret material.
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);

  // CreateWallet creates a new wallet for one chain.
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);

  // ImportPrivateKey imports a private key for one chain.
  rpc ImportPrivateKey(ImportPrivateKeyRequest) returns (ImportPrivateKeyResponse);

  // ImportMnemonic imports a mnemonic-derived wallet for one chain.
  rpc ImportMnemonic(ImportMnemonicRequest) returns (ImportMnemonicResponse);

  // UpdateWalletAlias updates wallet alias text without changing secret material.
  rpc UpdateWalletAlias(UpdateWalletAliasRequest) returns (UpdateWalletAliasResponse);

  // ListWalletBlacklistEntries returns all globally configured wallet-blacklist entries.
  rpc ListWalletBlacklistEntries(ListWalletBlacklistEntriesRequest) returns (ListWalletBlacklistEntriesResponse);

  // AddWalletBlacklistEntry adds a globally configured wallet-blacklist entry.
  rpc AddWalletBlacklistEntry(AddWalletBlacklistEntryRequest) returns (AddWalletBlacklistEntryResponse);

  // UpdateWalletBlacklistEntryNote updates the note of a globally configured wallet-blacklist entry.
  rpc UpdateWalletBlacklistEntryNote(UpdateWalletBlacklistEntryNoteRequest) returns (UpdateWalletBlacklistEntryNoteResponse);

  // DeleteWalletBlacklistEntry deletes a globally configured wallet-blacklist entry.
  rpc DeleteWalletBlacklistEntry(DeleteWalletBlacklistEntryRequest) returns (DeleteWalletBlacklistEntryResponse);
}
