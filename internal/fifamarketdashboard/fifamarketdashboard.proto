syntax = "proto3";

// FIFA Market Dashboard Service API exposes the aggregated FIFA market view.
package athena.internal.fifamarketdashboard;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/fifamarketdashboard/apiclient";

// GetFIFAMarketDashboardStatusRequest queries the FIFA Market Dashboard service runtime status.
message GetFIFAMarketDashboardStatusRequest {}

// GetFIFAMarketDashboardStatusResponse returns the FIFA Market Dashboard service runtime status.
message GetFIFAMarketDashboardStatusResponse {
  bool started = 1;
  string status = 2;
}

message GetFIFAMarketDashboardRequest {
  string requester_account_id = 1;
  bool requester_administrator = 2;
}

message GetFIFAMarketDashboardResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.FIFAMarketDashboard dashboard = 1;
}

message UpdateFIFAEventConfigRequest {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.FIFAMarketDashboardEventConfig config = 1;
}

message UpdateFIFAEventConfigResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.FIFAMarketDashboardEventConfig config = 1;
}

service FIFAMarketDashboardService {
  // GetFIFAMarketDashboardStatus returns the FIFA Market Dashboard service runtime status.
  rpc GetFIFAMarketDashboardStatus(GetFIFAMarketDashboardStatusRequest) returns (GetFIFAMarketDashboardStatusResponse);

  rpc GetFIFAMarketDashboard(GetFIFAMarketDashboardRequest) returns (GetFIFAMarketDashboardResponse);

  rpc UpdateFIFAEventConfig(UpdateFIFAEventConfigRequest) returns (UpdateFIFAEventConfigResponse);
}
