syntax = "proto3";

// Worm Trading Service API exposes trusted wallet observations, saved market
// combinations, and Worm API credential lifecycle operations to the API Server.
package athena.internal.wormtrading;

option go_package = "github.com/useryege/athena/internal/wormtrading/apiclient";

// GetWormTradingStatusRequest queries the service and Solana adapter status.
message GetWormTradingStatusRequest {}

// GetWormTradingStatusResponse describes lifecycle and upstream readiness.
message GetWormTradingStatusResponse {
  bool started = 1;
  string status = 2;
  string network = 3;
  string commitment = 4;
  bool rpc_configured = 5;
  bool rpc_reachable = 6;
  bool batch_supported = 7;
  bool genesis_verified = 8;
  string genesis_hash = 9;
  string usdc_mint = 10;
  bool usdc_program_verified = 11;
  int32 usdc_decimals = 12;
  uint64 latest_confirmed_slot = 13;
  int64 last_probe_at = 14;
  int64 last_success_at = 15;
  int64 latency_ms = 16;
  int32 consecutive_failures = 17;
  string last_error_code = 18;
  bool credential_store_configured = 19;
  bool credential_store_reachable = 20;
  string credential_store_status = 21;
  bool worm_api_reachable = 22;
  int64 last_worm_success_at = 23;
  int64 last_worm_failure_at = 24;
  string last_worm_error_code = 25;
}

// WalletBalanceReference correlates one trusted Wallet record with its address.
message WalletBalanceReference {
  int64 wallet_id = 1;
  string address = 2;
}

// AssetBalance is one native SOL balance observation.
message AssetBalance {
  string atomic_amount = 1;
  string amount = 2;
  int32 decimals = 3;
  uint64 observed_slot = 4;
  string availability = 5;
  string error_code = 6;
}

// TokenBalance is one fixed-mint token balance observation.
message TokenBalance {
  string mint = 1;
  string atomic_amount = 2;
  string amount = 3;
  int32 decimals = 4;
  uint64 observed_slot = 5;
  string availability = 6;
  string error_code = 7;
  int32 token_account_count = 8;
}

// WalletBalanceItem contains independent SOL and Circle native USDC results.
message WalletBalanceItem {
  int64 wallet_id = 1;
  string address = 2;
  AssetBalance sol = 3;
  TokenBalance usdc = 4;
  string status = 5;
}

// BatchGetWalletBalancesRequest accepts at most 100 caller-resolved Wallet refs.
message BatchGetWalletBalancesRequest {
  repeated WalletBalanceReference refs = 1;
}

// BatchGetWalletBalancesResponse returns results in request order.
message BatchGetWalletBalancesResponse {
  repeated WalletBalanceItem items = 1;
  string network = 2;
  string commitment = 3;
  int64 fetched_at = 4;
}

// PrepareWormWalletConnectionRequest starts a one-time Worm credential
// challenge for one caller-verified Solana wallet.
message PrepareWormWalletConnectionRequest {
  int64 wallet_id = 1;
  string address = 2;
  bool reconnect = 3;
  // regenerate_unknown_credential is an explicit caller acknowledgement that
  // a prior credential-create outcome is unresolved and a replacement should
  // be created without attempting to discover or revoke the possible remote
  // credential.
  bool regenerate_unknown_credential = 4;
}

// PrepareWormWalletConnectionResponse contains only the bounded challenge data
// needed by the API Server to ask Wallet for a purpose-specific signature.
message PrepareWormWalletConnectionResponse {
  string attempt_id = 1;
  int64 wallet_id = 2;
  string address = 3;
  string nonce = 4;
  string message = 5;
  bytes message_sha256 = 6;
  int64 expires_at = 7;
}

// CompleteWormWalletConnectionRequest completes exactly one persisted
// challenge. Signature is a raw 64-byte Ed25519 signature.
message CompleteWormWalletConnectionRequest {
  string attempt_id = 1;
  int64 wallet_id = 2;
  string address = 3;
  bytes message_sha256 = 4;
  bytes signature = 5;
}

// WormWalletConnection is a non-secret connection projection.
message WormWalletConnection {
  int64 wallet_id = 1;
  string address = 2;
  string state = 3;
  string warning_code = 4;
  int64 connected_at = 5;
}

// WalletConnectionReference correlates one caller-verified Wallet record with
// its canonical Solana address.
message WalletConnectionReference {
  int64 wallet_id = 1;
  string address = 2;
}

// BatchGetWalletConnectionsRequest accepts at most 100 caller-resolved Wallet
// refs.
message BatchGetWalletConnectionsRequest {
  repeated WalletConnectionReference refs = 1;
}

// BatchGetWalletConnectionsResponse returns non-secret connection projections
// in request order without decrypting or exposing Worm credentials.
message BatchGetWalletConnectionsResponse {
  repeated WormWalletConnection items = 1;
  int64 fetched_at = 2;
}

message CompleteWormWalletConnectionResponse {
  WormWalletConnection connection = 1;
}

message DisconnectWormWalletRequest {
  int64 wallet_id = 1;
  string address = 2;
}

message DisconnectWormWalletResponse {
  WormWalletConnection connection = 1;
}

// WalletPositionReference correlates one trusted Wallet record with its
// canonical Solana address.
message WalletPositionReference {
  int64 wallet_id = 1;
  string address = 2;
}

message WormOptionalString {
  string value = 1;
}

message WormEventSummary {
  string condition_id = 1;
  string title = 2;
  WormOptionalString logo = 3;
}

message WormPositionMarketSummary {
  string condition_id = 1;
  string title = 2;
  WormOptionalString logo = 3;
  WormOptionalString latest_trade_price = 4;
  WormEventSummary event = 5;
}

message WormOpenPosition {
  string pubkey = 1;
  WormOptionalString position_request_pubkey = 2;
  WormPositionMarketSummary market = 3;
  bool is_yes = 4;
  string leverage = 5;
  string total_shares = 6;
  string average_entry_price = 7;
  string user_liquidity = 8;
  string total_liquidity = 9;
  string liquidation_price = 10;
  WormOptionalString unrealized_pnl = 11;
  string realized_pnl = 12;
  bool is_closed = 13;
  bool is_liquidated = 14;
  bool is_claimed = 15;
  int64 created_at = 16;
}

message WormInFlightPositionRequest {
  string pubkey = 1;
  string type = 2;
  string state = 3;
  WormOptionalString order_state = 4;
  WormPositionMarketSummary market = 5;
  bool is_yes = 6;
  string leverage = 7;
  string funds = 8;
  WormOptionalString price = 9;
  WormOptionalString shares = 10;
  int64 created_at = 11;
}

message WormPositionStreamStatus {
  string availability = 1;
  string error_code = 2;
  bool truncated = 3;
}

message WalletPositionSnapshot {
  int64 wallet_id = 1;
  string address = 2;
  WormWalletConnection connection = 3;
  repeated WormOpenPosition open_positions = 4;
  WormPositionStreamStatus open_positions_status = 5;
  repeated WormInFlightPositionRequest in_flight_requests = 6;
  WormPositionStreamStatus in_flight_requests_status = 7;
  string status = 8;
}

message BatchGetWalletPositionSnapshotsRequest {
  repeated WalletPositionReference refs = 1;
}

message BatchGetWalletPositionSnapshotsResponse {
  repeated WalletPositionSnapshot items = 1;
  int64 fetched_at = 2;
  int32 open_position_count = 3;
  int32 in_flight_request_count = 4;
  string status = 5;
}

// MarketCombinationItemInput is an API-Server-validated market selection and
// its trusted display snapshot. Array order is the persisted execution order.
message MarketCombinationItemInput {
  string event_condition_id = 1;
  string event_title = 2;
  string event_logo = 3;
  string market_condition_id = 4;
  string market_title = 5;
  string market_logo = 6;
  bool is_yes = 7;
  string outcome_label = 8;
}

message MarketCombinationItem {
  int32 ordinal = 1;
  string event_condition_id = 2;
  string event_title = 3;
  string event_logo = 4;
  string market_condition_id = 5;
  string market_title = 6;
  string market_logo = 7;
  bool is_yes = 8;
  string outcome_label = 9;
}

message MarketCombination {
  string id = 1;
  string name = 2;
  int64 revision = 3;
  repeated MarketCombinationItem items = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  string owner_account_id = 7;
}

message CreateMarketCombinationRequest {
  string owner_account_id = 1;
  string name = 2;
  repeated MarketCombinationItemInput items = 3;
}

message CreateMarketCombinationResponse {
  MarketCombination combination = 1;
}

message GetMarketCombinationRequest {
  string owner_account_id = 1;
  string id = 2;
}

message GetMarketCombinationResponse {
  MarketCombination combination = 1;
}

message ListMarketCombinationsRequest {
  string owner_account_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListMarketCombinationsResponse {
  repeated MarketCombination items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateMarketCombinationRequest {
  string owner_account_id = 1;
  string id = 2;
  string name = 3;
  int64 expected_revision = 4;
  repeated MarketCombinationItemInput items = 5;
}

message UpdateMarketCombinationResponse {
  MarketCombination combination = 1;
}

message DeleteMarketCombinationRequest {
  string owner_account_id = 1;
  string id = 2;
  int64 expected_revision = 3;
}

message DeleteMarketCombinationResponse {}

// ExecutionPlanWalletInput is the API-Server-verified wallet identity and
// presentation snapshot captured when an execution preview is requested.
message ExecutionPlanWalletInput {
  int64 wallet_id = 1;
  string address = 2;
  string remark = 3;
  string avatar_kind = 4;
  string avatar_preset_id = 5;
  string avatar_url = 6;
}

// ExecutionPlanWallet is one wallet frozen into an execution preview.
message ExecutionPlanWallet {
  int32 ordinal = 1;
  int64 wallet_id = 2;
  string address = 3;
  string remark = 4;
  string avatar_kind = 5;
  string avatar_preset_id = 6;
  string avatar_url = 7;
  WormWalletConnection connection = 8;
  AssetBalance sol = 9;
  TokenBalance usdc = 10;
  string status = 11;
  string reason_code = 12;
}

// ExecutionPlanEstimate is the immutable public Worm estimate used by all
// wallet steps for the corresponding market and side. Decimal values are
// canonical strings so precision is never lost in the internal contract.
message ExecutionPlanEstimate {
  string average_price = 1;
  string total_shares = 2;
  string total_cost = 3;
  string best_ask = 4;
  string worst_fill_price = 5;
  bool is_fully_filled = 6;
  string fee_amount = 7;
  string user_funds_needed = 8;
  WormOptionalString liquidation_price = 9;
}

// ExecutionPlanItem is one frozen combination selection and its current
// market/estimate preflight result.
message ExecutionPlanItem {
  int32 ordinal = 1;
  string event_condition_id = 2;
  string event_title = 3;
  string event_logo = 4;
  string market_condition_id = 5;
  string market_title = 6;
  string market_logo = 7;
  bool is_yes = 8;
  string outcome_label = 9;
  string backend = 10;
  string funds = 11;
  string leverage = 12;
  string state = 13;
  string reason_code = 14;
  ExecutionPlanEstimate estimate = 15;
}

// ExecutionPlanStep is one preview-only wallet-major execution step.
message ExecutionPlanStep {
  int64 ordinal = 1;
  int32 wallet_ordinal = 2;
  int32 item_ordinal = 3;
  string disposition = 4;
  string reason_code = 5;
  string projected_usdc_before = 6;
  string projected_usdc_after = 7;
  repeated string advisory_codes = 8;
}

// ExecutionPlanReasonCount is a server-side aggregate of preview step
// classifications. READY is the stable key for executable steps.
message ExecutionPlanReasonCount {
  string reason_code = 1;
  int64 count = 2;
}

// ExecutionPreflightChecks freezes the optional preview skip policy. A false
// field records that the corresponding observed condition is advisory rather
// than blocking; all safety and provider-validity checks remain mandatory.
message ExecutionPreflightChecks {
  bool skip_already_held = 1;
  bool skip_in_flight_request = 2;
  bool skip_opposite_side_exposure = 3;
  bool require_full_liquidity = 4;
}

// ExecutionPlan is the immutable preflight record. BUILDING plans expose
// progress; READY plans expire fifteen minutes after completion; FAILED plans
// preserve their non-secret diagnostic code for the retention interval.
message ExecutionPlan {
  string id = 1;
  string owner_account_id = 2;
  string combination_id = 3;
  string combination_name = 4;
  int64 combination_revision = 5;
  string state = 6;
  string build_stage = 7;
  string failure_code = 8;
  int64 wallet_count = 9;
  int64 item_count = 10;
  int64 total_step_count = 11;
  int64 completed_step_count = 12;
  int64 ready_step_count = 13;
  int64 skipped_step_count = 14;
  string total_collateral = 15;
  string total_opening_fee = 16;
  string total_user_funds_needed = 17;
  int64 requested_at = 18;
  int64 completed_at = 19;
  int64 expires_at = 20;
  int64 retention_until = 21;
  int64 created_at = 22;
  int64 updated_at = 23;
  repeated ExecutionPlanWallet wallets = 24;
  repeated ExecutionPlanItem items = 25;
  string usability_code = 26;
  repeated ExecutionPlanReasonCount reason_counts = 27;
  ExecutionPreflightChecks preflight_checks = 28;
  repeated ExecutionPlanReasonCount advisory_counts = 29;
}

message CreateExecutionPlanRequest {
  string owner_account_id = 1;
  string combination_id = 2;
  int64 expected_combination_revision = 3;
  repeated ExecutionPlanWalletInput wallets = 4;
  ExecutionPreflightChecks preflight_checks = 5;
}

message CreateExecutionPlanResponse {
  ExecutionPlan plan = 1;
}

message GetExecutionPlanRequest {
  string owner_account_id = 1;
  string id = 2;
}

message GetExecutionPlanResponse {
  ExecutionPlan plan = 1;
}

message ListExecutionPlanStepsRequest {
  string owner_account_id = 1;
  string id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListExecutionPlanStepsResponse {
  repeated ExecutionPlanStep items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ExecutionAuthorization is a non-secret authorization receipt bound to the
// immutable plan digest and caller access revision. Authorization has no time
// TTL; it remains valid until the run ends, it is revoked, or it is replaced
// by a new proof.
message ExecutionAuthorization {
  string id = 1;
  string state = 2;
  string scope = 3;
  string proof_kind = 4;
  bytes session_jti_digest = 5;
  int64 access_revision = 6;
  int64 plan_version = 7;
  bytes plan_digest_sha256 = 8;
  int64 authorized_at = 9;
  int64 ended_at = 10;
  string end_reason_code = 11;
}

// ExecutionCoordinator is the durable lease projection for the browser-led
// coordinator. The opaque coordinator token is returned only by Start/Resume
// and is never part of this persisted projection.
message ExecutionCoordinator {
  string id = 1;
  int64 generation = 2;
  string state = 3;
  int64 access_revision = 4;
  int64 acquired_at = 5;
  int64 heartbeat_at = 6;
  int64 lease_expires_at = 7;
  int64 released_at = 8;
}

message ExecutionMutationAttempt {
  string id = 1;
  string command_id = 2;
  string kind = 3;
  string state = 4;
  int64 position_request_id = 5;
  int32 http_status = 6;
  int32 provider_code = 7;
  string provider_slug = 8;
  string error_code = 9;
  int64 prepared_at = 10;
  int64 dispatched_at = 11;
  int64 completed_at = 12;
}

message ExecutionStepIsolation {
  string id = 1;
  int64 wallet_id = 2;
  string market_condition_id = 3;
  string reason_code = 4;
  int64 created_at = 5;
  int64 resolved_at = 6;
  string resolution_code = 7;
}

// ExecutionRunStep is one immutable plan step plus its durable live state.
// No JWT, wallet signature, or serialized transaction is stored in this
// projection. COMPLETED always means the provider was observed as completed.
message ExecutionRunStep {
  int64 ordinal = 1;
  int64 plan_step_ordinal = 2;
  int32 wallet_ordinal = 3;
  int32 item_ordinal = 4;
  string source_disposition = 5;
  string source_reason_code = 6;
  string projected_usdc_before = 7;
  string projected_usdc_after = 8;
  string state = 9;
  string reason_code = 10;
  int64 position_request_id = 11;
  string finalize_mode = 12;
  bytes transaction_message_sha256 = 13;
  string transaction_version = 14;
  int32 required_signature_count = 15;
  int32 wallet_signer_index = 16;
  string provider_state = 17;
  string provider_order_state = 18;
  string funding_txid = 19;
  string refund_txid = 20;
  int64 started_at = 21;
  int64 opened_at = 22;
  int64 finalized_at = 23;
  int64 last_observed_at = 24;
  int64 completed_at = 25;
  int64 created_at = 26;
  int64 updated_at = 27;
  repeated ExecutionMutationAttempt attempts = 28;
  ExecutionStepIsolation isolation = 29;
  int64 next_poll_at = 30;
  int32 poll_count = 31;
  string id = 32;
  repeated string advisory_codes = 33;
}

// ExecutionRun is the permanent, owner-scoped live execution record. Steps
// remain wallet-major and the source plan can be consumed by only one run.
message ExecutionRun {
  string id = 1;
  string owner_account_id = 2;
  string plan_id = 3;
  int64 plan_version = 4;
  bytes plan_digest_sha256 = 5;
  string combination_id = 6;
  string combination_name = 7;
  int64 combination_revision = 8;
  string state = 9;
  int64 revision = 10;
  int64 current_step_ordinal = 11;
  int64 wallet_count = 12;
  int64 item_count = 13;
  int64 total_step_count = 14;
  int64 actionable_step_count = 15;
  int64 terminal_step_count = 16;
  int64 completed_step_count = 17;
  int64 satisfied_step_count = 18;
  int64 skipped_step_count = 19;
  int64 failed_step_count = 20;
  int64 not_executed_step_count = 21;
  string pause_code = 22;
  string failure_code = 23;
  string block_code = 24;
  int64 requested_at = 25;
  int64 authorized_at = 26;
  int64 started_at = 27;
  int64 paused_at = 28;
  int64 completed_at = 29;
  int64 created_at = 30;
  int64 updated_at = 31;
  repeated ExecutionPlanWallet wallets = 32;
  repeated ExecutionPlanItem items = 33;
  ExecutionAuthorization authorization = 34;
  ExecutionCoordinator coordinator = 35;
  repeated string allowed_actions = 36;
  int64 next_step_ordinal = 37;
  ExecutionRunStep current_step = 38;
  ExecutionPreflightChecks preflight_checks = 39;
}

message CreateExecutionRunRequest {
  string owner_account_id = 1;
  string plan_id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
}

message CreateExecutionRunResponse {
  ExecutionRun run = 1;
}

message ListExecutionRunsRequest {
  string owner_account_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListExecutionRunsResponse {
  repeated ExecutionRun items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetExecutionRunRequest {
  string owner_account_id = 1;
  string id = 2;
}

message GetExecutionRunResponse {
  ExecutionRun run = 1;
}

message ListExecutionRunStepsRequest {
  string owner_account_id = 1;
  string id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListExecutionRunStepsResponse {
  repeated ExecutionRunStep items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AuthorizeExecutionRunRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
  string proof_kind = 5;
  bytes session_jti_digest = 6;
  int64 access_revision = 7;
}

message AuthorizeExecutionRunResponse {
  ExecutionRun run = 1;
}

message StartExecutionRunRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
  bytes session_jti_digest = 5;
  int64 access_revision = 6;
}

message StartExecutionRunResponse {
  ExecutionRun run = 1;
  bytes coordinator_token = 2;
}

message PauseExecutionRunRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
}

message PauseExecutionRunResponse {
  ExecutionRun run = 1;
}

message ResumeExecutionRunRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
  bytes session_jti_digest = 5;
  int64 access_revision = 6;
}

message ResumeExecutionRunResponse {
  ExecutionRun run = 1;
  bytes coordinator_token = 2;
}

message TerminateExecutionRunRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
}

message TerminateExecutionRunResponse {
  ExecutionRun run = 1;
}

message HeartbeatExecutionCoordinatorRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
  bytes coordinator_token = 5;
  bytes session_jti_digest = 6;
  int64 access_revision = 7;
}

message HeartbeatExecutionCoordinatorResponse {
  ExecutionRun run = 1;
}

message ExecuteNextExecutionStepRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
  bytes coordinator_token = 5;
  int64 expected_step_ordinal = 6;
  bytes session_jti_digest = 7;
  int64 access_revision = 8;
}

message ExecuteNextExecutionStepResponse {
  ExecutionRun run = 1;
  ExecutionRunStep step = 2;
}

message ReconcileExecutionStepRequest {
  string owner_account_id = 1;
  string id = 2;
  string command_id = 3;
  int64 expected_revision = 4;
  int64 expected_step_ordinal = 5;
  string step_id = 6;
}

message ReconcileExecutionStepResponse {
  ExecutionRun run = 1;
  ExecutionRunStep step = 2;
}

service WormTradingService {
  rpc GetWormTradingStatus(GetWormTradingStatusRequest) returns (GetWormTradingStatusResponse);
  rpc BatchGetWalletBalances(BatchGetWalletBalancesRequest) returns (BatchGetWalletBalancesResponse);
  rpc BatchGetWalletConnections(BatchGetWalletConnectionsRequest) returns (BatchGetWalletConnectionsResponse);
  rpc PrepareWormWalletConnection(PrepareWormWalletConnectionRequest) returns (PrepareWormWalletConnectionResponse);
  rpc CompleteWormWalletConnection(CompleteWormWalletConnectionRequest) returns (CompleteWormWalletConnectionResponse);
  rpc DisconnectWormWallet(DisconnectWormWalletRequest) returns (DisconnectWormWalletResponse);
  rpc BatchGetWalletPositionSnapshots(BatchGetWalletPositionSnapshotsRequest) returns (BatchGetWalletPositionSnapshotsResponse);
  rpc CreateMarketCombination(CreateMarketCombinationRequest) returns (CreateMarketCombinationResponse);
  rpc GetMarketCombination(GetMarketCombinationRequest) returns (GetMarketCombinationResponse);
  rpc ListMarketCombinations(ListMarketCombinationsRequest) returns (ListMarketCombinationsResponse);
  rpc UpdateMarketCombination(UpdateMarketCombinationRequest) returns (UpdateMarketCombinationResponse);
  rpc DeleteMarketCombination(DeleteMarketCombinationRequest) returns (DeleteMarketCombinationResponse);
  rpc CreateExecutionPlan(CreateExecutionPlanRequest) returns (CreateExecutionPlanResponse);
  rpc GetExecutionPlan(GetExecutionPlanRequest) returns (GetExecutionPlanResponse);
  rpc ListExecutionPlanSteps(ListExecutionPlanStepsRequest) returns (ListExecutionPlanStepsResponse);
  rpc CreateExecutionRun(CreateExecutionRunRequest) returns (CreateExecutionRunResponse);
  rpc ListExecutionRuns(ListExecutionRunsRequest) returns (ListExecutionRunsResponse);
  rpc GetExecutionRun(GetExecutionRunRequest) returns (GetExecutionRunResponse);
  rpc ListExecutionRunSteps(ListExecutionRunStepsRequest) returns (ListExecutionRunStepsResponse);
  rpc AuthorizeExecutionRun(AuthorizeExecutionRunRequest) returns (AuthorizeExecutionRunResponse);
  rpc StartExecutionRun(StartExecutionRunRequest) returns (StartExecutionRunResponse);
  rpc PauseExecutionRun(PauseExecutionRunRequest) returns (PauseExecutionRunResponse);
  rpc ResumeExecutionRun(ResumeExecutionRunRequest) returns (ResumeExecutionRunResponse);
  rpc TerminateExecutionRun(TerminateExecutionRunRequest) returns (TerminateExecutionRunResponse);
  rpc HeartbeatExecutionCoordinator(HeartbeatExecutionCoordinatorRequest) returns (HeartbeatExecutionCoordinatorResponse);
  rpc ExecuteNextExecutionStep(ExecuteNextExecutionStepRequest) returns (ExecuteNextExecutionStepResponse);
  rpc ReconcileExecutionStep(ReconcileExecutionStepRequest) returns (ReconcileExecutionStepResponse);
}
