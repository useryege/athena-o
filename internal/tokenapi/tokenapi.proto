syntax = "proto3";

// Token API Service exposes token intelligence data and administration operations.
package athena.internal.tokenapi;

import "github.com/useryege/athena/pkg/apis/application/v1alpha1/generated.proto";

option go_package = "github.com/useryege/athena/internal/tokenapi/apiclient";

message GetContractCodeBlocklistEntryRequest { string code_hash = 1; }
message GetContractCodeBlocklistEntryResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCodeBlocklistEntry entry = 2;
}
message ListContractCodeBlocklistEntriesRequest {}
message ListContractCodeBlocklistEntriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCodeBlocklistEntry entries = 1;
}
message CreateContractCodeBlocklistEntryRequest {
  string note = 1;
  int64 source_chain_id = 2;
  string source_contract = 3;
}
message CreateContractCodeBlocklistEntryResponse {}
message UpdateContractCodeBlocklistEntryRequest { string code_hash = 1; string note = 2; }
message UpdateContractCodeBlocklistEntryResponse { int64 updated_count = 1; }
message DeleteContractCodeBlocklistEntryRequest { string code_hash = 1; }
message DeleteContractCodeBlocklistEntryResponse { int64 deleted_count = 1; }

message GetWalletBlocklistEntryRequest { string wallet = 1; }
message GetWalletBlocklistEntryResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIWalletBlocklistEntry entry = 2;
}
message ListWalletBlocklistEntriesRequest {}
message ListWalletBlocklistEntriesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIWalletBlocklistEntry entries = 1;
}
message CreateWalletBlocklistEntryRequest { string wallet = 1; string note = 2; }
message CreateWalletBlocklistEntryResponse {}
message UpdateWalletBlocklistEntryRequest { string wallet = 1; string note = 2; }
message UpdateWalletBlocklistEntryResponse { int64 updated_count = 1; }
message DeleteWalletBlocklistEntryRequest { string wallet = 1; }
message DeleteWalletBlocklistEntryResponse { int64 deleted_count = 1; }

message GetOptionsRequest {}
message GetOptionsResponse {
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIOptions options = 1;
}
message ListNodeStatusesRequest {}
message ListNodeStatusesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPINodeStatus node_statuses = 1;
}

message GetChainIngestCheckpointRequest { int64 chain_id = 1; }
message GetChainIngestCheckpointResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoint = 2;
}
message ListChainIngestCheckpointsRequest {}
message ListChainIngestCheckpointsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoints = 1;
}
message UpdateChainIngestCheckpointRequest { int64 chain_id = 1; string status = 2; }
message UpdateChainIngestCheckpointResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIChainIngestCheckpoint checkpoint = 2;
}

message GetContractCodeRequest { string code_hash = 1; }
message GetContractCodeResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCode contract_code = 2;
}
message ListContractCodesRequest { string code_hash = 1; int32 page = 2; int32 page_size = 3; string order_by = 4; }
message ListContractCodesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIContractCode contract_codes = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListProjectsRequest { int64 chain_id = 1; string code_hash = 2; string contract = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProject projects = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// Compatibility-free latest report projection used by the existing reports page.
message ListProjectReportsRequest { int64 chain_id = 1; int64 project_id = 2; string contract = 3; string evaluation_status = 4; int32 page = 5; int32 page_size = 6; }
message ListProjectReportsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectReport project_reports = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetProjectDataCollectionTaskRequest { int64 task_id = 1; }
message GetProjectDataCollectionTaskResponse {
  bool found = 1;
  github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectDataCollectionTask task = 2;
}
message ListProjectDataCollectionTasksRequest { int64 project_id = 1; string data_type = 2; string status = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectDataCollectionTasksResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectDataCollectionTask tasks = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListProjectResearchStatesRequest { int64 project_id = 1; int64 chain_id = 2; string status = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectResearchStatesResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectResearchState research_states = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListProjectReportRevisionsRequest { int64 project_id = 1; int64 chain_id = 2; int32 page = 3; int32 page_size = 4; }
message ListProjectReportRevisionsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectReportRevision report_revisions = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListProjectSelectionsRequest { int64 project_id = 1; int64 chain_id = 2; string outcome = 3; int32 page = 4; int32 page_size = 5; }
message ListProjectSelectionsResponse {
  repeated github.com.useryege.athena.pkg.apis.application.v1alpha1.TokenAPIProjectSelection selections = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service TokenAPIService {
  rpc GetOptions(GetOptionsRequest) returns (GetOptionsResponse);
  rpc ListNodeStatuses(ListNodeStatusesRequest) returns (ListNodeStatusesResponse);
  rpc GetContractCodeBlocklistEntry(GetContractCodeBlocklistEntryRequest) returns (GetContractCodeBlocklistEntryResponse);
  rpc ListContractCodeBlocklistEntries(ListContractCodeBlocklistEntriesRequest) returns (ListContractCodeBlocklistEntriesResponse);
  rpc CreateContractCodeBlocklistEntry(CreateContractCodeBlocklistEntryRequest) returns (CreateContractCodeBlocklistEntryResponse);
  rpc UpdateContractCodeBlocklistEntry(UpdateContractCodeBlocklistEntryRequest) returns (UpdateContractCodeBlocklistEntryResponse);
  rpc DeleteContractCodeBlocklistEntry(DeleteContractCodeBlocklistEntryRequest) returns (DeleteContractCodeBlocklistEntryResponse);
  rpc GetWalletBlocklistEntry(GetWalletBlocklistEntryRequest) returns (GetWalletBlocklistEntryResponse);
  rpc ListWalletBlocklistEntries(ListWalletBlocklistEntriesRequest) returns (ListWalletBlocklistEntriesResponse);
  rpc CreateWalletBlocklistEntry(CreateWalletBlocklistEntryRequest) returns (CreateWalletBlocklistEntryResponse);
  rpc UpdateWalletBlocklistEntry(UpdateWalletBlocklistEntryRequest) returns (UpdateWalletBlocklistEntryResponse);
  rpc DeleteWalletBlocklistEntry(DeleteWalletBlocklistEntryRequest) returns (DeleteWalletBlocklistEntryResponse);
  rpc GetChainIngestCheckpoint(GetChainIngestCheckpointRequest) returns (GetChainIngestCheckpointResponse);
  rpc ListChainIngestCheckpoints(ListChainIngestCheckpointsRequest) returns (ListChainIngestCheckpointsResponse);
  rpc UpdateChainIngestCheckpoint(UpdateChainIngestCheckpointRequest) returns (UpdateChainIngestCheckpointResponse);
  rpc GetContractCode(GetContractCodeRequest) returns (GetContractCodeResponse);
  rpc ListContractCodes(ListContractCodesRequest) returns (ListContractCodesResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc ListProjectReports(ListProjectReportsRequest) returns (ListProjectReportsResponse);
  rpc GetProjectDataCollectionTask(GetProjectDataCollectionTaskRequest) returns (GetProjectDataCollectionTaskResponse);
  rpc ListProjectDataCollectionTasks(ListProjectDataCollectionTasksRequest) returns (ListProjectDataCollectionTasksResponse);
  rpc ListProjectResearchStates(ListProjectResearchStatesRequest) returns (ListProjectResearchStatesResponse);
  rpc ListProjectReportRevisions(ListProjectReportRevisionsRequest) returns (ListProjectReportRevisionsResponse);
  rpc ListProjectSelections(ListProjectSelectionsRequest) returns (ListProjectSelectionsResponse);
}
