syntax = "proto3";

// Token API Service API exposes token-api-level workload status.
package athena.internal.tokenapi;

option go_package = "github.com/useryege/athena/internal/tokenapi/apiclient";

// GetTokenAPIStatusRequest queries the token API service runtime status.
message GetTokenAPIStatusRequest {}

// GetTokenAPIStatusResponse returns the token API service runtime status.
message GetTokenAPIStatusResponse {
  bool started = 1;
  string status = 2;
}

message BytecodeBlacklist {
  string code_hash = 1;
  string note = 2;
  int64 source_chain_id = 3;
  string source_contract = 4;
  string created_at = 5;
}

message WalletBlacklist {
  string wallet = 1;
  string note = 2;
  string created_at = 3;
}

message ChainIngestCheckpoint {
  int64 chain_id = 1;
  string chain_name = 2;
  bool enabled = 3;
  uint64 cursor_block_number = 4;
  string status = 5;
  string created_at = 6;
}

message ContractCode {
  string code_hash = 1;
  string source_code = 2;
  string source_code_hash = 3;
  string source_code_fetched_at = 4;
  string created_at = 5;
}

message GetBytecodeBlacklistRequest {
  string code_hash = 1;
}

message GetBytecodeBlacklistResponse {
  bool found = 1;
  BytecodeBlacklist bytecode_blacklist = 2;
}

message ListBytecodeBlacklistsRequest {}

message ListBytecodeBlacklistsResponse {
  repeated BytecodeBlacklist bytecode_blacklists = 1;
}

message CreateBytecodeBlacklistRequest {
  string code_hash = 1;
  string note = 2;
  int64 source_chain_id = 3;
  string source_contract = 4;
}

message CreateBytecodeBlacklistResponse {}

message UpdateBytecodeBlacklistRequest {
  string code_hash = 1;
  string note = 2;
}

message UpdateBytecodeBlacklistResponse {
  int64 updated_count = 1;
}

message DeleteBytecodeBlacklistRequest {
  string code_hash = 1;
}

message DeleteBytecodeBlacklistResponse {
  int64 deleted_count = 1;
}

message GetWalletBlacklistRequest {
  string wallet = 1;
}

message GetWalletBlacklistResponse {
  bool found = 1;
  WalletBlacklist wallet_blacklist = 2;
}

message ListWalletBlacklistsRequest {}

message ListWalletBlacklistsResponse {
  repeated WalletBlacklist wallet_blacklists = 1;
}

message CreateWalletBlacklistRequest {
  string wallet = 1;
  string note = 2;
}

message CreateWalletBlacklistResponse {}

message UpdateWalletBlacklistRequest {
  string wallet = 1;
  string note = 2;
}

message UpdateWalletBlacklistResponse {
  int64 updated_count = 1;
}

message DeleteWalletBlacklistRequest {
  string wallet = 1;
}

message DeleteWalletBlacklistResponse {
  int64 deleted_count = 1;
}

message GetChainIngestCheckpointRequest {
  int64 chain_id = 1;
}

message GetChainIngestCheckpointResponse {
  bool found = 1;
  ChainIngestCheckpoint checkpoint = 2;
}

message ListChainIngestCheckpointsRequest {}

message ListChainIngestCheckpointsResponse {
  repeated ChainIngestCheckpoint checkpoints = 1;
}

message UpdateChainIngestCheckpointRequest {
  int64 chain_id = 1;
  string status = 2;
}

message UpdateChainIngestCheckpointResponse {
  bool found = 1;
  ChainIngestCheckpoint checkpoint = 2;
}

message GetContractCodeRequest {
  string code_hash = 1;
}

message GetContractCodeResponse {
  bool found = 1;
  ContractCode contract_code = 2;
}

message ListContractCodesRequest {
  string code_hash = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListContractCodesResponse {
  repeated ContractCode contract_codes = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DeleteContractCodeRequest {
  string code_hash = 1;
}

message DeleteContractCodeResponse {
  int64 deleted_count = 1;
}

service TokenAPIService {
  // GetTokenAPIStatus returns the token API service runtime status.
  rpc GetTokenAPIStatus(GetTokenAPIStatusRequest) returns (GetTokenAPIStatusResponse);
  rpc GetBytecodeBlacklist(GetBytecodeBlacklistRequest) returns (GetBytecodeBlacklistResponse);
  rpc ListBytecodeBlacklists(ListBytecodeBlacklistsRequest) returns (ListBytecodeBlacklistsResponse);
  rpc CreateBytecodeBlacklist(CreateBytecodeBlacklistRequest) returns (CreateBytecodeBlacklistResponse);
  rpc UpdateBytecodeBlacklist(UpdateBytecodeBlacklistRequest) returns (UpdateBytecodeBlacklistResponse);
  rpc DeleteBytecodeBlacklist(DeleteBytecodeBlacklistRequest) returns (DeleteBytecodeBlacklistResponse);
  rpc GetWalletBlacklist(GetWalletBlacklistRequest) returns (GetWalletBlacklistResponse);
  rpc ListWalletBlacklists(ListWalletBlacklistsRequest) returns (ListWalletBlacklistsResponse);
  rpc CreateWalletBlacklist(CreateWalletBlacklistRequest) returns (CreateWalletBlacklistResponse);
  rpc UpdateWalletBlacklist(UpdateWalletBlacklistRequest) returns (UpdateWalletBlacklistResponse);
  rpc DeleteWalletBlacklist(DeleteWalletBlacklistRequest) returns (DeleteWalletBlacklistResponse);
  rpc GetChainIngestCheckpoint(GetChainIngestCheckpointRequest) returns (GetChainIngestCheckpointResponse);
  rpc ListChainIngestCheckpoints(ListChainIngestCheckpointsRequest) returns (ListChainIngestCheckpointsResponse);
  rpc UpdateChainIngestCheckpoint(UpdateChainIngestCheckpointRequest) returns (UpdateChainIngestCheckpointResponse);
  rpc GetContractCode(GetContractCodeRequest) returns (GetContractCodeResponse);
  rpc ListContractCodes(ListContractCodesRequest) returns (ListContractCodesResponse);
  rpc DeleteContractCode(DeleteContractCodeRequest) returns (DeleteContractCodeResponse);
}
