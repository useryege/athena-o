syntax = "proto3";

package blocksniffer;

option go_package = "github.com/useryege/athena/internal/blocksniffer/apiclient";

service BlockSnifferService {
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message SubscribeRequest {
  string chain_id = 1;
}

message SubscribeResponse {
  string block_hash = 1;
}
