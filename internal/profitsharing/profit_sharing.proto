syntax = "proto3";

// Profit Sharing Service API manages reusable multi-round proposals and ballots.
package athena.internal.profitsharing;

option go_package = "github.com/useryege/athena/internal/profitsharing/apiclient";

enum RoundPhase {
  ROUND_PHASE_UNSPECIFIED = 0;
  ROUND_PHASE_DRAFT = 1;
  ROUND_PHASE_COLLECTING = 2;
  ROUND_PHASE_VOTING = 3;
  ROUND_PHASE_CLOSED = 4;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_DRAFT = 1;
  PROPOSAL_STATUS_SUBMITTED = 2;
}

message ParticipantInput {
  string account_id = 1;
  string username = 2;
  string display_name = 3;
  int32 display_order = 4;
  string baseline_responsibility = 5;
}

message Participant {
  string account_id = 1;
  string username = 2;
  string display_name = 3;
  int32 display_order = 4;
  string baseline_responsibility = 5;
  bool proposal_progress_visible = 6;
  bool submitted = 7;
}

message ProposalItemInput {
  string participant_account_id = 1;
  string responsibility = 2;
  int32 basis_points = 3;
  bool basis_points_set = 4;
}

message ProposalItem {
  string participant_account_id = 1;
  string participant_username = 2;
  string participant_display_name = 3;
  int32 participant_display_order = 4;
  string responsibility = 5;
  int32 basis_points = 6;
  bool basis_points_set = 7;
}

message Proposal {
  string id = 1;
  string label = 2;
  ProposalStatus status = 3;
  int64 revision = 4;
  string author_account_id = 5;
  string author_username = 6;
  string author_display_name = 7;
  bool is_own = 8;
  repeated ProposalItem items = 9;
  bool vote_count_visible = 10;
  int64 vote_count = 11;
  bool is_final = 12;
}

message Ballot {
  int32 number = 1;
  repeated Proposal candidates = 2;
  int64 voted_count = 3;
  int32 participant_count = 4;
  string current_vote_proposal_id = 5;
}

message RoundSummary {
  string slug = 1;
  string title = 2;
  RoundPhase phase = 3;
  int64 revision = 4;
  int32 participant_count = 5;
  int64 submitted_count = 6;
  int32 active_ballot_number = 7;
  int64 voted_count = 8;
  int64 created_at_unix = 9;
  int64 updated_at_unix = 10;
}

message Round {
  RoundSummary summary = 1;
  repeated Participant participants = 2;
  Proposal own_proposal = 3;
  Ballot active_ballot = 4;
  string final_proposal_id = 5;
  int64 opened_at_unix = 6;
  int64 published_at_unix = 7;
  int64 closed_at_unix = 8;
}

message ListRoundsRequest {
  string requester_account_id = 1;
  bool requester_is_admin = 2;
}

message ListRoundsResponse {
  repeated RoundSummary rounds = 1;
}

message GetRoundRequest {
  string slug = 1;
  string requester_account_id = 2;
  bool requester_is_admin = 3;
}

message GetRoundResponse {
  Round round = 1;
}

message CreateRoundRequest {
  string slug = 1;
  string title = 2;
  repeated ParticipantInput participants = 3;
  string requester_account_id = 4;
  bool requester_is_admin = 5;
}

message CreateRoundResponse {
  Round round = 1;
}

message UpdateRoundRequest {
  string current_slug = 1;
  string slug = 2;
  string title = 3;
  repeated ParticipantInput participants = 4;
  int64 expected_revision = 5;
  string requester_account_id = 6;
  bool requester_is_admin = 7;
}

message UpdateRoundResponse {
  Round round = 1;
}

message OpenRoundRequest {
  string slug = 1;
  int64 expected_revision = 2;
  string requester_account_id = 3;
  bool requester_is_admin = 4;
  repeated string validated_participant_account_ids = 5;
}

message OpenRoundResponse {
  Round round = 1;
}

message PublishRoundRequest {
  string slug = 1;
  int64 expected_revision = 2;
  string requester_account_id = 3;
  bool requester_is_admin = 4;
}

message PublishRoundResponse {
  Round round = 1;
}

message CloseBallotRequest {
  string slug = 1;
  int64 expected_revision = 2;
  string requester_account_id = 3;
  bool requester_is_admin = 4;
}

message CloseBallotResponse {
  Round round = 1;
  bool runoff_created = 2;
}

message UpdateProposalRequest {
  string slug = 1;
  int64 expected_revision = 2;
  repeated ProposalItemInput items = 3;
  string requester_account_id = 4;
  bool requester_is_admin = 5;
}

message UpdateProposalResponse {
  Proposal proposal = 1;
}

message SubmitProposalRequest {
  string slug = 1;
  int64 expected_revision = 2;
  string requester_account_id = 3;
  bool requester_is_admin = 4;
}

message SubmitProposalResponse {
  Proposal proposal = 1;
}

message ReopenProposalRequest {
  string slug = 1;
  int64 expected_revision = 2;
  string requester_account_id = 3;
  bool requester_is_admin = 4;
}

message ReopenProposalResponse {
  Proposal proposal = 1;
}

message SubmitVoteRequest {
  string slug = 1;
  int32 ballot_number = 2;
  string proposal_id = 3;
  string requester_account_id = 4;
  bool requester_is_admin = 5;
}

message SubmitVoteResponse {
  string proposal_id = 1;
  int32 ballot_number = 2;
}

service ProfitSharingService {
  rpc ListRounds(ListRoundsRequest) returns (ListRoundsResponse);
  rpc GetRound(GetRoundRequest) returns (GetRoundResponse);
  rpc CreateRound(CreateRoundRequest) returns (CreateRoundResponse);
  rpc UpdateRound(UpdateRoundRequest) returns (UpdateRoundResponse);
  rpc OpenRound(OpenRoundRequest) returns (OpenRoundResponse);
  rpc PublishRound(PublishRoundRequest) returns (PublishRoundResponse);
  rpc CloseBallot(CloseBallotRequest) returns (CloseBallotResponse);
  rpc UpdateProposal(UpdateProposalRequest) returns (UpdateProposalResponse);
  rpc SubmitProposal(SubmitProposalRequest) returns (SubmitProposalResponse);
  rpc ReopenProposal(ReopenProposalRequest) returns (ReopenProposalResponse);
  rpc SubmitVote(SubmitVoteRequest) returns (SubmitVoteResponse);
}
