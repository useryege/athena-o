syntax = "proto3";

// BSC Inbound Transaction Service exposes finalized, direct BNB funding
// transactions indexed from BNB Smart Chain Mainnet.
package athena.internal.bscinbound;

option go_package = "github.com/useryege/athena/internal/bscinbound/apiclient";

// InboundNormalTransaction is one successful finalized direct BNB transfer.
message InboundNormalTransaction {
  uint64 block_number = 1;
  string block_hash = 2;
  uint64 block_timestamp = 3;
  string transaction_hash = 4;
  uint64 transaction_index = 5;
  string from_address = 6;
  string to_address = 7;
  string value_wei = 8;
}

// ListInboundNormalTransactionsRequest lists direct BNB transfers received by
// one address, newest first.
message ListInboundNormalTransactionsRequest {
  string address = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// ListInboundNormalTransactionsResponse returns one stable keyset page and the
// scanner position that bounds the available data.
message ListInboundNormalTransactionsResponse {
  repeated InboundNormalTransaction transactions = 1;
  string next_page_token = 2;
  uint64 indexed_through_block = 3;
  uint64 indexed_through_timestamp = 4;
}

service BscInboundTransactionService {
  // ListInboundNormalTransactions returns finalized direct BNB transfers
  // received by one address.
  rpc ListInboundNormalTransactions(ListInboundNormalTransactionsRequest) returns (ListInboundNormalTransactionsResponse);
}
