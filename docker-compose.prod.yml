      ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN: ${ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN:?ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN is required}
