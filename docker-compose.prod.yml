x-token-worker: &token-worker
  image: ${PROD_IMAGE:-athena:local}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  env_file:
    - .env
  command: ["athena"]

x-token-worker-environment: &token-worker-environment
  ATHENA_POSTGRES_AUTO_MIGRATE: "false"
  ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
  ATHENA_TOKEN_CHAINS_JSON: ${ATHENA_TOKEN_CHAINS_JSON:?ATHENA_TOKEN_CHAINS_JSON is required}

services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hack/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  athena-worm:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-worm
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm sslmode=disable
      ATHENA_WORM_NOTIFICATION_ENABLED: "true"
      ATHENA_WORM_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
    command: ["athena", "--port", "8084"]
    expose:
      - "8084"

  athena-polymarket:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-polymarket
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_POLYMARKET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_POLYMARKET_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_POLYMARKET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=polymarket sslmode=disable
    command: ["athena", "--port", "8092"]
    expose:
      - "8092"

  athena-worm-poly:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-worm:
        condition: service_started
      athena-wallet:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-worm-poly
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_POLY_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_POLY_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wormpoly sslmode=disable
      ATHENA_WORM_POLY_WORM_SERVER_ADDRESS: athena-worm:8084
      ATHENA_WORM_POLY_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WORM_POLY_POLYGON_RPC_URL: ${ATHENA_WORM_POLY_POLYGON_RPC_URL:-https://polygon-rpc.com}
      ATHENA_WORM_POLY_SOLANA_RPC_URL: ${ATHENA_WORM_POLY_SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
    command: ["athena", "--port", "8090"]
    expose:
      - "8090"

  athena-notification:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-notification
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_NOTIFICATION_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
      ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID: ${ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID:?ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID is required}
      ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID: ${ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID:?ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID is required}
    command: ["athena", "--port", "8086"]
    expose:
      - "8086"

  athena-wallet:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-wallet
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WALLET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WALLET_ENCRYPTION_KEY: ${ATHENA_WALLET_ENCRYPTION_KEY:?ATHENA_WALLET_ENCRYPTION_KEY is required}
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
    command: ["athena", "--port", "8088"]
    expose:
      - "8088"

  athena-token-api:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-token-api
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_TOKEN_API_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
      ATHENA_TOKEN_CHAINS_JSON: ${ATHENA_TOKEN_CHAINS_JSON:?ATHENA_TOKEN_CHAINS_JSON is required}
    command: ["athena", "--port", "8096"]
    expose:
      - "8096"

  athena-ethereum-api:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-ethereum-api
      ATHENA_ETHEREUM_API_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_ETHEREUM_API_ETHERSCAN_API_KEYS: ${ATHENA_ETHEREUM_API_ETHERSCAN_API_KEYS:?ATHENA_ETHEREUM_API_ETHERSCAN_API_KEYS is required}
      ATHENA_ETHEREUM_API_ETHERSCAN_GATEWAY_ADDRS: ${ATHENA_ETHEREUM_API_ETHERSCAN_GATEWAY_ADDRS:?ATHENA_ETHEREUM_API_ETHERSCAN_GATEWAY_ADDRS is required}
      ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN: ${ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN:?ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN is required}
    command: ["athena", "--port", "8100"]
    expose:
      - "8100"

  athena-token-scanner:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-scanner
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8110
    expose: ["8110"]

  athena-token-validator:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-validator
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8111
    expose: ["8111"]

  athena-token-scheduler:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-scheduler
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8112
    expose: ["8112"]

  athena-token-collector-ave:
    <<: *token-worker
    command: ["athena", "--data-type", "ave"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: ave
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8113
    expose: ["8113"]

  athena-token-collector-chain-state:
    <<: *token-worker
    command: ["athena", "--data-type", "chain_state"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: chain_state
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8114
    expose: ["8114"]

  athena-token-collector-wallet-asset-state:
    <<: *token-worker
    command: ["athena", "--data-type", "wallet_asset_state"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: wallet_asset_state
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8115
    expose: ["8115"]

  athena-token-collector-wallet-funding-source-history:
    <<: *token-worker
    command: ["athena", "--data-type", "wallet_funding_source_history"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: wallet_funding_source_history
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8120
      ATHENA_TOKEN_BSC_INBOUND_SERVER_ADDRESS: ${ATHENA_TOKEN_BSC_INBOUND_SERVER_ADDRESS:?ATHENA_TOKEN_BSC_INBOUND_SERVER_ADDRESS is required}
    expose: ["8120"]

  athena-token-collector-simulation-result:
    <<: *token-worker
    command: ["athena", "--data-type", "simulation_result"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: simulation_result
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8116
    expose: ["8116"]

  athena-token-collector-contract-code-source:
    <<: *token-worker
    command: ["athena", "--data-type", "contract_code_source"]
    depends_on:
      postgres:
        condition: service_healthy
      athena-ethereum-api:
        condition: service_started
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: contract_code_source
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8117
      ATHENA_TOKEN_ETHEREUM_API_SERVER_ADDRESS: athena-ethereum-api:8100
    expose: ["8117"]

  athena-token-report-builder:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-report-builder
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8118
    expose: ["8118"]

  athena-token-selector:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-selector
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8119
    expose: ["8119"]

  athena-migrate:
    image: ${PROD_IMAGE:-athena:local}
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-migrate
      ATHENA_WORM_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm sslmode=disable
      ATHENA_WORM_POLY_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wormpoly sslmode=disable
      ATHENA_POLYMARKET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=polymarket sslmode=disable
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena", "status", "--module", "all"]

  athena-server:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      athena-notification:
        condition: service_started
      athena-wallet:
        condition: service_started
      athena-worm:
        condition: service_started
      athena-worm-poly:
        condition: service_started
      athena-polymarket:
        condition: service_started
      athena-token-api:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-server
      ATHENA_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WORM_SERVER_ADDRESS: athena-worm:8084
      ATHENA_WORM_POLY_SERVER_ADDRESS: athena-worm-poly:8090
      ATHENA_POLYMARKET_SERVER_ADDRESS: athena-polymarket:8092
      ATHENA_TOKEN_API_SERVER_ADDRESS: athena-token-api:8096
      ATHENA_SERVER_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SERVER_DISABLE_AUTH: ${ATHENA_SERVER_DISABLE_AUTH:-false}
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8080"]
    ports:
      - "${ATHENA_SERVER_BIND_ADDR:-127.0.0.1}:${ATHENA_SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
    name: ${PROD_POSTGRES_VOLUME:-athena-prod-postgres-data}
    external: true
