x-token-worker: &token-worker
  image: ${PROD_IMAGE:-athena:local}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  env_file:
    - ${ATHENA_COMPOSE_ENV_FILE:-.env}
  command: ["athena"]

x-token-chain-environment: &token-chain-environment
  ATHENA_TOKEN_ETH_ENABLED: ${ATHENA_TOKEN_ETH_ENABLED:?ATHENA_TOKEN_ETH_ENABLED is required}
  ATHENA_TOKEN_ETH_NODE_WS_URLS: ${ATHENA_TOKEN_ETH_NODE_WS_URLS:?ATHENA_TOKEN_ETH_NODE_WS_URLS is required}
  ATHENA_TOKEN_ETH_ATHENA_CONTRACT: ${ATHENA_TOKEN_ETH_ATHENA_CONTRACT:?ATHENA_TOKEN_ETH_ATHENA_CONTRACT is required}
  ATHENA_TOKEN_ETH_PROCESSOR_INITIAL_LOOKBACK_DURATION: ${ATHENA_TOKEN_ETH_PROCESSOR_INITIAL_LOOKBACK_DURATION:?ATHENA_TOKEN_ETH_PROCESSOR_INITIAL_LOOKBACK_DURATION is required}
  ATHENA_TOKEN_ETH_PROCESSOR_POLL_INTERVAL: ${ATHENA_TOKEN_ETH_PROCESSOR_POLL_INTERVAL:?ATHENA_TOKEN_ETH_PROCESSOR_POLL_INTERVAL is required}
  ATHENA_TOKEN_ETH_SWAP_POLL_INTERVAL: ${ATHENA_TOKEN_ETH_SWAP_POLL_INTERVAL:?ATHENA_TOKEN_ETH_SWAP_POLL_INTERVAL is required}
  ATHENA_TOKEN_BSC_ENABLED: ${ATHENA_TOKEN_BSC_ENABLED:?ATHENA_TOKEN_BSC_ENABLED is required}
  ATHENA_TOKEN_BSC_NODE_WS_URLS: ${ATHENA_TOKEN_BSC_NODE_WS_URLS:?ATHENA_TOKEN_BSC_NODE_WS_URLS is required}
  ATHENA_TOKEN_BSC_ATHENA_CONTRACT: ${ATHENA_TOKEN_BSC_ATHENA_CONTRACT:?ATHENA_TOKEN_BSC_ATHENA_CONTRACT is required}
  ATHENA_TOKEN_BSC_PROCESSOR_INITIAL_LOOKBACK_DURATION: ${ATHENA_TOKEN_BSC_PROCESSOR_INITIAL_LOOKBACK_DURATION:?ATHENA_TOKEN_BSC_PROCESSOR_INITIAL_LOOKBACK_DURATION is required}
  ATHENA_TOKEN_BSC_PROCESSOR_POLL_INTERVAL: ${ATHENA_TOKEN_BSC_PROCESSOR_POLL_INTERVAL:?ATHENA_TOKEN_BSC_PROCESSOR_POLL_INTERVAL is required}
  ATHENA_TOKEN_BSC_SWAP_POLL_INTERVAL: ${ATHENA_TOKEN_BSC_SWAP_POLL_INTERVAL:?ATHENA_TOKEN_BSC_SWAP_POLL_INTERVAL is required}

x-without-auth-secrets: &without-auth-secrets
  ATHENA_JWT_SECRET: ""
  ATHENA_JWT_SECRET_FILE: ""
  ATHENA_GOOGLE_OIDC_CLIENT_ID: ""
  ATHENA_GOOGLE_OIDC_CLIENT_SECRET: ""
  ATHENA_GOOGLE_OIDC_CLIENT_SECRET_FILE: ""
  ATHENA_GOOGLE_OIDC_REDIRECT_URI: ""
  ATHENA_ADMIN_GOOGLE_EMAIL: ""
  ATHENA_WALLET_ENCRYPTION_KEY: ""
  ATHENA_WALLET_INTERNAL_AUTH_TOKEN: ""
  ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ""
  ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ""
  ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN: ""
  ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID: ""
  ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID: ""
  ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN: ""
  ATHENA_WORM_TRADING_SOLANA_RPC_URL: ""
  ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY: ""
  ATHENA_WORM_TRADING_POSTGRES_DSN: ""
  REDIS_SERVER: ""
  REDIS_PASSWORD: ""

x-token-worker-environment: &token-worker-environment
  <<: [*token-chain-environment, *without-auth-secrets]
  ATHENA_POSTGRES_AUTO_MIGRATE: "false"
  ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable

services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hack/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-athena-minio:9e49d5e7a648}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-athena-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_REGION_NAME: ${ATHENA_ACCOUNT_AVATAR_S3_REGION:-us-east-1}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE:-athena-minio-mc:7394ce0dd2a8}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-athena-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ATHENA_ACCOUNT_AVATAR_S3_BUCKET: ${ATHENA_ACCOUNT_AVATAR_S3_BUCKET:-athena-account-avatars}
      ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID: ${ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID:?ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID is required}
      ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY: ${ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY:?ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY is required}

  athena-worm-markets:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-worm-markets
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_MARKETS_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_MARKETS_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_markets sslmode=disable
      ATHENA_WORM_MARKETS_NOTIFICATION_ENABLED: "true"
      ATHENA_WORM_MARKETS_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
    command: ["athena", "--port", "8084"]
    expose:
      - "8084"

  athena-worm-trading:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-worm-markets:
        condition: service_started
      athena-wallet:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-worm-trading
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_TRADING_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN: ${ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN:?ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ${ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN:?ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN is required}
      ATHENA_WORM_TRADING_SOLANA_RPC_URL: ${ATHENA_WORM_TRADING_SOLANA_RPC_URL:?ATHENA_WORM_TRADING_SOLANA_RPC_URL is required}
      ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY: ${ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY:?ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY is required}
      ATHENA_WORM_TRADING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_trading sslmode=disable
      ATHENA_WORM_MARKETS_SERVER_ADDRESS: athena-worm-markets:8084
    command: ["athena", "--port", "8090"]
    expose:
      - "8090"

  athena-market-radar:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      athena-notification:
        condition: service_started
    env_file:
