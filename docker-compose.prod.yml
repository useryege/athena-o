      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-selector
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8119
    expose: ["8119"]

  athena-migrate:
    image: ${PROD_IMAGE:-athena:local}
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-migrate
      ATHENA_SERVER_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=athena sslmode=disable
      ATHENA_WORM_MARKETS_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_markets sslmode=disable
      ATHENA_WORM_TRADING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_trading sslmode=disable
      ATHENA_SPORTS_LIVE_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=sports_live sslmode=disable
      ATHENA_SPORTS_HISTORY_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=sports_history sslmode=disable
      ATHENA_MANAGED_OO_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=managed_oo sslmode=disable
      ATHENA_PROFIT_SHARING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=profit_sharing sslmode=disable
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena", "status", "--module", "all"]

  athena-server:
    image: ${PROD_IMAGE:-athena:local}
    user: ${ATHENA_SERVER_CONTAINER_USER:-999:999}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      athena-notification:
        condition: service_started
      athena-wallet:
        condition: service_started
      athena-worm-markets:
        condition: service_started
      athena-worm-trading:
        condition: service_started
      athena-market-radar:
        condition: service_started
      athena-sports-live:
        condition: service_started
      athena-sports-history:
        condition: service_started
      athena-managed-oo:
        condition: service_started
      athena-profit-sharing:
        condition: service_started
      athena-token-api:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    secrets:
      - google-oidc-client-secret
    environment:
      ATHENA_BINARY_NAME: athena-server
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_SERVER_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=athena sslmode=disable
      ATHENA_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
      ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN: ""
      ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID: ""
      ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID: ""
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WALLET_INTERNAL_AUTH_TOKEN: ${ATHENA_WALLET_INTERNAL_AUTH_TOKEN:?ATHENA_WALLET_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ""
      ATHENA_WORM_MARKETS_SERVER_ADDRESS: athena-worm-markets:8084
      ATHENA_WORM_TRADING_SERVER_ADDRESS: athena-worm-trading:8090
      ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN: ${ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN:?ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WORM_TRADING_SOLANA_RPC_URL: ""
      ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY: ""
      ATHENA_WORM_TRADING_POSTGRES_DSN: ""
      ATHENA_MARKET_RADAR_SERVER_ADDRESS: athena-market-radar:8092
      ATHENA_SPORTS_LIVE_SERVER_ADDRESS: athena-sports-live:8094
      ATHENA_SPORTS_HISTORY_SERVER_ADDRESS: athena-sports-history:8104
      ATHENA_MANAGED_OO_SERVER_ADDRESS: athena-managed-oo:8106
      ATHENA_PROFIT_SHARING_SERVER_ADDRESS: athena-profit-sharing:8108
      ATHENA_TOKEN_API_SERVER_ADDRESS: athena-token-api:8096
      ATHENA_SERVER_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SERVER_DISABLE_AUTH: "false"
      ATHENA_JWT_SECRET: ${ATHENA_JWT_SECRET:?ATHENA_JWT_SECRET is required}
      ATHENA_JWT_SECRET_FILE: ""
      ATHENA_GOOGLE_OIDC_CLIENT_ID: ${ATHENA_GOOGLE_OIDC_CLIENT_ID:-}
      ATHENA_GOOGLE_OIDC_CLIENT_SECRET: ""
      ATHENA_GOOGLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/google-oidc-client-secret
      ATHENA_GOOGLE_OIDC_REDIRECT_URI: ${ATHENA_GOOGLE_OIDC_REDIRECT_URI:-}
      ATHENA_ADMIN_GOOGLE_EMAIL: ${ATHENA_ADMIN_GOOGLE_EMAIL:?ATHENA_ADMIN_GOOGLE_EMAIL is required}
      ATHENA_ACCOUNT_AVATAR_S3_ENDPOINT: http://minio:9000
      ATHENA_ACCOUNT_AVATAR_S3_REGION: ${ATHENA_ACCOUNT_AVATAR_S3_REGION:-us-east-1}
      ATHENA_ACCOUNT_AVATAR_S3_BUCKET: ${ATHENA_ACCOUNT_AVATAR_S3_BUCKET:-athena-account-avatars}
      ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID: ${ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID:?ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID is required}
      ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY: ${ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY:?ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY is required}
      ATHENA_ACCOUNT_AVATAR_S3_PATH_STYLE: "true"
      ATHENA_ACCOUNT_AVATAR_MAX_BYTES: ${ATHENA_ACCOUNT_AVATAR_MAX_BYTES:-2097152}
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8080"]
    ports:
      - "${ATHENA_SERVER_BIND_ADDR:-127.0.0.1}:${ATHENA_SERVER_PORT:-8080}:8080"

secrets:
  google-oidc-client-secret:
    file: ${ATHENA_GOOGLE_OIDC_CLIENT_SECRET_FILE:-/dev/null}

volumes:
  postgres-data:
    name: ${PROD_POSTGRES_VOLUME:-athena-prod-postgres-data}
    external: true
  redis-data:
    name: ${PROD_REDIS_VOLUME:-athena-prod-redis-data}
    external: true
  minio-data:
    name: ${PROD_MINIO_VOLUME:-athena-prod-minio-data}
    external: true
