x-token-worker: &token-worker
  image: ${PROD_IMAGE:-athena:local}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  env_file:
    - ${ATHENA_COMPOSE_ENV_FILE:-.env}
  command: ["athena"]

x-token-chain-environment: &token-chain-environment
  ATHENA_TOKEN_ETH_ENABLED: ${ATHENA_TOKEN_ETH_ENABLED:?ATHENA_TOKEN_ETH_ENABLED is required}
  ATHENA_TOKEN_ETH_NODE_WS_URLS: ${ATHENA_TOKEN_ETH_NODE_WS_URLS:?ATHENA_TOKEN_ETH_NODE_WS_URLS is required}
  ATHENA_TOKEN_ETH_ATHENA_CONTRACT: ${ATHENA_TOKEN_ETH_ATHENA_CONTRACT:?ATHENA_TOKEN_ETH_ATHENA_CONTRACT is required}
  ATHENA_TOKEN_ETH_PROCESSOR_INITIAL_LOOKBACK_DURATION: ${ATHENA_TOKEN_ETH_PROCESSOR_INITIAL_LOOKBACK_DURATION:?ATHENA_TOKEN_ETH_PROCESSOR_INITIAL_LOOKBACK_DURATION is required}
  ATHENA_TOKEN_ETH_PROCESSOR_POLL_INTERVAL: ${ATHENA_TOKEN_ETH_PROCESSOR_POLL_INTERVAL:?ATHENA_TOKEN_ETH_PROCESSOR_POLL_INTERVAL is required}
  ATHENA_TOKEN_BSC_ENABLED: ${ATHENA_TOKEN_BSC_ENABLED:?ATHENA_TOKEN_BSC_ENABLED is required}
  ATHENA_TOKEN_BSC_NODE_WS_URLS: ${ATHENA_TOKEN_BSC_NODE_WS_URLS:?ATHENA_TOKEN_BSC_NODE_WS_URLS is required}
  ATHENA_TOKEN_BSC_ATHENA_CONTRACT: ${ATHENA_TOKEN_BSC_ATHENA_CONTRACT:?ATHENA_TOKEN_BSC_ATHENA_CONTRACT is required}
  ATHENA_TOKEN_BSC_PROCESSOR_INITIAL_LOOKBACK_DURATION: ${ATHENA_TOKEN_BSC_PROCESSOR_INITIAL_LOOKBACK_DURATION:?ATHENA_TOKEN_BSC_PROCESSOR_INITIAL_LOOKBACK_DURATION is required}
  ATHENA_TOKEN_BSC_PROCESSOR_POLL_INTERVAL: ${ATHENA_TOKEN_BSC_PROCESSOR_POLL_INTERVAL:?ATHENA_TOKEN_BSC_PROCESSOR_POLL_INTERVAL is required}

x-without-auth-secrets: &without-auth-secrets
  ATHENA_JWT_SECRET: ""
  ATHENA_JWT_SECRET_FILE: ""
  ATHENA_GOOGLE_OIDC_CLIENT_ID: ""
  ATHENA_GOOGLE_OIDC_CLIENT_SECRET: ""
  ATHENA_GOOGLE_OIDC_CLIENT_SECRET_FILE: ""
  ATHENA_GOOGLE_OIDC_REDIRECT_URI: ""
  ATHENA_ADMIN_GOOGLE_EMAIL: ""
  ATHENA_WALLET_ENCRYPTION_KEY: ""
  ATHENA_WALLET_INTERNAL_AUTH_TOKEN: ""
  ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ""
  ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ""
  ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN: ""
  ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID: ""
  ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID: ""
  ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN: ""
  ATHENA_WORM_TRADING_SOLANA_RPC_URL: ""
  ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY: ""
  ATHENA_WORM_TRADING_POSTGRES_DSN: ""
  REDIS_SERVER: ""
  REDIS_PASSWORD: ""

x-token-worker-environment: &token-worker-environment
  <<: [*token-chain-environment, *without-auth-secrets]
  ATHENA_POSTGRES_AUTO_MIGRATE: "false"
  ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable

services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hack/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-athena-minio:9e49d5e7a648-go1.27.1}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-athena-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_REGION_NAME: ${ATHENA_ACCOUNT_AVATAR_S3_REGION:-us-east-1}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE:-athena-minio-mc:7394ce0dd2a8-go1.27.1}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-athena-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      ATHENA_ACCOUNT_AVATAR_S3_BUCKET: ${ATHENA_ACCOUNT_AVATAR_S3_BUCKET:-athena-account-avatars}
      ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID: ${ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID:?ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID is required}
      ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY: ${ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY:?ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY is required}

  athena-worm-markets:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-worm-markets
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_MARKETS_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_MARKETS_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_markets sslmode=disable
      ATHENA_WORM_MARKETS_NOTIFICATION_ENABLED: "true"
      ATHENA_WORM_MARKETS_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
    command: ["athena", "--port", "8084"]
    expose:
      - "8084"

  athena-worm-trading:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-worm-markets:
        condition: service_started
      athena-wallet:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-worm-trading
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_TRADING_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN: ${ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN:?ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ${ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN:?ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN is required}
      ATHENA_WORM_TRADING_SOLANA_RPC_URL: ${ATHENA_WORM_TRADING_SOLANA_RPC_URL:?ATHENA_WORM_TRADING_SOLANA_RPC_URL is required}
      ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY: ${ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY:?ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY is required}
      ATHENA_WORM_TRADING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_trading sslmode=disable
      ATHENA_WORM_MARKETS_SERVER_ADDRESS: athena-worm-markets:8084
    command: ["athena", "--port", "8090"]
    expose:
      - "8090"

  athena-market-radar:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      athena-notification:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-market-radar
      ATHENA_MARKET_RADAR_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_MARKET_RADAR_NOTIFICATION_ENABLED: "true"
      ATHENA_MARKET_RADAR_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
    command: ["athena", "--port", "8092"]
    expose:
      - "8092"

  athena-sports-live:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-sports-live
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_SPORTS_LIVE_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SPORTS_LIVE_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=sports_live sslmode=disable
      ATHENA_SPORTS_LIVE_NOTIFICATION_ENABLED: "true"
      ATHENA_SPORTS_LIVE_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
    command: ["athena", "--port", "8094"]
    expose:
      - "8094"

  athena-sports-history:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-sports-history
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_SPORTS_HISTORY_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SPORTS_HISTORY_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=sports_history sslmode=disable
    command: ["athena", "--port", "8104"]
    expose:
      - "8104"

  athena-managed-oo:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-managed-oo
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_MANAGED_OO_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_MANAGED_OO_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=managed_oo sslmode=disable
      ATHENA_MANAGED_OO_NOTIFICATION_ENABLED: "true"
      ATHENA_MANAGED_OO_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
      ATHENA_MANAGED_OO_POLYGON_RPC_URL: ${ATHENA_MANAGED_OO_POLYGON_RPC_URL:-https://polygon-rpc.com}
    command: ["athena", "--port", "8106"]
    expose:
      - "8106"

  athena-profit-sharing:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-profit-sharing
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_PROFIT_SHARING_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_PROFIT_SHARING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=profit_sharing sslmode=disable
    command: ["athena", "--port", "8108"]
    expose:
      - "8108"

  # ATHENA_URL is consumed by the summary source before Start.
  # Its pool is owned by this process; TS proxy never configures Telegram.
  athena-notification:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Preserve explicit empty values; each consumer owns its validation/defaults.
      ATHENA_LOGFORMAT: "${ATHENA_LOGFORMAT-json}"
      ATHENA_LOG_FORMAT_ENABLE_FULL_TIMESTAMP: "${ATHENA_LOG_FORMAT_ENABLE_FULL_TIMESTAMP-}"
      ATHENA_LOG_FORMAT_TIMESTAMP: "${ATHENA_LOG_FORMAT_TIMESTAMP-}"
      FORCE_LOG_COLORS: "${FORCE_LOG_COLORS-}"
      # net/http and the gRPC proxy dialer consume these standard variables.
      HTTP_PROXY: "${HTTP_PROXY-}"
      HTTPS_PROXY: "${HTTPS_PROXY-}"
      NO_PROXY: "${NO_PROXY-}"
      ALL_PROXY: "${ALL_PROXY-}"
      http_proxy: "${http_proxy-}"
      https_proxy: "${https_proxy-}"
      no_proxy: "${no_proxy-}"
      all_proxy: "${all_proxy-}"
      ATHENA_LOGLEVEL: ${ATHENA_LOGLEVEL-info}
      ATHENA_GRPC_MAX_SIZE_MB: ${ATHENA_GRPC_MAX_SIZE_MB-200}
      ATHENA_URL: ${ATHENA_URL:?ATHENA_URL is required}
      ATHENA_BINARY_NAME: athena-notification
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_NOTIFICATION_TELEGRAM_API_URL: ${ATHENA_NOTIFICATION_TELEGRAM_API_URL-https://api.telegram.org}
      ATHENA_NOTIFICATION_TELEGRAM_TIMEOUT_SECONDS: ${ATHENA_NOTIFICATION_TELEGRAM_TIMEOUT_SECONDS-30}
      ATHENA_NOTIFICATION_WORKER_CONCURRENCY: ${ATHENA_NOTIFICATION_WORKER_CONCURRENCY-12}
      ATHENA_NOTIFICATION_TELEGRAM_BOT_NAME: ${ATHENA_NOTIFICATION_TELEGRAM_BOT_NAME-ATHENA}
      ATHENA_NOTIFICATION_TELEGRAM_BOT_SHORT_DESCRIPTION: ${ATHENA_NOTIFICATION_TELEGRAM_BOT_SHORT_DESCRIPTION-ATHENA notifications}
      ATHENA_NOTIFICATION_TELEGRAM_BOT_DESCRIPTION: ${ATHENA_NOTIFICATION_TELEGRAM_BOT_DESCRIPTION-ATHENA notification bot for account and system updates.}
      ATHENA_NOTIFICATION_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
      ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN: ${ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN:?ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN is required}
      ATHENA_ACCOUNT_STATE_POSTGRES_DSN: ${ATHENA_ACCOUNT_STATE_POSTGRES_DSN:?ATHENA_ACCOUNT_STATE_POSTGRES_DSN is required}
      ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID: ${ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID:?ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID is required}
      ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID: ${ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID:?ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID is required}
    command: ["athena", "--port", "8086"]
    expose:
      - "8086"

  athena-wallet:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-wallet
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WALLET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WALLET_ENCRYPTION_KEY: ${ATHENA_WALLET_ENCRYPTION_KEY:?ATHENA_WALLET_ENCRYPTION_KEY is required}
      ATHENA_WALLET_INTERNAL_AUTH_TOKEN: ${ATHENA_WALLET_INTERNAL_AUTH_TOKEN:?ATHENA_WALLET_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ${ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN:?ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN is required}
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
    command: ["athena", "--port", "8088"]
    expose:
      - "8088"

  athena-token-api:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: [*token-chain-environment, *without-auth-secrets]
      ATHENA_BINARY_NAME: athena-token-api
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_TOKEN_API_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena", "--port", "8096"]
    expose:
      - "8096"

  athena-etherscan-manager:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-etherscan-manager
      ATHENA_ETHERSCAN_MANAGER_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_ETHERSCAN_MANAGER_API_KEYS: ${ATHENA_ETHERSCAN_MANAGER_API_KEYS:?ATHENA_ETHERSCAN_MANAGER_API_KEYS is required}
      ATHENA_ETHERSCAN_MANAGER_GATEWAY_ADDRS: ${ATHENA_ETHERSCAN_MANAGER_GATEWAY_ADDRS:?ATHENA_ETHERSCAN_MANAGER_GATEWAY_ADDRS is required}
      ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN: ${ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN:?ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN is required}
    command: ["athena", "--port", "8100"]
    expose:
      - "8100"

  athena-token-chain-processor:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-chain-processor
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8110
    expose: ["8110"]

  athena-token-collector-ave:
    <<: *token-worker
    command: ["athena", "--data-type", "ave"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: ave
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8113
    expose: ["8113"]

  athena-token-collector-chain-state:
    <<: *token-worker
    command: ["athena", "--data-type", "chain_state"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: chain_state
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8114
    expose: ["8114"]

  athena-token-collector-wallet-asset-state:
    <<: *token-worker
    command: ["athena", "--data-type", "wallet_asset_state"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: wallet_asset_state
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8115
    expose: ["8115"]

  athena-token-collector-simulation-result:
    <<: *token-worker
    command: ["athena", "--data-type", "simulation_result"]
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: simulation_result
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8116
    expose: ["8116"]

  athena-token-collector-contract-code-source:
    <<: *token-worker
    command: ["athena", "--data-type", "contract_code_source"]
    depends_on:
      postgres:
        condition: service_healthy
      athena-etherscan-manager:
        condition: service_started
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: contract_code_source
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8117
      ATHENA_TOKEN_ETHERSCAN_MANAGER_SERVER_ADDRESS: athena-etherscan-manager:8100
    expose: ["8117"]

  athena-token-collector-wallet-normal-transactions:
    <<: *token-worker
    command: ["athena", "--data-type", "wallet_normal_transactions"]
    depends_on:
      postgres:
        condition: service_healthy
      athena-etherscan-manager:
        condition: service_started
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-collector
      ATHENA_TOKEN_DATA_TYPE: wallet_normal_transactions
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8120
      ATHENA_TOKEN_ETHERSCAN_MANAGER_SERVER_ADDRESS: athena-etherscan-manager:8100
    expose: ["8120"]

  athena-token-profile-builder:
    <<: *token-worker
    environment:
      <<: *token-worker-environment
      ATHENA_BINARY_NAME: athena-token-profile-builder
      ATHENA_TOKEN_HEALTH_LISTEN_ADDRESS: 0.0.0.0:8118
    expose: ["8118"]

  athena-trader-sync:
    image: ${TRADER_SYNC_IMAGE:-athena-trader-sync:local}
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATHENA_LOGLEVEL: ${ATHENA_LOGLEVEL:-info}
      ATHENA_GRPC_MAX_SIZE_MB: ${ATHENA_GRPC_MAX_SIZE_MB:-200}
      ATHENA_ACCOUNT_STATE_POSTGRES_DSN: ${ATHENA_ACCOUNT_STATE_POSTGRES_DSN:?ATHENA_ACCOUNT_STATE_POSTGRES_DSN is required}
      ATHENA_URL: ${ATHENA_URL:?ATHENA_URL is required}
      ATHENA_TRADER_SYNC_HTTP_URL: ${ATHENA_TRADER_SYNC_HTTP_URL:?ATHENA_TRADER_SYNC_HTTP_URL is required}
      ATHENA_TRADER_SYNC_WSS_URL: ${ATHENA_TRADER_SYNC_WSS_URL:?ATHENA_TRADER_SYNC_WSS_URL is required}
      ATHENA_TRADER_SYNC_PROXY_URL: ${ATHENA_TRADER_SYNC_PROXY_URL:-}
      ATHENA_TRADER_SYNC_MAX_IN_FLIGHT_SOURCES: ${ATHENA_TRADER_SYNC_MAX_IN_FLIGHT_SOURCES:-100}
      ATHENA_TRADER_SYNC_CURSOR_HMAC_KEY_FILE: /run/secrets/trader-sync-cursor-key
      ATHENA_TRADER_SYNC_LISTEN_ADDRESS: 0.0.0.0:8122
      ATHENA_TRADER_SYNC_GRPC_TRANSPORT: tls
      ATHENA_TRADER_SYNC_INTERNAL_AUTH_TOKEN_FILE: /run/secrets/trader-sync-token
      ATHENA_TRADER_SYNC_TLS_CERT_FILE: /run/secrets/trader-sync-cert
      ATHENA_TRADER_SYNC_TLS_KEY_FILE: /run/secrets/trader-sync-key
      ATHENA_TRADER_SYNC_TLS_CA_FILE: /run/secrets/trader-sync-ca
      ATHENA_TRADER_SYNC_TLS_SERVER_NAME: ${ATHENA_TRADER_SYNC_TLS_SERVER_NAME:-athena-trader-sync}
    secrets:
      - trader-sync-token
      - trader-sync-cursor-key
      - trader-sync-cert
      - trader-sync-key
      - trader-sync-ca
    healthcheck:
      test: ["CMD", "athena-trader-sync", "health", "--target", "127.0.0.1:8122"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s

  athena-account-state-migrate:
    image: ${TRADER_SYNC_IMAGE:-athena-trader-sync:local}
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATHENA_ACCOUNT_STATE_POSTGRES_DSN: ${ATHENA_ACCOUNT_STATE_POSTGRES_DSN:?ATHENA_ACCOUNT_STATE_POSTGRES_DSN is required}
    entrypoint: ["/usr/bin/tini", "--", "athena-account-state-migrate"]
    command: ["verify"]

  athena-migrate:
    image: ${PROD_IMAGE:-athena:local}
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ATHENA_COMPOSE_ENV_FILE:-.env}
    environment:
      <<: *without-auth-secrets
      ATHENA_BINARY_NAME: athena-migrate
      ATHENA_ACCOUNT_STATE_POSTGRES_DSN: ${ATHENA_ACCOUNT_STATE_POSTGRES_DSN:?ATHENA_ACCOUNT_STATE_POSTGRES_DSN is required}
      ATHENA_WORM_MARKETS_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_markets sslmode=disable
      ATHENA_WORM_TRADING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm_trading sslmode=disable
      ATHENA_SPORTS_LIVE_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=sports_live sslmode=disable
      ATHENA_SPORTS_HISTORY_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=sports_history sslmode=disable
      ATHENA_MANAGED_OO_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=managed_oo sslmode=disable
      ATHENA_PROFIT_SHARING_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=profit_sharing sslmode=disable
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena", "status", "--module", "all"]

  athena-server:
    image: ${PROD_IMAGE:-athena:local}
    user: ${ATHENA_SERVER_CONTAINER_USER:-999:999}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      athena-notification:
        condition: service_started
      athena-wallet:
        condition: service_started
      athena-worm-markets:
        condition: service_started
      athena-worm-trading:
        condition: service_started
      athena-market-radar:
        condition: service_started
      athena-sports-live:
        condition: service_started
      athena-sports-history:
        condition: service_started
      athena-managed-oo:
        condition: service_started
      athena-profit-sharing:
        condition: service_started
      athena-token-api:
        condition: service_started
    secrets:
      - google-oidc-client-secret
      - trader-sync-token
      - trader-sync-ca
    environment:
      # Preserve explicit empty values; each consumer owns its validation/defaults.
      ATHENA_LOGFORMAT: "${ATHENA_LOGFORMAT-json}"
      ATHENA_LOG_FORMAT_ENABLE_FULL_TIMESTAMP: "${ATHENA_LOG_FORMAT_ENABLE_FULL_TIMESTAMP-}"
      ATHENA_LOG_FORMAT_TIMESTAMP: "${ATHENA_LOG_FORMAT_TIMESTAMP-}"
      FORCE_LOG_COLORS: "${FORCE_LOG_COLORS-}"
      # net/http and the gRPC proxy dialer consume these standard variables.
      HTTP_PROXY: "${HTTP_PROXY-}"
      HTTPS_PROXY: "${HTTPS_PROXY-}"
      NO_PROXY: "${NO_PROXY-}"
      ALL_PROXY: "${ALL_PROXY-}"
      http_proxy: "${http_proxy-}"
      https_proxy: "${https_proxy-}"
      no_proxy: "${no_proxy-}"
      all_proxy: "${all_proxy-}"
      ETHERSCAN_GATEWAY_IPS: "${ETHERSCAN_GATEWAY_IPS-}"
      ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN: "${ATHENA_ETHERSCAN_GATEWAY_AUTH_TOKEN-}"
      ATHENA_ETHERSCAN_MANAGER_API_KEYS: "${ATHENA_ETHERSCAN_MANAGER_API_KEYS-}"
      ATHENA_ETHERSCAN_GATEWAY_PROBE_QUERY_ADDRESS: "${ATHENA_ETHERSCAN_GATEWAY_PROBE_QUERY_ADDRESS-}"
      ATHENA_API_CONTENT_TYPES: "${ATHENA_API_CONTENT_TYPES-application/json}"
      ATHENA_SERVER_OTLP_ADDRESS: "${ATHENA_SERVER_OTLP_ADDRESS-}"
      ATHENA_SERVER_OTLP_INSECURE: "${ATHENA_SERVER_OTLP_INSECURE-true}"
      ATHENA_SERVER_OTLP_HEADERS: "${ATHENA_SERVER_OTLP_HEADERS-}"
      ATHENA_SERVER_OTLP_ATTRS: "${ATHENA_SERVER_OTLP_ATTRS-}"
      ATHENA_SERVER_X_FRAME_OPTIONS: "${ATHENA_SERVER_X_FRAME_OPTIONS-sameorigin}"
      ATHENA_SERVER_CONTENT_SECURITY_POLICY: "${ATHENA_SERVER_CONTENT_SECURITY_POLICY-frame-ancestors 'self';}"
      ATHENA_SERVER_CONNECTION_STATUS_CACHE_EXPIRATION: "${ATHENA_SERVER_CONNECTION_STATUS_CACHE_EXPIRATION-1h}"
      ATHENA_DEFAULT_CACHE_EXPIRATION: "${ATHENA_DEFAULT_CACHE_EXPIRATION-24h}"
      REDISDB: "${REDISDB-0}"
      REDIS_USERNAME: "${REDIS_USERNAME-}"
      REDIS_COMPRESSION: "${REDIS_COMPRESSION-gzip}"
      REDIS_RETRY_COUNT: "${REDIS_RETRY_COUNT-3}"
      REDIS_CREDS_DIR_PATH: "${REDIS_CREDS_DIR_PATH-}"
      REDIS_SENTINEL_USERNAME: "${REDIS_SENTINEL_USERNAME-}"
      REDIS_SENTINEL_PASSWORD: "${REDIS_SENTINEL_PASSWORD-}"
      ATHENA_MAX_COOKIE_NUMBER: "${ATHENA_MAX_COOKIE_NUMBER-20}"
      ATHENA_ADDITIONAL_URLS: "${ATHENA_ADDITIONAL_URLS-}"
      ATHENA_SESSION_DURATION: "${ATHENA_SESSION_DURATION-24h}"
      ATHENA_HELP_CHAT_URL: "${ATHENA_HELP_CHAT_URL-}"
      ATHENA_HELP_CHAT_TEXT: "${ATHENA_HELP_CHAT_TEXT-Chat now!}"
      ATHENA_STATUS_BADGE_ENABLED: "${ATHENA_STATUS_BADGE_ENABLED-false}"
      ATHENA_STATUS_BADGE_ROOT_URL: "${ATHENA_STATUS_BADGE_ROOT_URL-}"
      ATHENA_ANONYMOUS_USER_ENABLED: "${ATHENA_ANONYMOUS_USER_ENABLED-false}"
      ATHENA_UI_CSS_URL: "${ATHENA_UI_CSS_URL-}"
      ATHENA_UI_BANNER_CONTENT: "${ATHENA_UI_BANNER_CONTENT-}"
      ATHENA_UI_BANNER_PERMANENT: "${ATHENA_UI_BANNER_PERMANENT-false}"
      ATHENA_UI_BANNER_POSITION: "${ATHENA_UI_BANNER_POSITION-}"
      ATHENA_UI_BANNER_URL: "${ATHENA_UI_BANNER_URL-}"
      ATHENA_HELP_DOWNLOAD_DARWIN_AMD64: "${ATHENA_HELP_DOWNLOAD_DARWIN_AMD64-}"
      ATHENA_HELP_DOWNLOAD_DARWIN_ARM64: "${ATHENA_HELP_DOWNLOAD_DARWIN_ARM64-}"
      ATHENA_HELP_DOWNLOAD_WINDOWS_AMD64: "${ATHENA_HELP_DOWNLOAD_WINDOWS_AMD64-}"
      ATHENA_HELP_DOWNLOAD_LINUX_AMD64: "${ATHENA_HELP_DOWNLOAD_LINUX_AMD64-}"
      ATHENA_HELP_DOWNLOAD_LINUX_ARM64: "${ATHENA_HELP_DOWNLOAD_LINUX_ARM64-}"
      ATHENA_HELP_DOWNLOAD_LINUX_PPC64LE: "${ATHENA_HELP_DOWNLOAD_LINUX_PPC64LE-}"
      ATHENA_HELP_DOWNLOAD_LINUX_S390X: "${ATHENA_HELP_DOWNLOAD_LINUX_S390X-}"
      ATHENA_LOGLEVEL: ${ATHENA_LOGLEVEL-info}
      ATHENA_GRPC_MAX_SIZE_MB: ${ATHENA_GRPC_MAX_SIZE_MB-200}
      ATHENA_URL: ${ATHENA_URL:?ATHENA_URL is required}
      ATHENA_TRADER_SYNC_SERVER_ADDRESS: athena-trader-sync:8122
      ATHENA_TRADER_SYNC_GRPC_TRANSPORT: tls
      ATHENA_TRADER_SYNC_INTERNAL_AUTH_TOKEN_FILE: /run/secrets/trader-sync-token
      ATHENA_TRADER_SYNC_TLS_CA_FILE: /run/secrets/trader-sync-ca
      ATHENA_TRADER_SYNC_TLS_SERVER_NAME: ${ATHENA_TRADER_SYNC_TLS_SERVER_NAME-athena-trader-sync}
      ATHENA_BINARY_NAME: athena-server
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_ACCOUNT_STATE_POSTGRES_DSN: ${ATHENA_ACCOUNT_STATE_POSTGRES_DSN:?ATHENA_ACCOUNT_STATE_POSTGRES_DSN is required}
      ATHENA_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN: ${ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN:?ATHENA_NOTIFICATION_INTERNAL_AUTH_TOKEN is required}
      ATHENA_NOTIFICATION_TELEGRAM_BOT_TOKEN: ""
      ATHENA_NOTIFICATION_TEST_TELEGRAM_CHAT_ID: ""
      ATHENA_NOTIFICATION_PROD_TELEGRAM_CHAT_ID: ""
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WALLET_INTERNAL_AUTH_TOKEN: ${ATHENA_WALLET_INTERNAL_AUTH_TOKEN:?ATHENA_WALLET_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WALLET_WORM_EXECUTION_SIGNER_TOKEN: ""
      ATHENA_WORM_MARKETS_SERVER_ADDRESS: athena-worm-markets:8084
      ATHENA_WORM_TRADING_SERVER_ADDRESS: athena-worm-trading:8090
      ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN: ${ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN:?ATHENA_WORM_TRADING_INTERNAL_AUTH_TOKEN is required}
      ATHENA_WORM_TRADING_SOLANA_RPC_URL: ""
      ATHENA_WORM_TRADING_CREDENTIAL_ENCRYPTION_KEY: ""
      ATHENA_WORM_TRADING_POSTGRES_DSN: ""
      ATHENA_MARKET_RADAR_SERVER_ADDRESS: athena-market-radar:8092
      ATHENA_SPORTS_LIVE_SERVER_ADDRESS: athena-sports-live:8094
      ATHENA_SPORTS_HISTORY_SERVER_ADDRESS: athena-sports-history:8104
      ATHENA_MANAGED_OO_SERVER_ADDRESS: athena-managed-oo:8106
      ATHENA_PROFIT_SHARING_SERVER_ADDRESS: athena-profit-sharing:8108
      ATHENA_TOKEN_API_SERVER_ADDRESS: athena-token-api:8096
      ATHENA_SERVER_BASEHREF: ${ATHENA_SERVER_BASEHREF-/}
      ATHENA_SERVER_ROOTPATH: ${ATHENA_SERVER_ROOTPATH-}
      ATHENA_SERVER_STATIC_ASSETS: ${ATHENA_SERVER_STATIC_ASSETS-/shared/app}
      ATHENA_SERVER_ENABLE_GZIP: ${ATHENA_SERVER_ENABLE_GZIP-true}
      ATHENA_SERVER_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SERVER_DISABLE_AUTH: "false"
      ATHENA_JWT_SECRET: ${ATHENA_JWT_SECRET:?ATHENA_JWT_SECRET is required}
      ATHENA_JWT_SECRET_FILE: ""
      ATHENA_GOOGLE_OIDC_CLIENT_ID: ${ATHENA_GOOGLE_OIDC_CLIENT_ID-}
      ATHENA_GOOGLE_OIDC_CLIENT_SECRET: ""
      ATHENA_GOOGLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/google-oidc-client-secret
      ATHENA_GOOGLE_OIDC_REDIRECT_URI: ${ATHENA_GOOGLE_OIDC_REDIRECT_URI-}
      ATHENA_ADMIN_GOOGLE_EMAIL: ${ATHENA_ADMIN_GOOGLE_EMAIL:?ATHENA_ADMIN_GOOGLE_EMAIL is required}
      ATHENA_ACCOUNT_AVATAR_S3_ENDPOINT: http://minio:9000
      ATHENA_ACCOUNT_AVATAR_S3_REGION: ${ATHENA_ACCOUNT_AVATAR_S3_REGION-us-east-1}
      ATHENA_ACCOUNT_AVATAR_S3_BUCKET: ${ATHENA_ACCOUNT_AVATAR_S3_BUCKET-athena-account-avatars}
      ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID: ${ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID:?ATHENA_ACCOUNT_AVATAR_S3_ACCESS_KEY_ID is required}
      ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY: ${ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY:?ATHENA_ACCOUNT_AVATAR_S3_SECRET_ACCESS_KEY is required}
      ATHENA_ACCOUNT_AVATAR_S3_PATH_STYLE: "true"
      ATHENA_ACCOUNT_AVATAR_MAX_BYTES: ${ATHENA_ACCOUNT_AVATAR_MAX_BYTES-2097152}
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8080"]
    ports:
      - "${ATHENA_SERVER_BIND_ADDR:-127.0.0.1}:${ATHENA_SERVER_PORT:-8080}:8080"

secrets:
  trader-sync-token:
    file: ${ATHENA_TRADER_SYNC_INTERNAL_AUTH_TOKEN_FILE:-/dev/null}
  trader-sync-cursor-key:
    file: ${ATHENA_TRADER_SYNC_CURSOR_HMAC_KEY_FILE:-/dev/null}
  trader-sync-cert:
    file: ${ATHENA_TRADER_SYNC_TLS_CERT_FILE:-/dev/null}
  trader-sync-key:
    file: ${ATHENA_TRADER_SYNC_TLS_KEY_FILE:-/dev/null}
  trader-sync-ca:
    file: ${ATHENA_TRADER_SYNC_TLS_CA_FILE:-/dev/null}
  google-oidc-client-secret:
    file: ${ATHENA_GOOGLE_OIDC_CLIENT_SECRET_FILE:-/dev/null}

volumes:
  postgres-data:
    name: ${PROD_POSTGRES_VOLUME:-athena-prod-postgres-data}
    external: true
  redis-data:
    name: ${PROD_REDIS_VOLUME:-athena-prod-redis-data}
    external: true
  minio-data:
    name: ${PROD_MINIO_VOLUME:-athena-prod-minio-data}
    external: true
