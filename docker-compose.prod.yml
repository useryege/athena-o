services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hack/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: docker.io/temporalio/auto-setup:1.24
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    expose:
      - "7233"

  temporal-ui:
    image: docker.io/temporalio/ui:2.26.2
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_BIND_ADDR:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080"

  athena-application-api:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: api
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_APPLICATION_WALLET_SERVER_ADDRESS: athena-wallet:8088
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8082"]
    expose:
      - "8082"

  athena-application-ingestor-eth:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: chain-ingestor
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_CHAIN_ID: "1"
      ATHENA_APPLICATION_CONFIRMATION_DEPTH: "3"
      ATHENA_APPLICATION_NODE_WS_URL: ${ATHENA_APPLICATION_ETH_NODE_WS_URL:-ws://localhost:8546}
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
    command: ["athena"]

  athena-application-ingestor-bsc:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: chain-ingestor
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_CHAIN_ID: "56"
      ATHENA_APPLICATION_CONFIRMATION_DEPTH: "10"
      ATHENA_APPLICATION_NODE_WS_URL: ${ATHENA_APPLICATION_BSC_NODE_WS_URL:-ws://localhost:8546}
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
    command: ["athena"]

  athena-application-outbox-worker:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: outbox-worker
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_APPLICATION_TEMPORAL_ADDRESS: temporal:7233
    command: ["athena"]

  athena-application-temporal-worker-control:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: temporal-worker-control
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_APPLICATION_TEMPORAL_ADDRESS: temporal:7233
    command: ["athena"]

  athena-application-temporal-worker-eth:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: temporal-worker-chain
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_CHAIN_ID: "1"
      ATHENA_APPLICATION_NODE_WS_URL: ${ATHENA_APPLICATION_ETH_NODE_WS_URL:-ws://localhost:8546}
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_APPLICATION_TEMPORAL_ADDRESS: temporal:7233
    command: ["athena"]

  athena-application-temporal-worker-bsc:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: temporal-worker-chain
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_CHAIN_ID: "56"
      ATHENA_APPLICATION_NODE_WS_URL: ${ATHENA_APPLICATION_BSC_NODE_WS_URL:-ws://localhost:8546}
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_APPLICATION_TEMPORAL_ADDRESS: temporal:7233
    command: ["athena"]

  athena-application-temporal-worker-external:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-application
      ATHENA_APPLICATION_MODE: temporal-worker-external
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_APPLICATION_NODE_WS_URL: ${ATHENA_APPLICATION_ETH_NODE_WS_URL:-ws://localhost:8546}
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_APPLICATION_TEMPORAL_ADDRESS: temporal:7233
    command: ["athena"]

  athena-worm:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-worm
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm sslmode=disable
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8084"]
    expose:
      - "8084"

  athena-polymarket:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-polymarket
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_POLYMARKET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_POLYMARKET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=polymarket sslmode=disable
    command: ["athena", "--port", "8092"]
    expose:
      - "8092"

  athena-notification:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-notification
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_NOTIFICATION_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
    command: ["athena", "--port", "8086"]
    expose:
      - "8086"

  athena-wallet:
    image: athena:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-wallet
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WALLET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WALLET_ENCRYPTION_KEY: ${ATHENA_WALLET_ENCRYPTION_KEY:?ATHENA_WALLET_ENCRYPTION_KEY is required}
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
    command: ["athena", "--port", "8088"]
    expose:
      - "8088"

  athena-migrate:
    image: athena:local
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-migrate
      ATHENA_APPLICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=application sslmode=disable
      ATHENA_WORM_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm sslmode=disable
      ATHENA_POLYMARKET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=polymarket sslmode=disable
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
    command: ["athena", "status", "--module", "all"]

  athena-server:
    image: athena:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      athena-application-api:
        condition: service_started
      athena-notification:
        condition: service_started
      athena-wallet:
        condition: service_started
      athena-worm:
        condition: service_started
      athena-polymarket:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-server
      ATHENA_APPLICATION_SERVER_ADDRESS: athena-application-api:8082
      ATHENA_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WORM_SERVER_ADDRESS: athena-worm:8084
      ATHENA_POLYMARKET_SERVER_ADDRESS: athena-polymarket:8092
      ATHENA_SERVER_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SERVER_DISABLE_AUTH: ${ATHENA_SERVER_DISABLE_AUTH:-false}
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8080"]
    ports:
      - "${ATHENA_SERVER_BIND_ADDR:-127.0.0.1}:${ATHENA_SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
    name: ${PROD_POSTGRES_VOLUME:-athena-prod-postgres-data}
    external: true
