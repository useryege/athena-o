services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hack/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  athena-worm:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      athena-notification:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-worm
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WORM_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WORM_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm sslmode=disable
      ATHENA_WORM_NOTIFICATION_ENABLED: "true"
      ATHENA_WORM_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
    command: ["athena", "--port", "8084"]
    expose:
      - "8084"

  athena-polymarket:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-polymarket
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_POLYMARKET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_POLYMARKET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=polymarket sslmode=disable
    command: ["athena", "--port", "8092"]
    expose:
      - "8092"

  athena-notification:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-notification
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_NOTIFICATION_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
    command: ["athena", "--port", "8086"]
    expose:
      - "8086"

  athena-wallet:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-wallet
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_WALLET_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_WALLET_ENCRYPTION_KEY: ${ATHENA_WALLET_ENCRYPTION_KEY:?ATHENA_WALLET_ENCRYPTION_KEY is required}
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
    command: ["athena", "--port", "8088"]
    expose:
      - "8088"

  athena-token:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-token
      ATHENA_TOKEN_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_TOKEN_MODE: grpc
    command: ["athena", "--port", "8094"]
    expose:
      - "8094"

  athena-token-api:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-token-api
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_TOKEN_API_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena", "--port", "8096"]
    expose:
      - "8096"

  athena-token-chain-ingestor:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-token
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_TOKEN_MODE: chain-ingestor
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena"]

  athena-token-project-qualifier:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-token
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_TOKEN_MODE: project-qualifier
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena"]

  athena-token-project-data-collector:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-token
      ATHENA_POSTGRES_AUTO_MIGRATE: "false"
      ATHENA_TOKEN_MODE: project-data-collector
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena"]

  athena-migrate:
    image: ${PROD_IMAGE:-athena:local}
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-migrate
      ATHENA_WORM_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=worm sslmode=disable
      ATHENA_POLYMARKET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=polymarket sslmode=disable
      ATHENA_NOTIFICATION_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=notification sslmode=disable
      ATHENA_WALLET_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=wallet sslmode=disable
      ATHENA_TOKEN_POSTGRES_DSN: host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=token sslmode=disable
    command: ["athena", "status", "--module", "all"]

  athena-server:
    image: ${PROD_IMAGE:-athena:local}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      athena-notification:
        condition: service_started
      athena-wallet:
        condition: service_started
      athena-worm:
        condition: service_started
      athena-polymarket:
        condition: service_started
      athena-token-api:
        condition: service_started
    env_file:
      - .env
    environment:
      ATHENA_BINARY_NAME: athena-server
      ATHENA_NOTIFICATION_SERVER_ADDRESS: athena-notification:8086
      ATHENA_WALLET_SERVER_ADDRESS: athena-wallet:8088
      ATHENA_WORM_SERVER_ADDRESS: athena-worm:8084
      ATHENA_POLYMARKET_SERVER_ADDRESS: athena-polymarket:8092
      ATHENA_TOKEN_API_SERVER_ADDRESS: athena-token-api:8096
      ATHENA_SERVER_LISTEN_ADDRESS: 0.0.0.0
      ATHENA_SERVER_DISABLE_AUTH: ${ATHENA_SERVER_DISABLE_AUTH:-false}
      REDIS_SERVER: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["athena", "--port", "8080"]
    ports:
      - "${ATHENA_SERVER_BIND_ADDR:-127.0.0.1}:${ATHENA_SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
    name: ${PROD_POSTGRES_VOLUME:-athena-prod-postgres-data}
    external: true
