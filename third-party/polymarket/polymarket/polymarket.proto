  rpc GetLastTradePrice(GetLastTradePriceRequest) returns (GetLastTradePriceResponse);
  rpc GetLastTradesPrices(GetLastTradesPricesRequest) returns (GetLastTradesPricesResponse);
  rpc GetPricesHistory(GetPricesHistoryRequest) returns (GetPricesHistoryResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc DeriveApiKey(DeriveApiKeyRequest) returns (DeriveApiKeyResponse);
  rpc CreateOrDeriveApiKey(CreateOrDeriveApiKeyRequest) returns (CreateOrDeriveApiKeyResponse);
  rpc GetApiKeys(GetApiKeysRequest) returns (GetApiKeysResponse);
  rpc GetClosedOnlyMode(GetClosedOnlyModeRequest) returns (GetClosedOnlyModeResponse);
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse);
