  rpc GetOrderBooks(GetOrderBooksRequest) returns (GetOrderBooksResponse);
  rpc GetTickSize(GetTickSizeRequest) returns (GetTickSizeResponse);
  rpc GetNegRisk(GetNegRiskRequest) returns (GetNegRiskResponse);
  rpc GetFeeRateBps(GetFeeRateBpsRequest) returns (GetFeeRateBpsResponse);
