message GetBuilderTradesRequest {
  BuilderTradeParams params = 1;
  optional string next_cursor = 2;
}

message DropNotificationsRequest {
  DropNotificationParams params = 1;
}

message CreateOrderRequest {
  oneof user_order {
    UserOrderV1 user_order_v1 = 1;
    UserOrderV2 user_order_v2 = 2;
  }
  optional CreateOrderOptions options = 3;
}

message CreateMarketOrderRequest {
  oneof user_market_order {
    UserMarketOrderV1 user_market_order_v1 = 1;
    UserMarketOrderV2 user_market_order_v2 = 2;
  }
  optional CreateOrderOptions options = 3;
}

message CreateAndPostOrderRequest {
  oneof user_order {
    UserOrderV1 user_order_v1 = 1;
    UserOrderV2 user_order_v2 = 2;
  }
  optional CreateOrderOptions options = 3;
  optional OrderType order_type = 4;
  optional bool post_only = 5;
  optional bool defer_exec = 6;
}

message CreateAndPostMarketOrderRequest {
  oneof user_market_order {
    UserMarketOrderV1 user_market_order_v1 = 1;
    UserMarketOrderV2 user_market_order_v2 = 2;
  }
  optional CreateOrderOptions options = 3;
  optional OrderType order_type = 4;
  optional bool defer_exec = 5;
}

message GetOpenOrdersRequest {
  OpenOrderParams params = 1;
  optional bool only_first_page = 2;
  optional string next_cursor = 3;
}

message GetPreMigrationOrdersRequest {
  optional bool only_first_page = 1;
  optional string next_cursor = 2;
}

message PostOrderRequest {
  SignedOrder order = 1;
  optional OrderType order_type = 2;
  optional bool post_only = 3;
  optional bool defer_exec = 4;
}

message PostOrdersRequest {
  repeated PostOrderArg args = 1;
  optional bool post_only = 2;
  optional bool defer_exec = 3;
}

message CancelOrderRequest {
  OrderPayload payload = 1;
}

message CancelOrdersRequest {
  repeated string orders_hashes = 1;
}

message CancelMarketOrdersRequest {
  OrderMarketCancelParams payload = 1;
}

message IsOrderScoringRequest {
  OrderScoringParams params = 1;
}

message AreOrdersScoringRequest {
  repeated string order_ids = 1;
}

message CalculateMarketPriceRequest {
  string token_id = 1;
  Side side = 2;
  double amount = 3;
  optional OrderType order_type = 4;
}
