  rpc GetBalanceAllowance(GetBalanceAllowanceRequest) returns (GetBalanceAllowanceResponse);
  rpc UpdateBalanceAllowance(UpdateBalanceAllowanceRequest) returns (UpdateBalanceAllowanceResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc CreateMarketOrder(CreateMarketOrderRequest) returns (CreateMarketOrderResponse);
  rpc CreateAndPostOrder(CreateAndPostOrderRequest) returns (CreateAndPostOrderResponse);
  rpc CreateAndPostMarketOrder(CreateAndPostMarketOrderRequest) returns (CreateAndPostMarketOrderResponse);
  rpc GetOpenOrders(GetOpenOrdersRequest) returns (GetOpenOrdersResponse);
