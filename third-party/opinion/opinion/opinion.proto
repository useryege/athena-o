syntax = "proto3";

package opinion;

import "google/protobuf/struct.proto";

// Opinion gRPC surface for `@opinion-labs/opinion-clob-sdk` market, market-data, and trading APIs.
// Message field names follow the TS SDK and `@opinion-labs/opinion-api` OpenAPI types (camelCase identifiers).

service OpinionService {
  rpc GetMarkets(GetMarketsRequest) returns (GetMarketsResponse);
  rpc GetMarket(GetMarketRequest) returns (GetMarketResponse);
  rpc GetCategoricalMarket(GetCategoricalMarketRequest) returns (GetCategoricalMarketResponse);
  rpc GetMarketBySlug(GetMarketBySlugRequest) returns (GetMarketBySlugResponse);
  rpc GetQuoteTokens(GetQuoteTokensRequest) returns (GetQuoteTokensResponse);
  rpc GetOrderbook(GetOrderbookRequest) returns (GetOrderbookResponse);
  rpc GetLatestPrice(GetLatestPriceRequest) returns (GetLatestPriceResponse);
  rpc GetPriceHistory(GetPriceHistoryRequest) returns (GetPriceHistoryResponse);
  rpc GetFeeRates(GetFeeRatesRequest) returns (GetFeeRatesResponse);
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc PlaceOrdersBatch(PlaceOrdersBatchRequest) returns (PlaceOrdersBatchResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc CancelOrdersBatch(CancelOrdersBatchRequest) returns (CancelOrdersBatchResponse);
  rpc CancelAllOrders(CancelAllOrdersRequest) returns (CancelAllOrdersResponse);

  // User & wallet (`Client.getMy*` / `getUserAuth`).
  rpc GetMyOrders(GetMyOrdersRequest) returns (GetMyOrdersResponse);
  rpc GetOrderById(GetOrderByIdRequest) returns (GetOrderByIdResponse);
  rpc GetMyBalances(GetMyBalancesRequest) returns (GetMyBalancesResponse);
  rpc GetMyPositions(GetMyPositionsRequest) returns (GetMyPositionsResponse);
  rpc GetMyTrades(GetMyTradesRequest) returns (GetMyTradesResponse);
  rpc GetUserAuth(GetUserAuthRequest) returns (GetUserAuthResponse);

  // On-chain trading prep & CTF (`enableTrading`, `split`, `merge`, `redeem`) — SDK return shape is `TransactionResult`.
  rpc EnableTrading(EnableTradingRequest) returns (EnableTradingResponse);
  rpc Split(SplitRequest) returns (SplitResponse);
  rpc Merge(MergeRequest) returns (MergeResponse);
  rpc Redeem(RedeemRequest) returns (RedeemResponse);
}

// --- Enums (proto numbers are stable; map to SDK enums in adapters) ---

enum MarketTopicType {
  MARKET_TOPIC_TYPE_UNSPECIFIED = 0;
  MARKET_TOPIC_TYPE_BINARY = 1;
  MARKET_TOPIC_TYPE_CATEGORICAL = 2;
  MARKET_TOPIC_TYPE_ALL = 3;
}

enum MarketStatusFilter {
  MARKET_STATUS_FILTER_UNSPECIFIED = 0;
  MARKET_STATUS_FILTER_ALL = 1;
  MARKET_STATUS_FILTER_ACTIVATED = 2;
  MARKET_STATUS_FILTER_RESOLVED = 3;
}

enum MarketSortBy {
  MARKET_SORT_BY_UNSPECIFIED = 0;
  MARKET_SORT_BY_TIME_DESC = 1;
  MARKET_SORT_BY_CUTOFF_TIME_ASC = 2;
  MARKET_SORT_BY_VOLUME_DESC = 3;
  MARKET_SORT_BY_VOLUME_ASC = 4;
  MARKET_SORT_BY_VOLUME_24H_DESC = 5;
  MARKET_SORT_BY_VOLUME_24H_ASC = 6;
  MARKET_SORT_BY_VOLUME_7D_DESC = 7;
  MARKET_SORT_BY_VOLUME_7D_ASC = 8;
}

// Maps to SDK getPriceHistory `interval`; UNSPECIFIED → omit so SDK defaults to 1h.
enum PriceHistoryInterval {
  PRICE_HISTORY_INTERVAL_UNSPECIFIED = 0;
  PRICE_HISTORY_INTERVAL_1M = 1;
  PRICE_HISTORY_INTERVAL_1H = 2;
  PRICE_HISTORY_INTERVAL_1D = 3;
  PRICE_HISTORY_INTERVAL_1W = 4;
  PRICE_HISTORY_INTERVAL_MAX = 5;
}

// SDK `OrderSide` (`src/models/enums.ts`).
enum SdkOrderSide {
  SDK_ORDER_SIDE_UNSPECIFIED = 0;
  SDK_ORDER_SIDE_BUY = 1;
  SDK_ORDER_SIDE_SELL = 2;
}

// SDK `OrderType` (`src/models/enums.ts`). 0 reserved / do not use for valid orders.
enum SdkOrderType {
  SDK_ORDER_TYPE_UNSPECIFIED = 0;
  SDK_ORDER_TYPE_MARKET_ORDER = 1;
  SDK_ORDER_TYPE_LIMIT_ORDER = 2;
}

// --- Requests ---

message GetMarketsRequest {
  optional MarketTopicType topic_type = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
  optional MarketStatusFilter status = 4;
  optional MarketSortBy sort_by = 5;
}

message GetMarketRequest {
  // String decimal so callers avoid JS Number precision loss on large ids; adapters parse to SDK number.
  string market_id = 1;
  optional bool use_cache = 2;
}

message GetCategoricalMarketRequest {
  string market_id = 1;
}

message GetMarketBySlugRequest {
  string slug = 1;
}

message GetQuoteTokensRequest {
  optional bool use_cache = 1;
}

message GetOrderbookRequest {
  string token_id = 1;
}

message GetLatestPriceRequest {
  string token_id = 1;
}

message GetPriceHistoryRequest {
  string token_id = 1;
  optional PriceHistoryInterval interval = 2;
  optional int64 start_at = 3;
  optional int64 end_at = 4;
}

message GetFeeRatesRequest {
  string token_id = 1;
}

// Mirrors SDK `PlaceOrderDataInput` (`src/models/order.ts`).
message PlaceOrderData {
  int32 market_id = 1;
  string token_id = 2;
  SdkOrderSide side = 3;
  SdkOrderType order_type = 4;
  string price = 5;
  optional string maker_amount_in_quote_token = 6;
  optional string maker_amount_in_base_token = 7;
}

// `placeOrder(data, checkApproval)` — first RPC field matches the SDK parameter name `data`.
message PlaceOrderRequest {
  PlaceOrderData data = 1;
  optional bool check_approval = 2;
}

message PlaceOrdersBatchRequest {
  repeated PlaceOrderData orders = 1;
  optional bool check_approval = 2;
}

message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrdersBatchRequest {
  repeated string order_ids = 1;
}

// Optional filters match `Client.cancelAllOrders` options; unset means no filter.
message CancelAllOrdersRequest {
  optional int32 market_id = 1;
  optional SdkOrderSide side = 2;
}

// `getMyOrders(options)` — field names match the options object (`src/client.ts`).
message GetMyOrdersRequest {
  optional int32 market_id = 1;
  optional string status = 2;
  optional int32 page = 3;
  optional int32 limit = 4;
}

message GetOrderByIdRequest {
  string order_id = 1;
}

message GetMyBalancesRequest {}

// `getMyPositions` / `getMyTrades` options.
message GetMyPositionsRequest {
  optional int32 market_id = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
}

message GetMyTradesRequest {
  optional int32 market_id = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
}

message GetUserAuthRequest {}

message EnableTradingRequest {}

// `split` / `merge(marketId, amount, checkApproval?)`.
message SplitRequest {
  int32 market_id = 1;
  string amount = 2;
  optional bool check_approval = 3;
}

message MergeRequest {
  int32 market_id = 1;
  string amount = 2;
  optional bool check_approval = 3;
}

message RedeemRequest {
  int32 market_id = 1;
  optional bool check_approval = 2;
}

// --- Responses (errno/errmsg mirror SDK ApiResponse; omitted fields mean unset in partial updates) ---

message GetMarketsResponse {
  int32 errno = 1;
  string errmsg = 2;
  int32 total = 3;
  repeated Market list = 4;
}

message GetMarketResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional Market data = 3;
}

message GetCategoricalMarketResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional Market data = 3;
}

message GetMarketBySlugResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional Market data = 3;
}

message GetQuoteTokensResponse {
  int32 errno = 1;
  string errmsg = 2;
  int32 total = 3;
  repeated QuoteToken list = 4;
}

message GetOrderbookResponse {
  int32 errno = 1;
  string errmsg = 2;
  repeated OrderbookLevel asks = 3;
  repeated OrderbookLevel bids = 4;
  optional string market = 5;
  optional int64 timestamp = 6;
  optional string token_id = 7;
}

message GetLatestPriceResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional string price = 3;
  optional string side = 4;
  optional string size = 5;
  optional int64 timestamp = 6;
  optional string token_id = 7;
}

message GetPriceHistoryResponse {
  int32 errno = 1;
  string errmsg = 2;
  repeated PricePoint history = 3;
}

// Mirrors chain `FeeRateSettings`; SDK returns this directly (not ApiResponse).
message GetFeeRatesResponse {
  double maker_max_fee_rate = 1;
  double taker_max_fee_rate = 2;
  bool enabled = 3;
}

// `ApiResponse<CreateOrderResponse>` with `result.orderData` surfaced as `orderData` (flattened like other RPCs).
message PlaceOrderResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional OrderApiData order_data = 3;
}

message PlaceOrdersBatchResponse {
  repeated PlaceOrderBatchItem items = 1;
}

// One entry per input order; `result` is the full SDK `ApiResponse<CreateOrderResponse>` shape.
message PlaceOrderBatchItem {
  int32 index = 1;
  bool success = 2;
  optional PlaceOrderResponse result = 3;
  optional string error = 4;
}

// Full SDK `ApiResponse<OpenapiCancelOrderRespOpenApi>` (`errno` / `errmsg` / `result` boolean).
message CancelOrderResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional bool result = 3;
}

message CancelOrdersBatchResponse {
  repeated CancelOrderBatchItem items = 1;
}

message CancelOrderBatchItem {
  int32 index = 1;
  bool success = 2;
  optional CancelOrderResponse result = 3;
  optional string error = 4;
}

// Return type of `Client.cancelAllOrders`.
message CancelAllOrdersResponse {
  int32 total_orders = 1;
  int32 cancelled = 2;
  int32 failed = 3;
  repeated CancelOrderBatchItem results = 4;
}

// `ApiResponse<OpenapiOrderListRespOpenApi>` flattened (`errno` / `errmsg` / `total` / `list`).
message GetMyOrdersResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional int32 total = 3;
  repeated OrderApiData list = 4;
}

// `ApiResponse<OpenapiOrderDetailRespOpenApi>` flattened (`errno` / `errmsg` / `orderData`).
message GetOrderByIdResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional OrderApiData order_data = 3;
}

// `OpenapiQuoteTokenBalance` (`@opinion-labs/opinion-api` `types.gen.ts`).
message QuoteTokenBalance {
  optional string available_balance = 1;
  optional string frozen_balance = 2;
  optional string quote_token = 3;
  optional int32 token_decimals = 4;
  optional string total_balance = 5;
}

// `ApiResponse<OpenapiBalanceRespOpenApi>` flattened.
message GetMyBalancesResponse {
  int32 errno = 1;
  string errmsg = 2;
  repeated QuoteTokenBalance balances = 3;
  optional string chain_id = 4;
  optional string multi_sign_address = 5;
  optional string wallet_address = 6;
}

// `OpenapiPositionDataOpenApi`.
message PositionApiData {
  optional string avg_entry_price = 1;
  optional int32 claim_status = 2;
  optional string claim_status_enum = 3;
  optional string condition_id = 4;
  optional string current_value_in_quote_token = 5;
  optional string daily_pnl_change = 6;
  optional string daily_pnl_change_percent = 7;
  optional int64 market_cutoff_at = 8;
  optional int32 market_id = 9;
  optional int32 market_status = 10;
  optional string market_status_enum = 11;
  optional string market_title = 12;
  optional string outcome = 13;
  optional int32 outcome_side = 14;
  optional string outcome_side_enum = 15;
  optional string quote_token = 16;
  optional int32 root_market_id = 17;
  optional string root_market_title = 18;
  optional string shares_frozen = 19;
  optional string shares_owned = 20;
  optional string token_id = 21;
  optional string unrealized_pnl = 22;
  optional string unrealized_pnl_percent = 23;
}

// `ApiResponse<OpenapiPositionsRespOpenApi>` flattened.
message GetMyPositionsResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional int32 total = 3;
  repeated PositionApiData list = 4;
}

// Runtime shape after `getMyTrades` post-processing: `fee` is set from `feeFormatted` (string) and `feeFormatted` is removed.
message UserTradeApiData {
  optional string amount = 1;
  optional string chain_id = 2;
  optional int64 created_at = 3;
  optional string fee = 4;
  optional int32 market_id = 5;
  optional string market_title = 6;
  optional string order_no = 7;
  optional string outcome = 8;
  optional int32 outcome_side = 9;
  optional string outcome_side_enum = 10;
  optional string price = 11;
  optional string profit = 12;
  optional string quote_token = 13;
  optional string quote_token_usd_price = 14;
  optional int32 root_market_id = 15;
  optional string root_market_title = 16;
  optional string shares = 17;
  optional string side = 18;
  optional int32 status = 19;
  optional string status_enum = 20;
  optional string trade_no = 21;
  optional string tx_hash = 22;
  optional string usd_amount = 23;
}

// `ApiResponse<OpenapiTradeListRespOpenApi>` flattened; list items match `UserTradeApiData` (SDK-transformed trades).
message GetMyTradesResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional int32 total = 3;
  repeated UserTradeApiData list = 4;
}

// `ApiResponse<V2GetApiKeyResp>` flattened (`walletUsers` matches OpenAPI map).
message GetUserAuthResponse {
  int32 errno = 1;
  string errmsg = 2;
  optional string api_key = 3;
  optional string wallet_address = 4;
  map<string, string> wallet_users = 5;
}

// SDK `TransactionResult` shape (`src/chain/contract_caller.ts`) for `enableTrading`.
message EnableTradingResponse {
  optional string tx_hash = 1;
  optional string safe_tx_hash = 2;
  optional string return_value = 3;
}

// SDK `TransactionResult` shape (`src/chain/contract_caller.ts`) for `split`.
message SplitResponse {
  optional string tx_hash = 1;
  optional string safe_tx_hash = 2;
  optional string return_value = 3;
}

// SDK `TransactionResult` shape (`src/chain/contract_caller.ts`) for `merge`.
message MergeResponse {
  optional string tx_hash = 1;
  optional string safe_tx_hash = 2;
  optional string return_value = 3;
}

// SDK `TransactionResult` shape (`src/chain/contract_caller.ts`) for `redeem`.
message RedeemResponse {
  optional string tx_hash = 1;
  optional string safe_tx_hash = 2;
  optional string return_value = 3;
}

// Mirrors `@opinion-labs/opinion-api` `OpenapiTradeDataOpenApi`.
message OrderTradeApiData {
  optional string amount = 1;
  optional string chain_id = 2;
  optional int64 created_at = 3;
  optional double fee = 4;
  optional string fee_formatted = 5;
  optional int32 market_id = 6;
  optional string market_title = 7;
  optional string order_no = 8;
  optional string outcome = 9;
  optional int32 outcome_side = 10;
  optional string outcome_side_enum = 11;
  optional string price = 12;
  optional string profit = 13;
  optional string quote_token = 14;
  optional string quote_token_usd_price = 15;
  optional int32 root_market_id = 16;
  optional string root_market_title = 17;
  optional string shares = 18;
  optional string side = 19;
  optional int32 status = 20;
  optional string status_enum = 21;
  optional string trade_no = 22;
  optional string tx_hash = 23;
  optional string usd_amount = 24;
}

// Mirrors `@opinion-labs/opinion-api` `OpenapiOrderDataOpenApi` / SDK create-order payload.
message OrderApiData {
  optional int64 created_at = 1;
  optional int64 expires_at = 2;
  optional string filled_amount = 3;
  optional string filled_shares = 4;
  optional int32 market_id = 5;
  optional string market_title = 6;
  optional string order_amount = 7;
  optional string order_id = 8;
  optional string order_shares = 9;
  optional string outcome = 10;
  optional int32 outcome_side = 11;
  optional string outcome_side_enum = 12;
  optional string price = 13;
  optional string profit = 14;
  optional string quote_token = 15;
  optional int32 root_market_id = 16;
  optional string root_market_title = 17;
  optional int32 side = 18;
  optional string side_enum = 19;
  optional int32 status = 20;
  optional string status_enum = 21;
  repeated OrderTradeApiData trades = 22;
  optional int32 trading_method = 23;
  optional string trading_method_enum = 24;
  optional string trans_no = 25;
}

// OpenAPI order book / candle types (@opinion-labs/opinion-api).

message OrderbookLevel {
  optional string price = 1;
  optional string size = 2;
}

// OpenAPI `OpenapiPricePoint`: `p` (price), `t` (unix seconds).
message PricePoint {
  optional string p = 1;
  optional int64 t = 2;
}

// --- Domain messages (aligned with SDK transformMarketData / transformChildMarketData output) ---

message Market {
  string market_id = 1;
  string market_title = 2;
  string slug = 3;
  string condition_id = 4;
  string chain_id = 5;
  string quote_token = 6;
  int32 status = 7;
  string status_enum = 8;
  // API may return unix ms numbers; adapter normalizes to string for stable wire format.
  string created_at = 9;
  string cutoff_at = 10;
  string resolved_at = 11;
  string yes_token_id = 12;
  string no_token_id = 13;
  string result_token_id = 14;
  string yes_label = 15;
  string no_label = 16;
  string volume = 17;
  bool is_incentivized = 18;
  repeated ChildMarket child_markets = 19;
  string question_id = 20;
  string rules = 21;
  google.protobuf.Struct collection = 22;
}

message ChildMarket {
  string market_id = 1;
  string market_title = 2;
  string slug = 3;
  string condition_id = 4;
  string chain_id = 5;
  string quote_token = 6;
  int32 status = 7;
  string status_enum = 8;
  string created_at = 9;
  string cutoff_at = 10;
  string resolved_at = 11;
  string yes_token_id = 12;
  string no_token_id = 13;
  string result_token_id = 14;
  string yes_label = 15;
  string no_label = 16;
  string volume = 17;
  string question_id = 18;
  string rules = 19;
}

// Mirrors OpenapiQuoteTokenDataOpenApi / SDK QuoteTokenData.
message QuoteToken {
  string chain_id = 1;
  string created_at = 2;
  string ctf_exchange_address = 3;
  int32 decimal = 4;
  string id = 5;
  string quote_token_address = 6;
  string quote_token_name = 7;
  string symbol = 8;
}
