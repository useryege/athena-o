name: athena-bsc-transaction-indexer

services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_DB: bsc_inbound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - bsc-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  indexer:
    image: ${BSC_INDEXER_IMAGE:-athena-bsc-transaction-indexer:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATHENA_POSTGRES_AUTO_MIGRATE: "true"
      ATHENA_BSC_INBOUND_POSTGRES_DSN: "host=postgres port=5432 user=${POSTGRES_USER:-athena} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=bsc_inbound sslmode=disable"
      ATHENA_BSC_INBOUND_NODE_RPC_URL: ${ATHENA_BSC_INBOUND_NODE_RPC_URL:?ATHENA_BSC_INBOUND_NODE_RPC_URL is required}
      ATHENA_BSC_INBOUND_GRPC_LISTEN_ADDRESS: 0.0.0.0:8130
      ATHENA_BSC_INBOUND_TELEMETRY_LISTEN_ADDRESS: 0.0.0.0:8131
      ATHENA_BSC_INBOUND_SCAN_BATCH_SIZE: ${ATHENA_BSC_INBOUND_SCAN_BATCH_SIZE:-1000}
      ATHENA_BSC_INBOUND_FETCH_CONCURRENCY: ${ATHENA_BSC_INBOUND_FETCH_CONCURRENCY:-64}
      ATHENA_BSC_INBOUND_POLL_INTERVAL: ${ATHENA_BSC_INBOUND_POLL_INTERVAL:-1s}
    ports:
      - "${BSC_INDEXER_GRPC_BIND_ADDRESS:-0.0.0.0}:${BSC_INDEXER_GRPC_PORT:-8130}:8130"
      - "${BSC_INDEXER_TELEMETRY_BIND_ADDRESS:-127.0.0.1}:${BSC_INDEXER_TELEMETRY_PORT:-8131}:8131"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8131/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  bsc-postgres-data:
    name: ${BSC_INDEXER_POSTGRES_VOLUME:-athena-bsc-transaction-indexer-postgres-data}
