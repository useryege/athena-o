<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Athena Admin</title>
    <base href="/admin/">
    <meta name="athena-deployment-base-href" content="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <script>
        (() => {
            let mode = 'system';
            try {
                const saved = JSON.parse(localStorage.getItem('athena.admin.preferences') || '{}');
                if (Number(saved.version) >= 6 && (saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'system')) mode = saved.theme;
            } catch (_) {}
            const resolved = mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = resolved;
        })();
    </script>
</head>

<body>
    <noscript>
        <p>
        Your browser does not support JavaScript. Please enable JavaScript to use Athena Admin.
        </p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/entry/admin.tsx"></script>
</body>
</html>
